<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TEA CANVAS v5</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Gowun+Batang:wght@700&display=swap">
<style>
:root{
  --white:#FFFFFF; --g1:#ECECEC; --g0:#F3F3F3; --g2:#737373; --black:#000000;
  --ink:#111111; --dark:#333333; --line:#E5E5E5;
  --tip:#F3F3F3; --r-card:14px; --r-btn:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;background:#F2F2F0;color:var(--ink);line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow:hidden}

/* ---------- exhibition stage ---------- */
.stage{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--gap,40px);padding:24px 16px}
.ex-top{text-align:center}
.ex-top .ex-logo{font-size:var(--logo,30px);font-weight:800;letter-spacing:.06em}
.ex-top .ex-line{font-size:var(--line,17px);color:#555;margin-top:8px;letter-spacing:-.01em}
.ex-bottom{display:flex;align-items:center;gap:10px;font-size:var(--hint,15px);color:#737373}
.ex-bottom i{width:8px;height:8px;border-radius:50%;background:#111;animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.phone-wrap{position:relative;flex-shrink:0}
.phone-wrap .phone{position:absolute;left:0;top:0;transform-origin:0 0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none}
textarea{resize:none}

/* ---------- phone frame ---------- */
/* iPhone 16 · 393 × 852 */
.phone{width:393px;height:852px;background:#fff;border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column;
  box-shadow:0 0 0 9px #161616;flex-shrink:0}
.appbar{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 20px;margin-top:6px}
.logo{font-size:16px;font-weight:800;letter-spacing:0;padding:0}
/* 로고 12-K: 풍미 11색 막 마른 번짐 띠 + 글자 */

.ex-top .ex-logo{letter-spacing:0;display:inline-block}

.bell{width:32px;height:32px;display:grid;place-items:center}
.view{flex:1;overflow-y:auto;position:relative;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.nav{height:60px;flex-shrink:0;border-top:1px solid var(--line);display:flex;padding-bottom:4px}
.nav button{flex:1;font-size:15px;font-weight:700;color:#A3A3A3}
.nav button.on{color:#000}

/* ---------- layout ---------- */
.scr{padding:4px 22px 28px;min-height:100%;display:flex;flex-direction:column}
.fade{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.spacer{flex:1;min-height:16px}
.center{text-align:center}

.stepbar{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:10px}
.back{width:30px;height:30px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;flex-shrink:0}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:3px;background:#DADADA;transition:width .4s,background .4s}
.dots i.done{background:#333}
.dots i.on{background:#333;width:18px}
.stepnum{font-size:12.5px;color:var(--g2);min-width:30px;text-align:right}

.kicker{font-size:12px;color:var(--g2);text-align:center}
h1.t{font-size:20px;font-weight:700;text-align:center;letter-spacing:-.3px}
.sub{font-size:13px;color:var(--g2);text-align:center;margin-top:6px}
h3.sec{font-size:15px;font-weight:700;margin:22px 0 10px}
.muted{color:var(--g2)}

.breath{animation:breath 4s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.035)}}

.btn{display:block;width:100%;height:52px;border-radius:var(--r-btn);background:#000;color:#fff;font-size:15.5px;font-weight:700;flex-shrink:0;transition:background .2s,transform .15s}
.btn:hover{background:#262626}
.btn:active{transform:scale(.985)}
.btn.dark{background:var(--dark)}
.btn.dark:hover{background:#444}
.btn.line{background:#fff;color:#111;border:1px solid #CFCFCF}
.btn.line:hover{background:var(--g0)}
.btn:disabled{background:#CFCFCF}
.btn + .btn{margin-top:12px}
.link{display:block;margin:14px auto 0;font-size:13.5px;color:var(--g2);padding:4px 8px}
.link.u{text-decoration:underline;text-underline-offset:3px}

.card{background:var(--g0);border-radius:var(--r-card);padding:14px 16px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;height:31px;padding:0 13px;border-radius:16px;background:#E6E6E6;font-size:13px;white-space:nowrap;transition:background .15s}
.chip.w{background:#fff}
.chip.sel{background:#000;color:#fff}
.tip{background:var(--tip);border-radius:var(--r-card);padding:11px 14px;font-size:12.5px;color:#666;margin-top:14px}
.tip b{color:#111;margin-right:8px}

.seg{display:flex;background:var(--g1);border-radius:20px;width:216px;margin:6px auto 16px;padding:0}
.seg button{flex:1;height:36px;border-radius:18px;font-size:13.5px;font-weight:600;color:#222}
.seg button.on{background:#000;color:#fff}
.seg.wide{width:100%}

/* ---------- home ---------- */
.hello{font-size:20px;font-weight:700;line-height:1.55;margin:26px 4px 0}
.last{display:flex;gap:16px;align-items:center;width:100%;text-align:left;border:1px solid #000;padding:14px 16px}
.last b{font-size:13.5px;font-weight:600;display:block;margin-bottom:6px}
.last span{display:block;font-size:13px}
.recent{display:flex;justify-content:space-between}
.recent button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}

/* ---------- inputs ---------- */
.ask{font-size:21px;font-weight:500;line-height:1.55;margin:30px 8px 0}
.pill-in{display:block;width:100%;height:48px;border:1px solid #CFCFCF;border-radius:24px;text-align:center;font-size:15px;font-weight:600;margin-top:12px}
.pill-in::placeholder{color:#222}
.pill-in:focus{border-color:#000}
.pill-in:focus::placeholder{color:#BDBDBD}
.cam{display:block;margin:14px auto 0;padding:6px}
.hint{font-size:12px;color:#9A9A9A;text-align:center;margin-top:4px}
.field{margin-top:18px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.field .box{display:flex;align-items:center;background:var(--g0);border-radius:12px;padding:0 16px;height:50px}
.field .box input{flex:1;min-width:0;font-size:15px}
.field .box span{color:var(--g2);font-size:14px}
.field textarea{display:block;width:100%;background:var(--g0);border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.6}
.field small{display:block;font-size:12px;color:var(--g2);margin-top:8px}
.field .two{display:flex;gap:10px}
.field .two .box{flex:1}
::placeholder{color:#A6A6A6}
.note{background:var(--g0);border-radius:var(--r-card);padding:16px 18px;margin-top:22px}
.note b{display:block;font-size:14px;margin-bottom:6px}
.note p{font-size:13px;color:var(--g2)}

/* ---------- tea confirm / guide ---------- */
.confirm{text-align:center;margin-top:70px}
.confirm .brand{font-size:15px}
.confirm .name{font-size:32px;font-weight:500;margin:6px 0}
.teacard{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:14px 18px;margin-top:18px}
.teacard b{font-size:18px;font-weight:700;display:block}
.teacard span{font-size:13px;color:var(--g2)}
.grow{display:flex;align-items:center;background:var(--g0);border-radius:var(--r-card);padding:13px 16px;margin-top:9px;font-size:13.5px}
.grow .k{width:96px;color:var(--g2);flex-shrink:0}
.grow .v{font-weight:700;font-size:15px}
.grow .v small{display:block;font-weight:400;font-size:12px;color:var(--g2)}

/* ---------- feel ---------- */
.feelcard{background:var(--g0);border-radius:var(--r-card);padding:12px 14px 14px;margin-top:10px}
.feelcard .q{font-size:12.5px;color:var(--g2);margin-bottom:9px}
.feelcard .q b{font-size:15px;color:#111;margin-right:9px}
.timerchip{display:flex;justify-content:center;margin-top:10px}
.timerchip button{font-size:12.5px;background:var(--g0);border-radius:14px;padding:5px 12px;color:#444}

/* ---------- chat ---------- */
.tearow{display:flex;align-items:center;gap:16px;justify-content:center;margin:2px 0 14px}
.tearow b{display:block;font-size:15px}
.tearow .tm{font-size:12.5px;color:var(--g2)}
.pillbtn{display:inline-block;margin-top:4px;font-size:11.5px;border:1px solid #CFCFCF;border-radius:13px;padding:2px 10px}
#msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.msg{max-width:82%;padding:9px 14px;border-radius:18px;font-size:14px;line-height:1.5;white-space:pre-line;animation:fade .3s ease}
.msg.bot{background:var(--g0);align-self:flex-start}
.msg.me{background:#fff;border:1px solid #CFCFCF;align-self:flex-end}
.msg.typing{color:var(--g2)}
.msg.sys{align-self:center;background:none;font-size:12px;color:var(--g2);padding:2px}
.chatfoot{position:sticky;bottom:0;background:#fff;padding:10px 0 4px;margin-top:auto}
.inrow{display:flex;align-items:center;background:var(--g0);border-radius:26px;padding:5px 5px 5px 18px;margin-bottom:10px}
.inrow input{flex:1;font-size:14.5px;min-width:0}
.send{width:38px;height:38px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;flex-shrink:0}
.voiceorb{width:220px;height:220px;margin:18px auto 22px;display:block;transition:transform .4s}
.voiceorb.listen{animation:listen 1.4s ease-in-out infinite}
@keyframes listen{50%{transform:scale(1.07)}}
.heard{font-size:14px;text-align:center;margin-top:14px;min-height:22px}

/* ---------- loaders ---------- */
.loader{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-bottom:40px}
@keyframes rot{to{transform:rotate(360deg)}}
.phases{display:flex;align-items:flex-start;justify-content:center;gap:14px;margin-top:30px}
.phases .ph{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;color:var(--g2);width:84px}
.phases .ph i{width:9px;height:9px;border-radius:50%;background:#D4D4D4}
.phases .ph.on{color:#000;font-weight:700}
.phases .ph.on i{background:#000}
.phases .ar{color:#999;margin-top:-4px}

/* ---------- depth / compare ---------- */
.opt{display:flex;align-items:center;gap:12px;background:var(--g0);border-radius:var(--r-card);padding:13px 14px;margin-top:10px;width:100%;text-align:left}
.opt .ic{width:24px;display:grid;place-items:center;flex-shrink:0}
.opt .tx{flex:1;min-width:0}
.opt b{font-size:15px}
.opt b small{font-weight:400;font-size:12px;color:var(--g2);margin-left:4px}
.opt p{font-size:12.5px;color:var(--g2)}
.opt .saved{font-size:11.5px;color:#555;font-weight:600}
.opt .chev{color:#888;font-size:18px}
.rounds{display:flex;gap:6px}
.rounds button{height:30px;min-width:34px;padding:0 9px;border-radius:15px;background:#fff;font-size:13px}
.rounds button.done{background:#000;color:#fff}
.tabs4{display:flex;gap:8px;margin:18px 0 14px;overflow-x:auto}
.tabs4 button{flex:1;min-width:64px;height:40px;border-radius:20px;background:var(--g0);font-size:14px}
.tabs4 button.on{background:var(--dark);color:#fff;font-weight:700}
.cmp{display:flex;gap:12px;align-items:center;background:var(--g0);border-radius:var(--r-card);padding:14px 14px;margin-top:10px}
.cmp .lb{display:flex;align-items:center;gap:9px;width:104px;flex-shrink:0;font-size:14px;font-weight:700;border-right:1px solid #DDD;align-self:stretch}
.cmp .bd{font-size:13px;line-height:1.6;flex:1}
.cmp .bd ul{list-style:none}
.cmp .bd li::before{content:"·";margin-right:6px}

/* ---------- done / tag ---------- */
.wave{height:120px;position:relative;margin:4px 0 10px;overflow:hidden}
.wave i{position:absolute;border-radius:50%;filter:blur(14px)}
.rowlink{display:flex;align-items:center;gap:14px;width:100%;background:var(--g0);border-radius:var(--r-card);padding:16px 18px;margin-top:12px;font-size:15px;font-weight:700;text-align:left}
.rowlink .sq{width:16px;height:16px;border-radius:4px;background:#C8C8C8}
.rowlink .chev{margin-left:auto;font-weight:400}
.tagcard{border:1px solid #000;border-radius:18px;padding:22px 20px;text-align:center;margin-top:8px}
.tagcard .nm{font-size:18px;font-weight:700;margin-top:4px}
.tagcard .meta{font-size:12.5px;color:var(--g2)}
.tagcard .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:16px}
.tagcard .line{font-size:13.5px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}

/* ---------- canvas ---------- */
.canvas{position:relative;width:100%;aspect-ratio:1/1;background:#FCFBFA;border:1px solid #BDBDBD;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.canvas.bare{background:none;border:0}
.canvas .ax{position:absolute;background:#E6E6E6}
.canvas.bare .ax{background:#555}
.canvas .ax.h{left:0;right:0;top:50%;height:1px}
.canvas .ax.v{top:0;bottom:0;left:50%;width:1px}
.canvas .lbl{position:absolute;font-size:11.5px;color:#9A9A9A;pointer-events:none}
.drop{position:absolute;border-radius:50%;transform:translate(-50%,-50%);filter:blur(1.5px);pointer-events:none;transition:width .05s,height .05s}
.cap{font-size:13px;color:var(--g2);text-align:center;margin-top:10px}
.stars{display:flex;gap:6px;justify-content:center;margin:6px 0}
.stars button{font-size:26px;color:#D5D5D5;line-height:1}
.stars button.on{color:#000}
.photo{display:flex;align-items:center;justify-content:center;height:120px;border-radius:2px;font-size:12.5px;color:#6b5a3a;
  background:linear-gradient(135deg,#d9c3a1,#b98b56 40%,#e9dcc6 70%,#c7a77c);position:relative;overflow:hidden}
.photo::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#c98a3d 0 45%,#f4ead9 47% 60%,transparent 62%);left:38%;top:22%}
.photo span{position:absolute;left:10px;bottom:6px;background:rgba(255,255,255,.75);padding:1px 7px;border-radius:8px;z-index:1}
.addphoto{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border:1px dashed #BDBDBD;border-radius:12px;font-size:13.5px;color:var(--g2);width:100%}

/* ---------- archive ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px 10px;margin-top:10px}
.gitem{display:flex;align-items:center;gap:14px;text-align:left}
.gitem div{font-size:13px;line-height:1.7}
.endline{border-top:1px solid #777;margin:34px 6px 12px}
.detail{border:1px solid #000;padding:18px 18px 14px;margin-top:10px}
.dhead{display:flex;gap:18px;align-items:center;margin-bottom:16px}
.dhead div{font-size:13.5px;line-height:1.7}
.dcomment{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-top:12px}
.memo{border:1px solid #000;padding:16px 18px;margin-top:20px;font-size:13.5px;line-height:1.75}
.memo h4{font-size:13.5px;font-weight:500;margin-bottom:8px}
.memo p+p{margin-top:10px}
.memo dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin-top:10px;font-size:12.5px;color:var(--g2)}
.backtext{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:4px 0}

/* ---------- stats / my ---------- */
.summary{display:flex;gap:16px;align-items:center;background:var(--g0);border-radius:var(--r-card);padding:16px}
.summary b{font-size:14.5px;display:block;line-height:1.5}
.summary span{font-size:12.5px;color:var(--g2)}
.fits{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.fits div{background:var(--g0);border-radius:10px;padding:11px 8px;font-size:12.5px;text-align:center;line-height:1.45}
.rec{display:flex;align-items:center;gap:14px;background:var(--g0);border-radius:var(--r-card);padding:11px 14px;margin-top:8px;width:100%;text-align:left}
.rec b{display:block;font-size:14.5px}
.rec span{font-size:12px;color:var(--g2)}
.rec .chev{margin-left:auto}
.aic{font-size:13.5px;line-height:1.8}
.profile{display:flex;align-items:center;gap:20px;margin:22px 0 6px}
.pimg{width:64px;height:64px;border-radius:50%;background:var(--g1);display:grid;place-items:center;font-size:11px;text-align:center;line-height:1.3;flex-shrink:0}
.profile b{font-size:18px}
.profile p{font-size:13px;line-height:1.5}
.statrow{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px}
.statrow div{background:var(--g1);border-radius:10px;text-align:center;padding:16px 4px 12px}
.statrow b{display:block;font-size:24px;font-weight:500;line-height:1.2}
.statrow span{font-size:12px}
.setrow{display:block;width:100%;text-align:left;background:var(--g0);border-radius:8px;padding:9px 14px;font-size:14px;color:#444;margin-top:10px}
.noti{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.noti p{font-size:13.5px;line-height:1.55}
.noti span{font-size:11.5px;color:var(--g2)}
.state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:30px}
.state h2{font-size:19px;font-weight:700;margin-top:22px}
.state p{font-size:13.5px;color:var(--g2);margin-top:10px}

/* ---------- overlays ---------- */
.toast{position:absolute;left:50%;bottom:76px;transform:translate(-50%,8px);background:rgba(0,0,0,.84);color:#fff;font-size:12.5px;padding:9px 15px;border-radius:18px;
  opacity:0;transition:.25s;pointer-events:none;max-width:86%;text-align:center;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheetWrap{position:absolute;inset:0;background:rgba(0,0,0,.07);display:none;z-index:40;align-items:flex-end}
.sheetWrap.open{display:flex}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:12px 22px 24px;max-height:90%;overflow-y:auto;animation:up .3s ease}
.grab{width:52px;height:5px;border-radius:3px;background:#000;margin:0 auto 18px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}

/* ---------- v2 components ---------- */
.opt,.rowlink,.chip,.noti,.setrow{transition:background .15s}
button.opt:hover,.rowlink:hover,.setrow:hover{background:#ECECEC}
button.chip:hover{background:#DADADA}
button.chip.sel:hover{background:#000}
canvas.wcd{display:block;flex-shrink:0}
canvas.wcd.big{margin:14px auto}
.center canvas.wcd{margin:0 auto}
.in-fwd{animation:inFwd .45s cubic-bezier(.2,.7,.3,1)}
.in-back{animation:inBack .45s cubic-bezier(.2,.7,.3,1)}
.in-fade{animation:fade .45s ease}
@keyframes inFwd{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}

/* home */
.scr.scr-home{padding:0}
.home{display:flex;flex-direction:column;flex:1}
.home .hello{margin:22px 26px 0}
.home-q{font-size:30px;font-weight:700;line-height:1.35;letter-spacing:-.6px;margin:30px 26px 0}
/* 제목 시안(?hq=…) */
.home-q.center{text-align:center}
.home-q.light{font-weight:500}
.home-q.light.center{text-align:center}
.home-q.small{font-size:24px;margin-top:26px}
.home-q.small.center{text-align:center}
.home-q.serif{font-family:'Gowun Batang',serif;font-weight:700;font-size:28px}
.home-q.serif.center{text-align:center}
.home-q.split{font-size:30px}
.home-q.split em{display:block;font-style:normal;font-size:20px;font-weight:500;color:#555;margin-bottom:4px}
.home-q.split.center{text-align:center}
.home-q.low{margin-top:auto;padding-top:20px}
.home-note{font-size:12.5px;color:#A6A6A6;text-align:center;margin:0 26px 12px}
.home-drop{flex:1;display:flex;align-items:center;justify-content:center;min-height:300px;position:relative;padding-top:24px}
.home-drop canvas.d3{display:block}
.hd-stage{display:flex;flex-direction:column;align-items:center;gap:4px}
.hd-label{min-height:64px;margin-bottom:-14px;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease}
.hd-label.on{opacity:1;transform:none}
.hd-label b{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:600;letter-spacing:.02em;line-height:1.1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;transition:color .4s}
.hd-label b em{font-style:normal}
.hd-drop{position:relative;display:flex;flex-direction:column;align-items:center}
.hw-paper{display:block;background:transparent}
.hd-drop canvas{position:relative;z-index:1}
.hd-shadow{width:62%;height:26px;margin-top:-22px;border-radius:50%;filter:blur(3px)}
.hd-label span{font-size:12.5px;color:var(--g2);margin-top:2px}
.hd-label i{width:12px;height:12px;border-radius:50%;display:block;margin-bottom:6px}
.d3wrap{display:flex;flex-direction:column;align-items:center;margin:10px 0 6px}
.d3wrap canvas.d3{display:block}
.d3hint{font-size:11.5px;color:var(--g2);margin-top:2px}
.home-cap{text-align:center;font-size:13px;color:var(--g2);margin:0 0 18px}
.home-cap b{color:#111;font-weight:700}
.bigbtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:108px;padding:22px 26px;background:#000;color:#fff;
  text-align:left;font-size:21px;font-weight:700;line-height:1.35;letter-spacing:-.2px;flex-shrink:0;transition:background .2s}
.bigbtn:hover{background:#222}
.bigbtn:active{background:#333}
.bigbtn i{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;transition:transform .3s}
.bigbtn:hover i{transform:translateX(3px)}
/* 둥근 버튼(알약 모양) */
.home .bigbtn{width:auto;min-height:0;height:64px;margin:0 22px 18px;padding:0 10px 0 28px;border-radius:32px;font-size:19px}
.home .bigbtn i{width:44px;height:44px}

/* camera button */
.cambtn{display:flex;flex-direction:column;align-items:center;gap:6px;margin:18px auto 0;font-size:12.5px;color:#444}
.cambtn .ring{width:56px;height:56px;border-radius:50%;border:1px solid #CFCFCF;display:grid;place-items:center;transition:background .2s,border-color .2s}
.cambtn .ring svg{transform:scale(.72)}
.cambtn:hover .ring{background:var(--g0);border-color:#999}
.cambtn:active .ring{background:var(--g1)}

/* 2-axis canvas */
.cvbox{position:relative;width:100%;aspect-ratio:1/1;border:0;border-radius:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.cvbox canvas{display:block;width:100%;height:100%;cursor:crosshair}
.cvbox .lbl{position:absolute;font-size:11px;color:#8C8C8C;pointer-events:none;background:rgba(255,255,255,.85);padding:0 4px;border-radius:4px}
.cvbox .lbl.t{top:6px;left:50%;transform:translateX(-50%)}
.cvbox .lbl.b{bottom:6px;left:50%;transform:translateX(-50%)}
.cvbox .lbl.l{left:6px;top:50%;transform:translateY(-50%)}
.cvbox .lbl.r{right:6px;top:50%;transform:translateY(-50%)}
.cvbox.sm .lbl{font-size:10px}
.axisguide{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#555;margin:14px 0 8px}
.axisguide b{font-weight:700;color:#111;margin-right:6px}
.cv-head{font-size:14px;text-align:center;margin:2px 0 12px;color:#444}
.cv-head b{color:#111}
.fav{display:flex;gap:16px;align-items:center;background:var(--g0);border-radius:14px;padding:14px 16px}
.fav b{display:block;font-size:14.5px;line-height:1.5}
.fav p{font-size:12.5px;color:var(--g2);margin-top:4px;line-height:1.55}
.chips.fl{margin-top:12px}
.chips.fl .chip{background:var(--g0);gap:6px}
.chips.fl .chip i{width:9px;height:9px;border-radius:50%}
.center-chips .chips{justify-content:center;margin:0 0 6px}

/* records list */
.search{display:flex;align-items:center;gap:10px;background:var(--g0);border-radius:24px;padding:0 16px;height:44px}
.search input{flex:1;min-width:0;font-size:14px}
.filters{margin:12px 0 4px;display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:6px}
.frow>span{width:34px;font-size:12.5px;font-weight:700;flex-shrink:0}
.fchip{height:29px;padding:0 12px;border-radius:15px;font-size:12.5px;border:1px solid #DCDCDC;color:#444;transition:background .15s,color .15s}
.fchip.on{background:#111;border-color:#111;color:#fff}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 8px;margin-top:18px}
.ritem{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;padding:4px 0;border-radius:12px;transition:background .15s}
.ritem:hover{background:var(--g0)}
.ritem b{font-weight:600;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.ritem span{color:var(--g2);font-size:11.5px}
.empty-q{grid-column:1/-1;text-align:center;color:var(--g2);font-size:13px;padding:40px 0}

/* detail */
.dtop{display:flex;justify-content:space-between;align-items:center}
.ghost{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:background .15s}
.ghost:hover{background:var(--g0)}
.dhead .dn{display:block;font-size:16px;font-weight:700}
.dhead span{display:block}

/* analysis infusion */
.infuse{position:relative;height:330px;display:flex;align-items:flex-end;justify-content:center;margin-top:8px}
.infuse #inf3d{margin-bottom:6px}
.floatzone{position:absolute;left:0;right:0;top:0;height:150px;pointer-events:none}
.ffloat{position:absolute;top:8px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:13px;background:#fff;border:1px solid #DDD;border-radius:16px;padding:5px 12px;
  animation:floatIn 1.45s cubic-bezier(.3,.6,.3,1) forwards}
.ffloat i{width:8px;height:8px;border-radius:50%}
@keyframes floatIn{0%{opacity:0;transform:translateY(8px)}18%{opacity:1;transform:none}55%{opacity:1;transform:none}100%{opacity:0;transform:translateY(120px) scale(.55)}}
.pulse{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle,#CFCFCF 0%,#E6E6E6 55%,rgba(230,230,230,0) 72%);animation:breath 1.8s ease-in-out infinite}
.done-drop{display:flex;justify-content:center;margin:6px 0 10px}

/* ---------- dev panel ---------- */
.dev{display:none;width:260px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;font-size:12.5px;position:fixed;right:20px;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;z-index:100}
.dev.show{display:block}
.dev h2{font-size:14px;margin-bottom:4px}
.dev h3{font-size:12px;color:var(--g2);font-weight:600;margin:14px 0 6px}
.dev .jump{display:flex;flex-wrap:wrap;gap:5px}
.dev .jump button{background:var(--g0);border-radius:6px;padding:4px 8px;font-size:12px}
.dev .jump button.add{background:#FFF1E6}
.dev label{display:flex;gap:8px;align-items:center;margin-top:6px;cursor:pointer}
.dev .acts button{display:block;width:100%;text-align:left;background:var(--g0);border-radius:6px;padding:6px 10px;margin-top:5px}
.dev p{color:var(--g2);line-height:1.6;margin-top:6px}
.dev .tag{background:#FFF1E6;border-radius:4px;padding:0 4px}

@media (max-width:700px){
  body{background:#fff}
  .stage{padding:0;gap:0}
  .ex-top,.ex-bottom{display:none}
  .phone-wrap{width:100%!important;height:100dvh!important}
  .phone-wrap .phone{position:relative;transform:none!important;width:100%;height:100dvh;border-radius:0;box-shadow:none}
}

/* =========================================================

/* =========================================================
   찻방울 수채화 렌더러
   - 변형한 다각형을 낮은 불투명도로 수십 장 겹쳐 번짐을 만든다
   - 한 방울 안의 풍미 색은 섞지 않고 구역을 나눠 각자 번진다(강한 풍미일수록 넓게)
   ========================================================= */
const DROP_STYLE = 'hybrid';   // 시안: hybrid(F) · wet(A) · split(B) · bloom(C) · motion(D) · fiber(E)
const WC = (()=>{
  const rng = seed => { let a = seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; };
  const hash = s => { let h=2166136261; for(const ch of String(s)){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; };
  const gauss = r => (r()+r()+r()-1.5)/1.5;
  const hex = h => { const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; };
  const rgba = (h,a) => { const [r,g,b]=hex(h); return `rgba(${r},${g},${b},${a})`; };
  const shade = (h,f) => { const [r,g,b]=hex(h).map(v=>Math.round(f<0?v*(1+f):v+(255-v)*f)); return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1); };
  const circle=(n,cx,cy,r,rand,wob=0)=>{ const pts=[]; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, rr=r*(1+wob*gauss(rand)); pts.push({x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr,v:.5+rand()}); } return pts; };
  function deform(pts,depth,vs,rand){
    for(let d=0;d<depth;d++){
      const out=[];
      for(let i=0;i<pts.length;i++){
        const a=pts[i], b=pts[(i+1)%pts.length], len=Math.hypot(b.x-a.x,b.y-a.y);
        out.push(a,{x:(a.x+b.x)/2+gauss(rand)*len*vs*a.v, y:(a.y+b.y)/2+gauss(rand)*len*vs*a.v, v:a.v*(.85+rand()*.3)});
      }
      pts=out;
    }
    return pts;
  }
  const toPath = pts => { const p=new Path2D(); pts.forEach((q,i)=>i?p.lineTo(q.x,q.y):p.moveTo(q.x,q.y)); p.closePath(); return p; };
  function layout(comps,rand){
    const cs=[...comps].sort((a,b)=>b.w-a.w), n=cs.length, a0=rand()*Math.PI*2;
    return cs.map((c,i)=>{
      if(i===0) return {...c,x:0,y:0,r:.5+.28*c.w};
      const a=a0+(i-1)*(Math.PI*2/Math.max(1,n-1))+gauss(rand)*.35, d=.3+.42*(1-c.w);
      return {...c,x:Math.cos(a)*d,y:Math.sin(a)*d,r:.24+.34*c.w};
    });
  }
  function bands(cs,rand,o){
    const ops=[], main=deform(circle(40,0,0,.93,rand,.02),2,o.clipVar*2,rand);
    const ang=rand()*Math.PI, ux=Math.cos(ang), uy=Math.sin(ang), vx=-uy, vy=ux;
    const tot=cs.reduce((s,c)=>s+c.w,0); let acc=-1;
    const order=[...cs]; if(order.length>2){ const s=order.shift(); order.splice(Math.floor(order.length/2),0,s); }
    order.forEach((c,ci)=>{
      const w=2*c.w/tot, first=ci===0, last=ci===order.length-1;
      let u0=acc, u1=acc+w; acc+=w; if(first) u0=-1.3; if(last) u1=1.3;
      const uc=(u0+u1)/2, ru=(u1-u0)/2+o.ov, rv=1.25, pts=[];
      for(let i=0;i<16;i++){ const a=i/16*Math.PI*2, u=uc+Math.cos(a)*ru, v=Math.sin(a)*rv; pts.push({x:u*ux+v*vx,y:u*uy+v*vy,v:.25+1.1*Math.abs(Math.cos(a))}); }
      for(let l=0;l<o.L;l++){
        const clip=toPath(deform(main,2,o.clipVar,rand));
        ops.push({key:c.key,path:toPath(deform(pts,3,o.regVar,rand)),clip,fill:rgba(c.c,o.alpha),clipStroke:o.rim?rgba(shade(c.c,-.3),o.rim):null,lw:1,blend:'source-over',t:l/o.L*.8+ci*.07});
      }
    });
    return ops;
  }
  const STYLES = {
    hybrid:(cs,rand)=>bands(cs,rand,{L:30,clipVar:.07,regVar:.12,alpha:.024,rim:.004,ov:.1}),
    split:(cs,rand)=>bands(cs,rand,{L:22,clipVar:.02,regVar:.05,alpha:.036,rim:0,ov:.09}),
    wet(cs,rand){
      const ops=[], L=40;
      cs.forEach((c,ci)=>{
        const base=deform(circle(10,c.x,c.y,c.r,rand,.06),2,.3,rand);
        for(let l=0;l<L;l++){
          const halo=l%4===0, b=halo?deform(circle(10,c.x,c.y,c.r*1.18,rand,.06),2,.3,rand):base;
          ops.push({key:c.key,path:toPath(deform(b,3,halo?.22:.15,rand)),fill:rgba(c.c,halo?.007:.014+.012*c.w),stroke:halo?null:rgba(shade(c.c,-.3),.012),lw:1,t:l/L*.8+ci*.06});
        }
      });
      return ops;
    },
    bloom(cs,rand){
      const ops=[], c0=cs[0], main=deform(circle(10,0,0,.92,rand,.08),2,.3,rand);
      for(let l=0;l<26;l++) ops.push({key:c0.key,path:toPath(deform(main,3,.15,rand)),fill:rgba(c0.c,.014),stroke:rgba(shade(c0.c,-.3),.008),lw:1,t:l/26*.5});
      cs.forEach((c,ci)=>{
        for(let b=0,nb=2+Math.round(c.w*3);b<nb;b++){
          const base=deform(circle(9,c.x+gauss(rand)*c.r*.45,c.y+gauss(rand)*c.r*.45,c.r*(.3+rand()*.35),rand,.12),2,.4,rand);
          for(let l=0;l<9;l++) ops.push({key:c.key,path:toPath(deform(base,3,.14,rand)),fill:rgba(c.c,.02),stroke:rgba(shade(c.c,-.25),.028),lw:1,t:.25+l/9*.5+ci*.04});
        }

    },
    motion(cs,rand){
      const ops=[], dir=rand()*Math.PI*2, ux=Math.cos(dir), uy=Math.sin(dir);
      cs.forEach((c,ci)=>{
        const rc=c.r*.78, nx=cs[(ci+1)%cs.length].c;
        for(let k=10;k>=1;k--){ const o=k*rc*.11; ops.push({key:c.key,circle:[c.x-ux*o,c.y-uy*o,rc*1.05],grad:[[0,rgba(nx,.06*(1-k/11))],[.7,rgba(nx,.05*(1-k/11))],[1,rgba(nx,0)]],t:ci*.08+(10-k)/10*.4}); }
        ops.push({key:c.key,circle:[c.x+uy*rc*.16,c.y-ux*rc*.16,rc*1.12],grad:[[0,rgba(nx,.45)],[.75,rgba(nx,.38)],[1,rgba(nx,0)]],t:.45+ci*.08});
        ops.push({key:c.key,circle:[c.x,c.y,rc],grad:[[0,rgba(c.c,.82)],[.86,rgba(c.c,.78)],[1,rgba(c.c,0)]],t:.6+ci*.08});
      });
      return ops;
    },
    fiber(cs,rand){
      const ops=[];
      cs.forEach((c,ci)=>{
        const base=circle(12,c.x,c.y,c.r*.8,rand,.03);
        for(let l=0;l<18;l++) ops.push({key:c.key,path:toPath(deform(base,3,.08,rand)),fill:rgba(c.c,.032),t:l/18*.45+ci*.05});
        for(let f=0,nf=Math.round(260*c.w)+100;f<nf;f++){
          const th=rand()*Math.PI*2; let r=c.r*(.6+.3*rand()), x=c.x+Math.cos(th)*r, y=c.y+Math.sin(th)*r, a=th;
          const p=new Path2D(); p.moveTo(x,y); const seg=c.r*(.02+.09*rand()*rand());
          for(let s=0;s<5;s++){ a+=gauss(rand)*.7; const nx=x+Math.cos(a)*seg, ny=y+Math.sin(a)*seg; p.quadraticCurveTo(x+Math.cos(a+.6)*seg*.5,y+Math.sin(a+.6)*seg*.5,nx,ny); x=nx; y=ny; }
          ops.push({key:c.key,path:p,stroke:rgba(shade(c.c,-.15),.035+.09*rand()),lw:.6,open:true,t:.35+rand()*.6});
        }
      });
      return ops;
    },
  };
  const plans=new Map();
  function plan(drop,style){
    const k=style+'|'+drop.id+'|'+drop.comps.map(c=>c.key+c.c+c.w.toFixed(2)).join();
    if(!plans.has(k)){ if(plans.size>400) plans.clear(); const rand=rng(hash(k)); plans.set(k,STYLES[style](layout(drop.comps,rand),rand).sort((a,b)=>a.t-b.t)); }
    return plans.get(k);
  }
  const ease = t => 1-Math.pow(1-t,3);
  // prog 0→1: 반경이 퍼지며 레이어가 차례로 스며든다. keys를 주면 풍미별로 따로 스며든다
  function draw(ctx,drop,cx,cy,R,prog=1,alpha=1,keys=null,style=DROP_STYLE){
    const ops=plan(drop,style), s=keys?R:R*(.3+.7*ease(Math.min(1,prog*1.15)));
    ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s); ctx.globalAlpha=alpha;
    for(const op of ops){
      const p=keys?keys[op.key]:prog;
      if(p==null || op.t>p) continue;
      ctx.globalCompositeOperation=op.blend||'multiply';
      if(op.clip){ ctx.save(); ctx.clip(op.clip); }
      if(op.circle){ const [x,y,r]=op.circle, g=ctx.createRadialGradient(x,y,0,x,y,r); op.grad.forEach(([o,c])=>g.addColorStop(o,c)); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }

        if(op.stroke){ ctx.strokeStyle=op.stroke; ctx.lineWidth=op.lw/s; ctx.stroke(op.path); }
        if(op.clipStroke){ ctx.strokeStyle=op.clipStroke; ctx.lineWidth=op.lw*2/s; ctx.stroke(op.clip); }
      }

  function grain(ctx,w,h,whole=false,amt=.3){
    if(!pat){ const c=document.createElement('canvas'); c.width=c.height=160; const x=c.getContext('2d'), d=x.createImageData(160,160), r=rng(7);

})();

/* =========================================================
   고운 점묘 찻방울 (캔버스용)
   한 잔 = 찻물 색(비중 .5) + 풍미 색(대화에서 나온 강도). 원 안에 아주 고운 점을 고르게 깔고,
   점마다 그 자리의 색 비중대로 색을 고른다: 강한 색은 가운데, 약한 색은 가장자리. 흐림 없음.
   ========================================================= */
const CANVAS_BG='#FFFFFF';
/* 물처럼 투명하게: 색을 밝게 들어 올리고, 점은 반투명, 아래에 아주 옅은 물빛을 깐다 */
const WATER={lift:.28,sat:1.05,dotA:.42,wash:.16};
const DD_UNUSED=(()=>{
  const hex=h=>{ const n=parseInt(h.slice(1),16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]; };
  const lift=(c,l=.04,s=1.15)=>{ const L=.2126*c[0]+.7152*c[1]+.0722*c[2]; return c.map(v=>{ v=Math.max(0,Math.min(1,L+(v-L)*s)); return v+(1-v)*l; }); };
  const css=c=>`rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`;
  const ZC=new Map();
  function zones(drop){
    if(ZC.has(drop.id)) return ZC.get(drop.id);
    const r=WC.rng(WC.hash(drop.id+'z')), tot=drop.comps.reduce((s,c)=>s+c.w,0), cs=[...drop.comps].sort((a,b)=>b.w-a.w), a0=r()*6.283;
    const Z=cs.map((c,i)=>{ const share=c.w/tot, rgb=lift(hex(c.c),WATER.lift,WATER.sat), col=css(rgb); if(i===0) return {col,rgb,share,x:0,y:0,s:.7};
      const a=a0+(i-1)*6.283/Math.max(1,cs.length-1)+(r()-.5)*.6, d=.4*(1-share*.8); return {col,rgb,share,x:Math.cos(a)*d,y:Math.sin(a)*d,s:.55*(.7+share)}; });
    ZC.set(drop.id,Z); return Z;
  }
  // 점 목록(반지름 1 기준) — 기록마다 늘 같은 모양
  const PC=new Map();
  function points(drop,N){
    const k=drop.id+'|'+N; if(PC.has(k)) return PC.get(k); if(PC.size>300) PC.clear();
    const Z=zones(drop), r=WC.rng(WC.hash(k)), out=new Array(N);
    for(let i=0;i<N;i++){ const a=r()*6.2832, rr=Math.sqrt(r())*(1+(r()<.05?r()*.08:0)), x=Math.cos(a)*rr, y=Math.sin(a)*rr;
      let ws=0; const w=Z.map(z=>{ const q=z.share*Math.exp(-((x-z.x)**2+(y-z.y)**2)/(2*z.s*z.s)); ws+=q; return q; });
      let t=r()*ws, zi=0; for(;zi<w.length-1;zi++){ if(t<w[zi]) break; t-=w[zi]; }
      out[i]={x,y,c:Z[zi].col,o:r()}; }
    PC.set(k,out); return out;
  }
  // prog 0→1: 가운데부터 점이 퍼져 나가며 찍힌다
  function draw(ctx,drop,cx,cy,R,prog=1,alpha=1,dot=null){
    const d=dot||Math.max(.7,ctx.canvas.width*.0026), N=Math.max(60,Math.min(9000,Math.round(R*R/(d*d)*.62))), P=points(drop,N);
    const e=1-Math.pow(1-Math.min(1,prog),3);
    const Z=zones(drop), e0=prog<1?(.6+.4*e):1;
    // 물빛: 방울 자리에 찻물 색을 아주 옅게 깔아, 점 사이가 비지 않고 물에 비친 듯 보이게
    ctx.save(); const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*e0); const c0=Z[0].rgb;
    const rg=a=>`rgba(${Math.round(c0[0]*255)},${Math.round(c0[1]*255)},${Math.round(c0[2]*255)},${a})`;
    g.addColorStop(0,rg(WATER.wash*alpha*Math.min(1,prog*1.5))); g.addColorStop(.85,rg(WATER.wash*.8*alpha*Math.min(1,prog*1.5))); g.addColorStop(1,rg(0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R*e0,0,6.2832); ctx.fill(); ctx.restore();
    ctx.save(); ctx.globalAlpha=WATER.dotA*alpha;
    let last=null;
    for(const q of P){ if(prog<1&&q.o>e*1.05) continue; const s=prog<1?(.6+.4*e):1;
      if(q.c!==last){ ctx.fillStyle=q.c; last=q.c; } ctx.beginPath(); ctx.arc(cx+q.x*R*s,cy+q.y*R*s,d,0,6.2832); ctx.fill(); }
    ctx.restore();
  }
  return {draw};
})();

/* =========================================================
   꽃물 수채 찻방울 (캔버스용, 시안 037 "맑은 찻물")
   한 잔 = 꽃잎 몇 장 모양의 맑은 번짐. 꽃잎 색은 기록의 찻물·풍미 비중대로 나누고,
   꽃잎 안은 한쪽으로 색이 고이며, 마른 테두리와 색이 고인 진한 점, 종이 결 입자가 남는다.
   ========================================================= */
const BLOOM=(()=>{
  const P0={petals:[3,5],spread:.5,petalSize:1.15,layers:10,alpha:.045,lift:.4,sat:1.2,edge:.2,hot:.08,hotP:.55,hotBlur:.03,gran:.5,wet:.04};
  const hex=h=>{ const n=parseInt(h.slice(1),16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]; };
  const pastel=(c,l,s)=>{ const L=.2126*c[0]+.7152*c[1]+.0722*c[2]; return c.map(v=>{ v=Math.max(0,Math.min(1,L+(v-L)*s)); return v+(1-v)*l; }); };
  const shade=(c,f)=>c.map(v=>v*(1+f));
  const css=(c,a)=>`rgba(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)},${a})`;
  const mk=n=>{ const c=document.createElement('canvas'); c.width=c.height=Math.max(2,Math.ceil(n)); return c; };
  const g=r=>(r()+r()+r()-1.5)/1.5;
  function circle(n,cx,cy,rx,ry,rot,r,wob){ const o=[]; for(let i=0;i<n;i++){ const a=i/n*6.283, k=1+wob*g(r), x=Math.cos(a)*rx*k, y=Math.sin(a)*ry*k;
    o.push({x:cx+x*Math.cos(rot)-y*Math.sin(rot),y:cy+x*Math.sin(rot)+y*Math.cos(rot),v:.5+r()}); } return o; }
  function deform(pts,depth,vs,r){ for(let d=0;d<depth;d++){ const out=[]; for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length], l=Math.hypot(b.x-a.x,b.y-a.y);
    out.push(a,{x:(a.x+b.x)/2+g(r)*l*vs*a.v,y:(a.y+b.y)/2+g(r)*l*vs*a.v,v:a.v*(.85+r()*.3)}); } pts=out; } return pts; }
  const path=(x,pts)=>{ x.beginPath(); pts.forEach((q,i)=>i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y)); x.closePath(); };
  const SP=new Map();
  function sprite(drop,R){
    const p=P0, key=drop.id+'|'+Math.round(R)+'|'+drop.comps.map(c=>c.c+c.w.toFixed(2)).join(); if(SP.has(key)) return SP.get(key); if(SP.size>250) SP.clear();
    const r=WC.rng(WC.hash(key)), P=Math.ceil(R*3), c=P/2, cv=mk(P), x=cv.getContext('2d');
    const cs=[...drop.comps].sort((a,b)=>b.w-a.w), tot=cs.reduce((s,q)=>s+q.w,0);
    const nP=p.petals[0]+Math.floor(r()*(p.petals[1]-p.petals[0]+1)), a0=r()*6.283;
    const petals=[]; for(let i=0;i<nP;i++){ let u=r()*tot, ci=0; for(;ci<cs.length-1;ci++){ if(u<cs[ci].w) break; u-=cs[ci].w; } petals.push(hex(cs[ci].c)); }
    x.globalCompositeOperation='multiply';
    petals.forEach((col,i)=>{
      const a=a0+i/nP*6.283+g(r)*.4, d=R*(p.spread*(.35+.45*r())), cx=c+Math.cos(a)*d, cy=c+Math.sin(a)*d;
      const rx=R*(.42+.3*r())*p.petalSize, ry=rx*(.55+.4*r()), rot=a+(r()-.5);
      const base=deform(circle(9,cx,cy,rx,ry,rot,r,.15),2,.38,r), tone=pastel(col,p.lift,p.sat);
      const ga=r()*6.283, gx=cx+Math.cos(ga)*rx*.45, gy=cy+Math.sin(ga)*ry*.45, grd=x.createRadialGradient(gx,gy,0,gx,gy,Math.max(rx,ry)*1.35);
      grd.addColorStop(0,css(tone,p.alpha*1.6)); grd.addColorStop(.55,css(tone,p.alpha*.9)); grd.addColorStop(1,css(tone,p.alpha*.25));
      for(let l=0;l<p.layers;l++){ path(x,deform(base,2,.2,r)); x.fillStyle=grd; x.fill(); }
      x.save(); path(x,deform(base,2,.06,r)); x.strokeStyle=css(shade(tone,-.35),p.edge); x.lineWidth=Math.max(.7,R*.012); x.stroke(); x.restore();
      if(r()<p.hotP){ const hx=cx+g(r)*rx*.35, hy=cy+g(r)*ry*.35, hr=rx*(.18+.22*r()), hb=deform(circle(8,hx,hy,hr,hr*(.7+.3*r()),r()*3,r,.25),3,.3,r);
        x.save(); x.filter=`blur(${Math.max(.5,R*p.hotBlur)}px)`; for(let l=0;l<6;l++){ path(x,deform(hb,2,.2,r)); x.fillStyle=css(pastel(col,0,1.4),p.hot); x.fill(); } x.restore(); }
      x.save(); path(x,base); x.clip(); x.fillStyle=css(shade(tone,-.3),.35);
      for(let k=0;k<Math.min(400,Math.round(rx*ry*p.gran*.03));k++){ x.fillRect(cx+g(r)*rx,cy+g(r)*ry,Math.max(.6,R*.008),Math.max(.6,R*.008)); } x.restore();
    });
    const w=mk(P), wx=w.getContext('2d'); wx.filter=`blur(${R*p.wet}px)`; wx.drawImage(cv,0,0); x.globalCompositeOperation='source-over'; x.globalAlpha=.55; x.drawImage(w,0,0); x.globalAlpha=1;

  }
  // prog 0→1: 가운데에서 맑게 번져 나오며 진해진다
  function draw(ctx,drop,cx,cy,R,prog=1,alpha=1){
    const s=sprite(drop,R), e=1-Math.pow(1-Math.min(1,prog),3), k=prog<1?(.55+.45*e):1;

    ctx.drawImage(s.cv,cx-s.P/2*k,cy-s.P/2*k,s.P*k,s.P*k); ctx.restore();
  }
  return {draw};
})();

/* 기록 → 찻방울 데이터 */
function teaDrop(type){
  if(!type) return {id:'empty',comps:[{key:'tea',c:'#C4C4C4',w:.85}]};
  const c=TEAS[type].color;
  return {id:'base-'+type,comps:[{key:'tea',c,w:.85}]};
}
function recDrop(r){
  if(!r.flavors||!r.flavors.length) return {...teaDrop(r.type),id:'rb-'+r.id};
  return {id:r.id,comps:[{key:'tea',c:TEAS[r.type].color,w:.5},...r.flavors.map(f=>({key:f.k,c:FLAVORS[f.k].color,w:f.w}))]};
}

/* 화면 속 찻방울은 <canvas>로 두고, 화면을 그린 뒤 한꺼번에 칠한다(크기별 비트맵 캐시) */
const DROPS={}, BMP=new Map();
function orb(src,size,cls=''){
  const drop = src && typeof src==='object' ? (src.comps?src:recDrop(src)) : teaDrop(src);
  DROPS[drop.id]=drop;
  return `<canvas class="wcd ${cls}" data-dk="${esc(drop.id)}" data-sz="${size}" style="width:${size}px;height:${size}px"></canvas>`;
}
function dropBitmap(drop,px){
  const k=drop.id+'|'+px+'|'+drop.comps.map(c=>c.key+c.w.toFixed(2)).join();
  if(BMP.has(k)) return BMP.get(k);
  if(BMP.size>300) BMP.clear();
  const c=document.createElement('canvas'); c.width=c.height=px; const x=c.getContext('2d');
  BLOOM.draw(x,drop,px/2,px/2,px*.3,1,1.4);
  BMP.set(k,c); return c;
}
const pxFor=size=>Math.round(size*Math.min(2.5,(window.devicePixelRatio||1)*SCALE));
function paintDrops(root=document){
  root.querySelectorAll('canvas.wcd:not([data-done])').forEach(cv=>{
    const drop=DROPS[cv.dataset.dk]; if(!drop) return;
    const px=pxFor(+cv.dataset.sz); cv.width=cv.height=px;
    cv.getContext('2d').drawImage(dropBitmap(drop,px),0,0); cv.dataset.done='1';
  });
}
function findType(text){
  const t=text.toLowerCase().replace(/\s/g,'');
  for(const k of ORDER){ if(TEAS[k].kw.some(w=>t.includes(w.toLowerCase()))) return k; }
  return null;
}

const TAB_OF = {canvas:'canvas',detail:'canvas',my:'my',noti:''};
let NAV_DIR='fade';
function go(name,params={},opt={}){
  NAV_DIR = opt.reset ? 'fade' : 'fwd';
  if(opt.reset) S.stack=[];
  if(opt.replace) S.stack.pop();
  S.stack.push({name,params});
  render();
}
function back(){
  NAV_DIR='back';
  if(S.stack.length>1){S.stack.pop();render();}
  else go('home',{},{reset:true});
}

function render(keepScroll){
  const view=$('#view'); const top=view.scrollTop;
  const cur=S.stack[S.stack.length-1];
  const fn=SCREENS[cur.name];
  view.innerHTML=`<div class="scr scr-${cur.name} ${keepScroll?'':'in-'+NAV_DIR}">${fn(cur.params||{})}</div>`;
  view.scrollTop = keepScroll ? top : 0;
  const tab = cur.name in TAB_OF ? TAB_OF[cur.name] : 'home';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));

  paintDrops(view);
}

/* 두 축 캔버스: 가로 = 마시기 전 코로 맡은 향, 세로 = 마신 뒤 입에 남은 맛 */
const AX={top:'맛이 좋아요',bottom:'맛이 아쉬워요',left:'향이 아쉬워요',right:'향이 좋아요'};
function canvasBox(id,{labels=true,cls=''}={}){

const dropR=(W,i,k=1)=>W*.16*Math.pow(10/Math.max(10,S.records.length),.3)*(.65+.5*(i??.5))*k;
const recsAsc=()=>[...S.records].filter(r=>r.canvas).sort((a,b)=>(a.ts||0)-(b.ts||0));
function axes(x,px){ x.save(); x.strokeStyle='rgba(0,0,0,.09)'; x.lineWidth=Math.max(1,px/420); x.beginPath(); x.moveTo(px/2,0); x.lineTo(px/2,px); x.moveTo(0,px/2); x.lineTo(px,px/2); x.stroke(); x.restore(); }
function paintCanvas(cv,recs,{alpha=1,highlight=null,k=1,paper=CANVAS_BG}={}){
  const px=pxFor(cv.clientWidth); cv.width=cv.height=px; const x=cv.getContext('2d');
  x.fillStyle=paper; x.fillRect(0,0,px,px); axes(x,px);
  recs.forEach(r=>BLOOM.draw(x,recDrop(r),r.canvas.x*px,r.canvas.y*px,dropR(px,r.canvas.i,k),1,highlight?(r.id===highlight?1:.18):alpha));
  if(highlight){ const r=recs.find(q=>q.id===highlight); if(r){ x.save(); x.strokeStyle='rgba(0,0,0,.55)'; x.lineWidth=Math.max(1,px/300); x.setLineDash([px/90,px/110]); x.beginPath(); x.arc(r.canvas.x*px,r.canvas.y*px,dropR(px,r.canvas.i,k)*1.05,0,Math.PI*2); x.stroke(); x.restore(); } }
  
  return px;
}

/* 표현 → 풍미 계열 */
function matchFlavors(text){ const t=String(text||'').replace(/\s/g,''); return FKEYS.filter(k=>FLAVORS[k].kw.some(w=>t.includes(w))); }
function collectExprs(d){
  const out=[], add=t=>{ t=String(t||'').trim(); if(!t||t==='잘 모르겠어요'||out.some(o=>o.text===t)) return; out.push({text:t,fl:matchFlavors(t)}); };
  ['aroma','taste','color'].forEach(k=>add(d.feel&&d.feel[k]));
  (d.chat||[]).filter(m=>m.who==='me').forEach(m=>add(m.text));
  if(d.useDeep!==false){ add(d.deep.memo); Object.values(d.deep.brews||{}).forEach(b=>add(b.feel)); }
  return out;
}
// 먼저 떠올린 표현과 여러 번 나온 풍미일수록 진하게(최대 4가지)
function scoreFlavors(exprs){
  const sc={}; let i=0;
  exprs.forEach(e=>{ if(!e.fl.length) return; const w=1+(i===0?.4:i===1?.2:0); i++; e.fl.forEach(k=>sc[k]=(sc[k]||0)+w*(e.fl.length>2?.8:1)); });
  const ks=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]).slice(0,4), mx=sc[ks[0]]||1;
  return ks.map(k=>({k,w:+(.35+.6*sc[k]/mx).toFixed(2)}));
}
function draftDrop(d){
  if(!d.flavors||!d.flavors.length) return {...teaDrop(d.type),id:'draft-'+d.tid};
  return {id:'draft-'+d.tid,comps:[{key:'tea',c:TEAS[d.type].color,w:.5},...d.flavors.map(f=>({key:f.k,c:FLAVORS[f.k].color,w:f.w}))]};
}
function ensureFlavors(d){ if(!d.flavors){ const ex=collectExprs(d); d.flavors=scoreFlavors(ex); d.exprs=ex.map(e=>e.text); } }

/* 나의 취향 찻방울: 향도 맛도 좋았던(오른쪽 위) 기록들의 대표 풍미를 섞는다 */
function favDrop(){
  const rs=S.records.filter(r=>r.canvas&&r.canvas.x>=.5&&r.canvas.y<.5);
  if(!rs.length) return null;
  const fl={}, tt={};
  rs.forEach(r=>{ const i=r.canvas.i??.5; tt[r.type]=(tt[r.type]||0)+i; (r.flavors||[]).forEach(f=>fl[f.k]=(fl[f.k]||0)+f.w*i); });
  const topT=Object.keys(tt).sort((a,b)=>tt[b]-tt[a])[0];
  const ks=Object.keys(fl).sort((a,b)=>fl[b]-fl[a]).slice(0,3), mx=fl[ks[0]]||1;
  const top=ks.map(k=>({k,w:+(.4+.55*fl[k]/mx).toFixed(2)}));
  const drop={id:'fav-'+rs.map(r=>r.id).join('.'),comps:[{key:'tea',c:TEAS[topT].color,w:.45},...top.map(f=>({key:f.k,c:FLAVORS[f.k].color,w:f.w}))]};
  const names=top.map(f=>FLAVORS[f.k].label);
  return {drop,top,n:rs.length,
    title:`향도 맛도 좋았던 ${rs.length}잔을 섞었어요`,
    desc:names.length?`${names.join(', ')} 풍미가 가장 진하게 담겼어요. 좋은 기억은 주로 ${TEAS[topT].label}에서 남았어요.`:`좋은 기억은 주로 ${TEAS[topT].label}에서 남았어요.`};
}

/* 기록 목록 검색 · 필터 */
function filtered(){
  const f=S.filter, q=f.q.trim().replace(/\s/g,'').toLowerCase(), now=new Date();
  const from={all:0,'1m':now.getTime()-31*864e5,'3m':now.getTime()-92*864e5,'1y':new Date(now.getFullYear(),0,1).getTime()}[f.date];
  return sortRecs().filter(r=>{
    if((r.ts||0)<from) return false;
    const c=r.canvas||{x:.5,y:.5};
    if(f.aroma==='good'&&c.x<.5 || f.aroma==='bad'&&c.x>=.5) return false;
    if(f.taste==='good'&&c.y>=.5 || f.taste==='bad'&&c.y<.5) return false;
    if(!q) return true;
    const hay=[r.name,r.brand,r.comment,TEAS[r.type].label,...(r.exprs||[]),...(r.tags||[]),...(r.flavors||[]).map(x=>FLAVORS[x.k].label)].join(' ').replace(/\s/g,'').toLowerCase();
    return hay.includes(q);
  });
}

feel(){

  <h1 class="t">스스로 맛보고 느끼기</h1>

  <button class="link" onclick="S.draft.feel={};go('chat')">다음에 할게요</button>`;
},

chat(){
  const d=S.draft;
  const head = `${stepbar(4)}
  <h1 class="t">내 감각 기록하기</h1><p class="sub">떠오르는 색이나 장면으로 표현해도 돼요.</p>
  <div class="seg" style="margin-top:14px"><button class="${S.chatMode==='chat'?'on':''}" onclick="setMode('chat')">채팅</button>
    <button class="${S.chatMode==='voice'?'on':''}" onclick="setMode('voice')">음성</button></div>`;

    return `${head}
    <p class="sub" style="margin-top:0">정답은 없어요. 떠오르는 느낌 그대로 말하면 충분해요.</p>
    <button class="voiceorb orb ${S.listening?'listen':''}" style="background:radial-gradient(circle, #E6DDF4 0%, #DCDCE6 45%, #CFD8CF 100%)" onclick="toggleListen()" aria-label="말하기"></button>
    <button class="btn dark" style="width:80%;margin:0 auto" onclick="toggleListen()">${S.listening?'듣고 있어요 · 눌러서 멈추기':'눌러서 말하기'}</button>
    <p class="heard">${last?`“${esc(last)}”`:''}</p>

    <div class="spacer"></div>

},

organizing(){
  return `${stepbar(4)}
  ${loaderHTML('감각 기록을 정리하는 중')}
  <button class="link" onclick="go('depth',{},{replace:true})">기록 보기</button>`;

depth(){
  const d=S.draft, dp=d.deep;
  const rounds=[1,2,3,...Array.from({length:dp.extra},(_,i)=>4+i)];
  const has=k=>!!(dp[k]&&String(dp[k]).trim());
  const savedTag='<span class="saved">· 남겼어요</span>';
  return `${stepbar(5)}
  <h1 class="t">조금 더 남겨볼까요?</h1>
  <p class="sub">기억하고 싶은 것만 가볍게 더해보세요.</p>
  ${orb(d.type,150,'big')}
  <div class="opt"><span class="ic">${I.cup}</span><div class="tx"><b>우림 변화<small>(선택)</small></b></div>
    <div class="rounds">${rounds.slice(0,3).map(n=>`<button class="${dp.brews[n]?'done':''}" onclick="openBrew(${n})">${n}차</button>`).join('')}
    <button onclick="openBrew(${rounds.length>3?rounds[rounds.length-1]:4},${rounds.length<=3})">${rounds.length>3?rounds.length+'차':'+'}</button></div></div>
  <button class="opt" onclick="go('deepOrigin')"><span class="ic">${I.mount}</span><div class="tx"><b>산지 · 빈티지<small>(선택)</small></b> ${has('origin')||has('vintage')?savedTag:''}<p>알고 있다면 간단히 적어보세요.</p></div><span class="chev">›</span></button>
  <button class="opt" onclick="go('deepTemp')"><span class="ic">${I.thermo}</span><div class="tx"><b>온도 · 시간<small>(선택)</small></b> ${has('temp')||has('min')?savedTag:''}<p>우릴 때의 온도와 시간을 남겨보세요.</p></div><span class="chev">›</span></button>
  <button class="opt" onclick="go('deepMemo')"><span class="ic">${I.pen}</span><div class="tx"><b>추가 메모<small>(선택)</small></b> ${has('memo')?savedTag:''}<p>기억하고 싶은 점을 자유롭게 적어보세요.</p></div><span class="chev">›</span></button>
  <div class="spacer"></div>
  <button class="btn dark" onclick="S.draft.useDeep=true;go('analyzing')">기록에 반영하기</button>
  <button class="link" onclick="S.draft.useDeep=false;go('analyzing')">지금 기록으로 계속하기</button>`;
},

deepBrew(){
  const d=S.draft, dp=d.deep, n=S.brewTab;
  const rounds=[1,2,3,...Array.from({length:dp.extra},(_,i)=>4+i)];
  const cur=dp.brews[n]||{};
  const ex=n===1?'풀 향이 먼저 나고, 끝에 고소한 여운이 남았어요.':n===2?'첫 우림보다 부드러워지고 단맛이 느껴졌어요.':'향이 옅어지고 물처럼 가벼워졌어요.';
  return `${stepbar(5)}
  <p class="kicker">심화 기록 · 선택 입력</p>
  <h1 class="t" style="margin-top:4px">우림 변화</h1><p class="sub">우릴 때마다 달라지는 느낌을 남겨보세요.</p>
  <div class="tabs4">${rounds.map(r=>`<button class="${r===n?'on':''}" onclick="switchBrew(${r})">${r}차</button>`).join('')}
    <button onclick="addBrew()">+</button></div>
  <h3 style="font-size:17px">${n}차 우림</h3>
  <p class="muted" style="font-size:13px;margin-top:4px">향 · 맛 · 여운 중 떠오르는 것만 적어보세요.</p>
  <div class="field"><label>이번 우림의 느낌 (선택)</label><textarea id="bFeel" rows="4" placeholder="예: ${ex}">${esc(cur.feel)}</textarea></div>
  <div class="field"><label>다음 우림에 기억할 점 (선택)</label><textarea id="bNext" rows="3" placeholder="예: 다음에는 조금 더 짧게 우려보기">${esc(cur.next)}</textarea>
    <small>차수마다 짧은 한 문장만 남겨도 충분해요.</small></div>
  <div class="spacer"></div>
  <p class="hint" style="margin-bottom:10px">빈 항목은 그대로 두어도 괜찮아요.</p>
  <button class="btn dark" onclick="saveBrew()">저장하기</button>
  <button class="link" onclick="back()">저장하지 않고 돌아가기</button>`;
},

deepOrigin(){
  const dp=S.draft.deep;
  return `${stepbar(5)}
  <p class="kicker">심화 기록 · 선택 입력</p>
  <h1 class="t" style="margin-top:4px">산지 · 빈티지</h1><p class="sub">포장에 적힌 정보만 가볍게 옮겨보세요.</p>
  <div class="field" style="margin-top:26px"><label>산지 (선택)</label><div class="box"><input id="dOrigin" placeholder="예: 대한민국 제주" value="${esc(dp.origin)}"></div>

deepTemp(){

  return `${stepbar(5)}
  <p class="kicker">심화 기록 · 선택 입력</p>
  <h1 class="t" style="margin-top:4px">온도 · 시간</h1><p class="sub">오늘 차를 우린 조건을 남겨보세요.</p>

  <p class="hint" style="margin-bottom:10px">빈 항목은 그대로 두어도 괜찮아요.</p>

  <p class="kicker">심화 기록 · 선택 입력</p>
  <h1 class="t" style="margin-top:4px">추가 메모</h1><p class="sub">차와 함께한 순간을 편하게 적어보세요.</p>

  <p class="muted" style="font-size:13px;margin-top:4px">함께한 사람 · 마신 장소 · 기분 · 다음에 해보고 싶은 것</p>

  <p class="hint" style="margin-bottom:10px">빈 항목은 그대로 두어도 괜찮아요.</p>

analyzing(){
  return `${stepbar(6)}
  <h1 class="t" style="margin-top:18px">찻방울을 완성하고 있어요</h1>
  <p class="sub">내가 남긴 표현이 하나씩 방울에 스며들어요.</p>

    <div class="ph on"><i></i>표현 읽는 중</div><span class="ar">→</span>

compare(){

  <h1 class="t">내 감각과 설명을 함께 볼까요?</h1>
  <p class="sub">같은 점과 다른 표현을 가볍게 살펴봐요.</p>
  ${d3Box('cmp3d',190)}
  ${d.flavors.length?`<div class="center-chips">${flChips(d.flavors)}</div>`:''}
  <div class="cmp"><div class="lb">${I.book}전문가 설명</div><div class="bd">${t.expert}</div></div>
  <div class="cmp"><div class="lb">${I.person}나의 기록</div><div class="bd">${esc(myExpression(d))}</div></div>

  <div class="cmp"><div class="lb">${I.swap}차이점</div><div class="bd"><ul>${t.diff.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>
  <div class="cmp"><div class="lb">${I.spark}AI 해석</div><div class="bd">두 기록 모두 ${t.common[0]}과 ${t.common[1]}의 인상을 담고 있어요. 전문 설명은 향의 종류를 구체적으로, 내 기록은 경험과 분위기를 중심으로 표현했어요.</div></div>

  <button class="btn" onclick="openCanvasSheet()">캔버스에 찻방울 찍기</button>

done(){
  const r=S.lastSaved||S.records[0];
  return `${stepbar(6)}
  ${d3Box('done3d',190)}

  <p class="sub">오늘의 찻방울이 나의 캔버스에 스며들었어요.<br>대화와 감각이 정리되어 아카이브에 쌓였어요.</p>

fullChat(p){
  const rec = p.id ? S.records.find(r=>r.id===p.id) : S.lastSaved;
  const chat = (rec&&rec.chat)||[], voice=(rec&&rec.voice)||[];
  const mode = p.mode||'chat';
  return `${stepbar(6)}
  <h1 class="t">전체 대화 보기</h1><p class="sub">차를 마시며 나눈 이야기를 다시 확인해요.</p>
  <div class="seg wide" style="margin-top:20px"><button class="${mode==='chat'?'on':''}" onclick="S.stack[S.stack.length-1].params.mode='chat';rerender()">채팅</button>
    <button class="${mode==='voice'?'on':''}" onclick="S.stack[S.stack.length-1].params.mode='voice';rerender()">음성</button></div>
  <div id="msgs" style="margin-top:4px">${
    mode==='chat'
    ? (chat.length? chat.map(m=>`<div class="msg ${m.who}">${esc(m.text)}</div>`).join('') : `<p class="muted center" style="font-size:13px;margin-top:20px">남긴 대화가 없어요.</p>`)
    : (voice.length? voice.map((v,i)=>`<div class="opt" style="margin-top:0"><span class="ic">▶</span><div class="tx"><b style="font-size:13.5px">음성 기록 ${i+1}</b><p>“${esc(v)}”</p></div></div>`).join('') : `<p class="muted center" style="font-size:13px;margin-top:20px">음성으로 남긴 기록이 없어요.</p>`)
  }</div>
  <div class="spacer"></div>
  <button class="btn" onclick="back()">기록으로 돌아가기</button>`;
},

teaTag(){
  const r=S.lastSaved || S.records[0];
  const tags=(r.flavors&&r.flavors.length?r.flavors.map(f=>FLAVORS[f.k].label):r.tags&&r.tags.length?r.tags:TEAS[r.type].common).slice(0,5);
  return `${stepbar(6)}
  <h1 class="t">오늘의 Tea Tag</h1><p class="sub">오늘 남긴 감각을 한 장에 담았어요.</p>
  <div style="height:16px"></div>
  <div class="tagcard">
    ${orb(r,140,'big')}
    <div class="nm">${esc(r.name)}</div>
    <div class="meta">${esc(r.brand)} · ${r.date} · ${stars(r.stars)}</div>
    <div class="tags">${tags.map(t=>`<span class="chip">#${esc(t)}</span>`).join('')}</div>
    ${r.comment?`<div class="line">“${esc(r.comment)}”</div>`:''}
  </div>
  <p class="hint" style="margin-top:12px">Tea Tag는 내 표현에서 찾은 풍미로 만들어져요.</p>
  <div class="spacer"></div>
  <button class="btn" onclick="toast('이미지 저장은 프로토타입에서 지원하지 않아요')">이미지로 저장하기</button>
  <button class="link" onclick="back()">기록 완료로 돌아가기</button>`;
},

canvas(p){
  const tab=p.tab||'canvas';
  const seg=`<div class="seg"><button class="${tab==='canvas'?'on':''}" onclick="go('canvas',{tab:'canvas'},{reset:true})">캔버스</button>
    <button class="${tab==='list'?'on':''}" onclick="go('canvas',{tab:'list'},{reset:true})">기록</button></div>`;
  if(S.forceEmpty || !S.records.length){
    return `${seg}<div class="state"><h2 style="margin-top:0">아직 모인 찻방울이 없어요</h2>
      <p>첫 차를 기록하면 이곳에 나만의 찻방울이 하나씩 번져요.</p>
      <div style="margin:48px 0">${orb(null,150,'breath')}</div></div>
      <button class="btn" onclick="startRecord()">첫 기록 시작하기</button>
      <button class="link u" onclick="goTab('home')">홈으로 가기</button>`;
  }
  if(tab==='list'){
    return `${seg}
    <div class="search">${I.search}<input id="q" placeholder="차 이름, 브랜드, 표현으로 찾기" value="${esc(S.filter.q)}" oninput="S.filter.q=this.value;paintList()"></div>
    <div class="filters">
      ${frow('date','기간',[['all','전체'],['1m','1개월'],['3m','3개월'],['1y','올해']])}
      ${frow('aroma','향',[['all','전체'],['good','좋았어요'],['bad','아쉬웠어요']])}
      ${frow('taste','맛',[['all','전체'],['good','좋았어요'],['bad','아쉬웠어요']])}
    </div>
    <div id="recGrid" class="rgrid">${gridHTML()}</div>`;
  }
  const fav=favDrop();
  return `${seg}
  <p class="cv-head"><b>${S.records.length}잔</b>의 차가 번진 나의 TEA CANVAS</p>
  ${canvasBox('bigCv')}
  <p class="cap">가로는 마시기 전 향, 세로는 마신 뒤 맛이에요. 방울을 누르면 그 기록을 볼 수 있어요.</p>
  <h3 class="sec">나의 취향 찻방울</h3>
  ${fav?`<div class="fav"><div id="fav3d" style="width:120px;height:120px;flex-shrink:0"></div><div><b>${fav.title}</b><p>${fav.desc}</p></div></div>${flChips(fav.top)}`
      :`<div class="card muted" style="font-size:13px">향도 맛도 좋았던 기록이 모이면, 그 차들을 섞어 나만의 찻방울을 만들어드려요.</div>`}
  <div style="height:8px"></div>`;
},

detail(p){
  const r=S.records.find(x=>x.id===p.id);
  if(!r) return SCREENS.error({});
  const dp=r.deep||{};
  const info=[];
  if(dp.origin||dp.vintage) info.push(['산지·빈티지',[dp.origin,dp.vintage&&dp.vintage+'년'].filter(Boolean).join(' · ')]);
  if(dp.temp||dp.min||dp.sec) info.push(['온도·시간',[dp.temp&&dp.temp+'°C',(dp.min||dp.sec)&&`${dp.min||0}분 ${dp.sec||0}초`].filter(Boolean).join(' · ')]);
  Object.entries(dp.brews||{}).forEach(([n,b])=>{ if(b.feel||b.next) info.push([n+'차 우림',[b.feel,b.next].filter(Boolean).join(' / ')]); });
  return `<div class="dtop"><button class="backtext" onclick="back()">${I.larr} 상세 기록</button>
    <button class="ghost" onclick="askDelete('${r.id}')" aria-label="기록 삭제">${I.trash}</button></div>
  ${d3Box('det3d',170)}
  <div class="detail">
    <div class="dhead"><div><b class="dn">${esc(r.name)}</b><span class="muted">${esc(r.brand)||TEAS[r.type].label}</span><span>${stars(r.stars)} · ${r.date.replace(/\.$/,'')}</span></div></div>
    ${r.photo?`<div class="photo"><span>사진</span></div>`:''}
    <div class="dcomment"><span>한 줄 코멘트 | ${esc(r.comment)||'—'}</span>
      <button onclick="toast('이미지 저장은 프로토타입에서 지원하지 않아요')" aria-label="저장">${I.down}</button></div>
  </div>
  ${r.flavors&&r.flavors.length?`<h3 class="sec">담긴 풍미</h3>${flChips(r.flavors)}`:''}
  <h3 class="sec">캔버스 속 위치</h3>
  ${canvasBox('detCv',{cls:'sm'})}
  <p class="cap">${posText(r.canvas)}</p>
  <div class="memo"><h4>MEMO</h4>${(r.memo&&r.memo.length?r.memo:['남긴 메모가 없어요.']).map(m=>`<p>${esc(m)}</p>`).join('')}
    ${info.length?`<dl>${info.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`:''}</div>
  ${r.chat&&r.chat.length?`<button class="link" onclick="go('fullChat',{id:'${r.id}'})">대화 기록 보기 ›</button>`:''}
  <button class="btn line" style="margin-top:22px" onclick="askDelete('${r.id}')">이 기록 삭제하기</button>`;
},


my(){
  sortRecs();
  const n=S.records.length, kinds=new Set(S.records.map(r=>r.type)).size;

  return `
  <div class="profile"><div class="pimg">프로필<br>이미지</div><div><b>사용자 님</b><p>@teacanvas-sprout<br>${n>=10?'잎새 이용자':'새싹 이용자'}</p></div></div>
  <h3 class="sec" style="margin-top:28px">나의 아카이브</h3>
  <div class="statrow"><div><b>${n}</b><span>모인 찻방울</span></div><div><b>${kinds}</b><span>차 종류</span></div><div><b>${last}</b><span>최근 기록</span></div></div>
  <h3 class="sec" style="margin-top:30px">설정</h3>
  ${['대화 기록 설정','앱 설정','알림 설정','계정'].map(s=>`<button class="setrow" onclick="toast('${s} 화면은 아직 디자인 자료가 없어요')">${s}</button>`).join('')}`;
},

noti(){

  <h1 class="t" style="text-align:left">알림</h1>

  <button class="btn" onclick="retryError('${p.retry||''}')">다시 시도하기</button>
  <button class="link" onclick="goTab('home')">홈으로 가기</button><div style="height:40px"></div>`;

/* after-render hooks */
const AFTER = {
  home(){ mountHomeDrop($('#homeDrop')); },
  chat(){ if(S.chatMode==='chat'){ seedChat(); paintMsgs(); } },
  organizing(){ const at=S.stack.length; setTimeout(()=>{ if(S.stack.length===at && cur()==='organizing') go('depth',{},{replace:true}); },1600); },
  analyzing(){ runInfusion(); },
  canvas(p){
    { const f=favDrop(), el=$('#fav3d'); if(f&&el) mountDrop3D(el,f.drop,120); }
    const cv=$('#bigCv'); if(!cv) return;
    const recs=recsAsc(), px=paintCanvas(cv,recs,{highlight:null,k:1.1});
    if(p.hl){ const r=recs.find(q=>q.id===p.hl); if(r) bloomOn(cv,r,px); }
    cv.onclick=e=>{ const b=cv.getBoundingClientRect(), x=(e.clientX-b.left)/b.width, y=(e.clientY-b.top)/b.height;
      let best=null, bd=1e9; recs.forEach(r=>{ const d=Math.hypot(r.canvas.x-x,r.canvas.y-y); if(d<bd){bd=d;best=r;} });
      if(best && bd<dropR(1,best.canvas.i,1.1)*1.2) openDetail(best.id); else toast('방울을 눌러 기록을 열어보세요'); };
  },
  detail(p){ const r=S.records.find(x=>x.id===p.id); if(r) mountDrop3D($('#det3d'),recDrop(r),170); const cv=$('#detCv'); if(cv) paintCanvas(cv,recsAsc(),{highlight:p.id}); },
  compare(){ mountDrop3D($('#cmp3d'),draftDrop(S.draft),190); },
  done(){ const r=S.lastSaved||S.records[0]; if(r) mountDrop3D($('#done3d'),recDrop(r),190); },
};
const cur=()=>S.stack[S.stack.length-1].name;

/* =========================================================
   ACTIONS
   ========================================================= */
function startRecord(){ closeSheet(); stopTimer(); S.draft=newDraft(); S.chatMode='chat'; S.voiceIdx=0; go('teaInput',{}, {reset:true}); }
function openDetail(id){ closeSheet(); if(!(cur() in TAB_OF)||cur()==='my'||cur()==='noti') S.stack=[{name:'canvas',params:{tab:'list'}}]; go('detail',{id}); }

/* 기록 삭제: 확인 후 지운다 */
function askDelete(id){
  const r=S.records.find(x=>x.id===id); if(!r) return;
  openSheet(`<div class="grab"></div>
    <div class="center" style="margin-top:6px">${orb(r,84)}</div>
    <h1 class="t" style="margin-top:10px">‘${esc(r.name)}’ 기록을 삭제할까요?</h1>
    <p class="sub">삭제하면 캔버스에서도 찻방울이 사라지고,<br>다시 되돌릴 수 없어요.</p>
    <div style="height:26px"></div>
    <button class="btn" onclick="doDelete('${id}')">삭제하기</button>
    <button class="link" onclick="closeSheet()">취소</button>`);
}
function doDelete(id){
  S.records=S.records.filter(r=>r.id!==id); persist();
  if(S.lastSaved&&S.lastSaved.id===id) S.lastSaved=null;
  closeSheet(); go('canvas',{tab:'list'},{reset:true}); toast('기록을 삭제했어요');
}

function submitTea(){
  const name=$('#inName').value.trim(), brand=$('#inBrand').value.trim();
  if(!name){ toast('차 이름을 입력해주세요'); $('#inName').focus(); return; }
  const d=S.draft; d.name=name; d.brand=brand;
  const t=findType(name+' '+brand);
  if(!t){ go('searchError'); return; }
  d.type=t; go('teaConfirm');
}

function openEditSheet(){
  const d=S.draft;
  openSheet(`<div class="grab"></div>
    <input class="pill-in" id="eName" placeholder="차 이름 입력하기" value="${esc(d.name)}">
    <input class="pill-in" id="eBrand" placeholder="브랜드명 입력하기" value="${esc(d.brand)}">
    <button class="cambtn" onclick="toast('사진으로 차 정보를 읽는 기능은 준비 중이에요')"><span class="ring">${I.cam}</span>사진으로 찾기</button>
    <button class="link" style="color:#111;font-weight:600" onclick="saveEdit()">저장하기</button>`);
}
function saveEdit(){
  const name=$('#eName').value.trim(), brand=$('#eBrand').value.trim();
  if(!name){toast('차 이름을 입력해주세요');return;}
  const t=findType(name+' '+brand);
  closeSheet();
  const d=S.draft; d.name=name; d.brand=brand;
  if(!t){ go('searchError'); return; }
  d.type=t; rerender(); toast('차 정보를 수정했어요');
}

/* timer */
function startBrew(){
  const d=S.draft, secs=d.basic?BASIC.secs:TEAS[d.type].secs;
  S.timer={total:secs,left:secs,running:true};
  go('feel');
}
function stopTimer(){ S.timer=null; }
function toggleTimer(){ const t=S.timer; if(!t||t.left<=0) return; t.running=!t.running; paintTimer(); }
function finishTimer(){ if(!S.timer){ toast('진행 중인 우림 타이머가 없어요'); return; } S.timer.left=1; S.timer.running=true; }
function paintTimer(){
  document.querySelectorAll('[data-timer]').forEach(e=>e.textContent=timerText());
  document.querySelectorAll('[data-timerbtn]').forEach(e=>e.textContent=timerBtnText());
}
setInterval(()=>{
  const t=S.timer; if(!t||!t.running||t.left<=0) return;
  t.left--; paintTimer();
  if(t.left===0){ t.running=false; paintTimer(); toast('우림이 끝났어요. 찻잔을 천천히 들어볼까요?');
    if(cur()==='chat' && S.draft){ S.draft.chat.push({who:'sys',text:'— 우림이 끝났어요 —'}); if(S.chatMode==='chat') paintMsgs(); } }
},1000);

/* feel */
function pickFeel(k,o){ const f=S.draft.feel; f[k]= f[k]===o ? undefined : o; rerender(); }

/* chat */
function setMode(m){ S.chatMode=m; S.listening=false; rerender(); }
function seedChat(){
  const d=S.draft; if(d.chat.length) return;
  const a=d.feel.aroma && d.feel.aroma!=='잘 모르겠어요' ? d.feel.aroma : null;
  if(S.timer && S.timer.left>0) d.chat.push({who:'bot',text:`우리는 동안 천천히 향을 맡아봐요. 남은 시간은 위에서 확인할 수 있어요.`});
  d.chat.push({who:'bot',text: a ? `먼저 느껴보기에서 ‘${a}’을 골랐어요.\n다시 향을 맡고, 떠오르는 색이나 장면으로 표현해보세요.` : '우선 향을 맡고 표현해보세요. 떠오르는 색이나 장면으로 표현해도 돼요.'});
}
function paintMsgs(){
  const box=$('#msgs'); if(!box) return;
  const d=S.draft, msgs=d.chat;
  const last=msgs[msgs.length-1];
  box.innerHTML = msgs.map(m=>`<div class="msg ${m.who}">${esc(m.text)}</div>`).join('')
    + (S.typing?'<div class="msg bot typing">생각하는 중이에요.</div>':'')
    + (!S.typing && last && last.who==='bot' && last.chips ? `<div class="chips">${last.chips.map(c=>`<button class="chip w" style="background:var(--g0)" onclick="sendMsg('${c}',true)">${c}</button>`).join('')}</div>`:'');
  const v=$('#view'); v.scrollTop=v.scrollHeight;
}
function sendInput(){ const el=$('#chatIn'); const t=el.value.trim(); if(!t) return; el.value=''; sendMsg(t); }
function sendMsg(text,isChip){
  const d=S.draft; if(S.typing) return;
  d.chat.push({who:'me',text}); if(isChip && text!=='잘 모르겠어요') d.picked.push(text);
  S.typing=true; paintMsgs();
  setTimeout(()=>{ S.typing=false; d.chat.push(botReply(d,text)); if(cur()==='chat'&&S.chatMode==='chat') paintMsgs(); },800);
}
function botReply(d,text){
  const n=d.chat.filter(m=>m.who==='me').length;
  const short=text.replace(/[.!?。~]+$/,'');
  if(n===1) return {who:'bot',text:'입안에서는 어떤 느낌이 남았나요?',chips:['부드러움','산뜻함','은은함','잘 모르겠어요']};
  if(n===2) return {who:'bot',text: text==='잘 모르겠어요' ? '괜찮아요. 모르는 것도 오늘의 기록이에요.\n식으면서 달라진 점이나, 끝에 남는 여운은 어떤가요?' : `좋아요. ‘${short}’ 느낌으로 남겨둘게요.\n식으면서 달라진 점이나, 끝에 남는 여운은 어떤가요?`,chips:['고소한 여운','단맛이 남아요','깔끔해요','잘 모르겠어요']};
  if(n===3) return {who:'bot',text:'그 여운도 함께 적어둘게요.\n충분히 남겼다면 ‘기록 보기’를 눌러 오늘의 감각을 정리해봐요.'};
  return {who:'bot',text:'좋아요, 그 표현도 함께 담아둘게요.'};
}
function toggleListen(){
  if(!S.listening){ S.listening=true; rerender(); return; }
  S.listening=false;
  const d=S.draft, line=VOICE_LINES[S.voiceIdx++ % VOICE_LINES.length];
  d.voice.push(line); seedChat();
  d.chat.push({who:'me',text:line}); d.chat.push(botReply(d,line));
  rerender();
}
function finishChat(){ S.listening=false; go('organizing'); }

/* deep */
function openBrew(n,isAdd){
  const dp=S.draft.deep;
  if(isAdd){ dp.extra++; n=3+dp.extra; }
  S.brewTab=n; go('deepBrew');
}
function captureBrew(){
  const f=$('#bFeel'), x=$('#bNext'); if(!f) return;
  const feel=f.value.trim(), next=x.value.trim(), dp=S.draft.deep;
  if(feel||next) dp.brews[S.brewTab]={feel,next}; else delete dp.brews[S.brewTab];
}
function switchBrew(n){ captureBrew(); S.brewTab=n; rerender(); }
function addBrew(){ captureBrew(); const dp=S.draft.deep; dp.extra++; S.brewTab=3+dp.extra; rerender(); }
function saveBrew(){ captureBrew(); const n=Object.keys(S.draft.deep.brews).length; back(); toast(n?`우림 변화 ${n}개를 남겼어요`:'비워둔 채로 돌아왔어요'); }
function saveDeep(map){ const dp=S.draft.deep; for(const [k,sel] of Object.entries(map)) dp[k]=$(sel).value.trim(); back(); toast('기록에 담아두었어요'); }

/* compare helpers */
function myExpression(d){
  const mine=(d.chat||[]).filter(m=>m.who==='me').map(m=>m.text.replace(/[.!?]+$/,'')).filter(t=>t!=='잘 모르겠어요');
  if(mine.length) return mine.slice(0,3).join(', ') + '.';
  const f=Object.values(d.feel||{}).filter(v=>v&&v!=='잘 모르겠어요');
  if(f.length) return `${f.join(', ')}이(가) 먼저 느껴졌어요.`;
  return '풀 향이 먼저 나고, 따뜻한 물 마시듯 편안했어요. 끝에 살짝 고소하고 포근한 느낌이 남았어요.';
}

  openSheet(`<div class="grab"></div>
    <h1 class="t">캔버스에 찻방울 찍기</h1>
    <p class="sub">오늘의 차는 어디쯤일까요? 눌러서 찍고, 길게 누르면 더 진하게 번져요.</p>
    <div class="axisguide"><span><b>가로</b>마시기 전, 코로 맡은 향</span><span><b>세로</b>마신 뒤, 입에 남은 맛</span></div>
    ${canvasBox('pickCv')}

  el.innerHTML=''; el.appendChild(cv); const x=cv.getContext('2d'), t0=performance.now();
  (function f(now){ if(!cv.isConnected) return; const p=Math.min(1,(now-t0)/1400); x.clearRect(0,0,px,px); BLOOM.draw(x,drop,px/2,px/2,px*.3,p,1.8); if(p<1) requestAnimationFrame(f); })(t0);
  return {};
}
const d3Box=(id,size,hint=false)=>`<div class="d3wrap"><div id="${id}" style="width:${size}px;height:${size}px"></div>${hint?'<span class="d3hint">드래그해서 돌려보세요</span>':''}</div>`;
/* 홈 찻방울: 3D를 못 쓰는 환경이면 수채화 방울로 대신한다 */
function mountHomeDrop(el){
  if(!el) return;
  if(startHome3D(el)) return;
  const k=ORDER[Math.floor(Math.random()*6)], f=FKEYS[Math.floor(Math.random()*FKEYS.length)];
  el.innerHTML=orb({id:'home-'+k+f,comps:[{key:'tea',c:TEAS[k].color,w:.7},{key:f,c:FLAVORS[f].color,w:.5}]},230,'breath');
}

/* sheet */
function openSheet(html){ $('#sheet').innerHTML=html; $('#sheetWrap').classList.add('open'); paintDrops($('#sheet')); }
function closeSheet(){ $('#sheetWrap').classList.remove('open'); }

/* error */
function retryError(){ rerender(); }

function resetAll(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  S.records=seedRecords(); persist(); S.draft=null; S.timer=null; S.forceEmpty=false; S.loaded={}; S.lastSaved=null;
  S.filter={q:'',date:'all',aroma:'all',taste:'all'};
  $('#optEmpty').checked=false; goTab('home'); toast('처음 상태로 되돌렸어요');
}

/* =========================================================
   DEV PANEL — jump list
   ========================================================= */
const JUMPS = [
  ['홈','home'],['1 차 정보 입력','teaInput'],['검색 오류','searchError'],['차 정보 확인','teaConfirm'],['2 우림 가이드','brew'],
  ['3 먼저 느껴보기','feel'],['4 감각 기록','chat'],['감각 정리 중','organizing'],['5 심화 기록','depth'],['우림 변화','deepBrew'],
  ['산지·빈티지','deepOrigin'],['온도·시간','deepTemp'],['추가 메모','deepMemo'],['6 찻방울 완성','analyzing'],['설명과 비교','compare'],
  ['캔버스에 찍기','@canvas'],['기록 완료','@done'],['전체 대화','@fullChat'],['Tea Tag','@teaTag'],
  ['캔버스','@cv'],['기록 목록','@list'],['상세 기록','@detail'],['My','my'],['알림','noti'],['오류','error'],
];
$('#jump').innerHTML = JUMPS.map(([l],i)=>`<button onclick="jump(${i})">${l}</button>`).join('');
function jump(i){
  const k=JUMPS[i][1]; closeSheet();
  if(k==='home'||k==='my'){ goTab(k); return; }
  if(k==='@cv'||k==='@list'){ go('canvas',{tab:k==='@cv'?'canvas':'list'},{reset:true}); return; }
  if(k==='noti'||k==='error'){ go(k,{},{reset:true}); return; }
  if(k==='@detail'){ sortRecs(); openDetail(S.records[0].id); return; }
  if(k==='@done'||k==='@fullChat'||k==='@teaTag'){
    if(!S.lastSaved){ S.draft=null; ensureDraft(); demoFill(); S.draft.canvas={x:.7,y:.3,i:.8}; S.draft.stars=2; S.draft.comment='집에서 혼자 마셔본 첫 허브차!'; saveRecord(); }
    else { S.stack=[{name:'home',params:{}}]; go('done'); }
    if(k!=='@done') go(k.slice(1));
    return;
  }
  ensureDraft();
  if(['analyzing','compare','@canvas'].includes(k)) demoFill();
  if(k==='@canvas'){ S.stack=[{name:'home',params:{}}]; go('compare'); openCanvasSheet(); return; }
  if(k==='teaInput'){ S.draft=newDraft(); }
  if(k==='deepBrew') S.brewTab=1;
  if(k==='chat') S.chatMode='chat';
  S.stack=[{name:'home',params:{}}]; go(k);
}
function demoFill(){
  const d=S.draft; d.flavors=null; if(d.chat.length) return;
  d.feel={color:'보랏빛',aroma:'풀향',taste:'부드러움'};
  d.chat=[{who:'bot',text:'오늘 차는 어땠나요?'},{who:'me',text:'풀 향이 먼저 났어요.'},{who:'bot',text:'입안에서는 어떤 느낌이 남았나요?'},
    {who:'me',text:'따뜻하고 둥글게 퍼졌어요.'},{who:'bot',text:'좋아요.\n따뜻하고 둥근 풀 향으로 남겨둘게요.'},{who:'me',text:'식으니까 고소한 향도 느껴져요.'},
    {who:'bot',text:'그 여운은 어떤 느낌인가요?'},{who:'me',text:'볶은 곡물처럼 고소하고 편안해요.'},{who:'bot',text:'고소하고 포근한 여운도 함께 적어둘게요.\n다음에 마실 때 오늘의 느낌과 비교해봐요.'}];
  d.picked=['고소한 여운'];
}

/* =========================================================
   EXHIBITION — 폰 프레임 크기 맞춤 · 유휴 복귀 · 숨은 단축키
   ========================================================= */
function fitPhone(){
  const wrap=$('#phoneWrap'), p=$('#phone'), st=$('#stage');
  if(innerWidth<=700){ SCALE=1; wrap.style.width=wrap.style.height=''; p.style.transform=''; return; }
  // 세로 모니터(1080×1920) 기준: 위·아래 안내 영역을 화면 높이에 비례해 잡고, 남는 높이에 폰을 맞춘다
  const H=innerHeight, W=innerWidth;
  st.style.setProperty('--logo',Math.max(22,Math.min(44,H*.022))+'px');
  st.style.setProperty('--line',Math.max(14,Math.min(24,H*.012))+'px');
  st.style.setProperty('--hint',Math.max(13,Math.min(20,H*.0105))+'px');
  st.style.setProperty('--gap',Math.max(18,Math.min(56,H*.028))+'px');
  const chrome=$('.ex-top').offsetHeight+$('.ex-bottom').offsetHeight+parseFloat(getComputedStyle(st).getPropertyValue('--gap'))*2+48+18;
  SCALE=Math.max(.5,Math.min(1.8,(H-chrome)/852,(W-48)/393));
  wrap.style.width=393*SCALE+'px'; wrap.style.height=852*SCALE+'px';
  p.style.transform=`scale(${SCALE})`;
}
addEventListener('resize',fitPhone); fitPhone();

/* 1분 30초 동안 입력이 없으면 기록은 그대로 두고 홈으로만 돌아간다 */
const IDLE_MS=90000; let lastInput=Date.now();
['pointerdown','pointermove','keydown','wheel','input'].forEach(ev=>addEventListener(ev,()=>{ lastInput=Date.now(); },{passive:true,capture:true}));
setInterval(()=>{
  if(Date.now()-lastInput<IDLE_MS) return;
  lastInput=Date.now();
  const atHome=cur()==='home' && !$('#sheetWrap').classList.contains('open');
  if(atHome && !S.draft) return;
  closeSheet(); stopTimer(); S.draft=null; S.listening=false; goTab('home');
},5000);

/* 팀원용 숨은 단축키: Ctrl+Alt+D 도구 패널 · Ctrl+Alt+Shift+0 기록 초기화 */
addEventListener('keydown',e=>{
  if(!(e.ctrlKey&&e.altKey)) return;
  if(e.code==='KeyD' && !e.shiftKey){ e.preventDefault(); $('#dev').classList.toggle('show'); }
  if(e.code==='Digit0' && e.shiftKey){ e.preventDefault(); if(confirm('관람객 기록을 모두 지우고 예시 기록만 남길까요?')) resetAll(); }
});

/* boot */
go('home',{},{reset:true});
</script>
