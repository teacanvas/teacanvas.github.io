<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="light only"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TEA CANVAS">
<title>TEA CANVAS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --white:#FFFFFF; /* 회색 규칙: 면(상자·입력창)=g0, 그 위 칩·누름·선=g1 */ --g1:#ECECEC; --g0:#F3F3F3; --g2:#737373; --black:#000000;
  --ink:#111111; --dark:#333333; --line:#E5E5E5;
  --tip:#F3F3F3; --r-card:14px; --r-btn:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{word-break:keep-all;overflow-wrap:anywhere;font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;background:#F2F2F0;color:var(--ink);line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow:hidden}
/* ---------- exhibition stage ---------- */
.stage{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--gap,40px);padding:24px 16px}
.ex-top{text-align:center}
.ex-top .ex-logo{font-size:var(--logo,30px);font-weight:800;letter-spacing:.06em}
.ex-top .ex-line{font-size:var(--ex-line-size,17px);color:#555;margin-top:8px;letter-spacing:-.01em}
.ex-bottom{display:flex;align-items:center;gap:10px;font-size:var(--hint,15px);color:#737373}
.ex-bottom i{width:8px;height:8px;border-radius:50%;background:#111;animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.phone-wrap{position:relative;flex-shrink:0}
.phone-wrap .phone{position:absolute;left:0;top:0;transform-origin:0 0}
html{color-scheme:light only;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.view,.sheet{overscroll-behavior:contain}
input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none}
textarea{resize:none}
/* ---------- phone frame ---------- */
/* iPhone 16 · 393 × 852 */
.phone{width:393px;height:852px;background:#fff;border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column;
  box-shadow:0 0 0 9px #161616;flex-shrink:0}
.appbar{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 20px;margin-top:6px}
.logo{font-size:16px;font-weight:800;letter-spacing:.2px}
.bell{width:32px;height:32px;display:grid;place-items:center}
.view{flex:1;overflow-y:auto;position:relative;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.nav{height:60px;flex-shrink:0;border-top:1px solid var(--line);display:flex;padding-bottom:4px}
.nav button{flex:1;font-size:15px;font-weight:700;color:#A3A3A3}
.nav button.on{color:#000}
/* ---------- layout ---------- */
.scr{padding:4px 22px 28px;min-height:100%;display:flex;flex-direction:column}
.fade{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.spacer{flex:1;min-height:16px}
.center{text-align:center}
.stepbar{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:10px}
.back{width:30px;height:30px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;flex-shrink:0}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:3px;background:#DADADA;transition:width .4s,background .4s}
.dots i.done{background:#333}
.dots i.on{background:#333;width:18px}
.stepbar .mid{display:flex;align-items:center;gap:10px}
.aibadge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--g2);background:var(--g0);border-radius:11px;padding:3px 9px;white-space:nowrap}.aibadge i{width:6px;height:6px;border-radius:50%;background:#9BB87A}.aibadge.off i{background:#C9C9C9}
.stepbar .quit{font-size:13px;color:var(--g2);padding:6px 2px 6px 10px}.stepbar .quit:hover{color:#111}
.resume{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 22px 10px;background:var(--g0);border-radius:var(--r-card);padding:0 6px 0 16px;height:46px;font-size:13.5px}
.resume>button:first-child{flex:1;text-align:left;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;height:100%}
.resume .x{font-size:12.5px;color:var(--g2);padding:8px 10px}
h1.t{font-size:20px;font-weight:700;text-align:center;letter-spacing:-.3px}
.sub{font-size:13px;color:var(--g2);text-align:center;margin-top:6px}
h3.sec{font-size:15px;font-weight:700;margin:22px 0 10px}
.muted{color:var(--g2)}
.breath{animation:breath 4s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.035)}}
.btn{display:block;width:100%;height:52px;border-radius:var(--r-btn);background:#000;color:#fff;font-size:15.5px;font-weight:700;flex-shrink:0;transition:background .2s,transform .15s}
.btn:hover{background:#262626}
.btn:active{transform:scale(.985)}
.btn.dark{background:var(--dark)}
.btn.dark:hover{background:#444}
.btn.line{background:#fff;color:#111;border:1px solid #CFCFCF}
.btn.line:hover{background:var(--g0)}
.btn:disabled{background:#CFCFCF}
.btn + .btn{margin-top:12px}
.link{display:block;margin:14px auto 0;font-size:13.5px;color:var(--g2);padding:4px 8px}
.link.u{text-decoration:underline;text-underline-offset:3px}
.card{background:var(--g0);border-radius:var(--r-card);padding:14px 16px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;height:31px;padding:0 13px;border-radius:16px;background:var(--g1);font-size:13px;white-space:nowrap;transition:background .15s}
.chip.w{background:#fff}
.chip.sel{background:#000;color:#fff}
.tip{background:var(--tip);border-radius:var(--r-card);padding:11px 14px;font-size:12.5px;color:#666;margin-top:14px}
.tip b{color:#111;margin-right:8px}
.seg{display:flex;background:var(--g0);border-radius:20px;width:216px;margin:6px auto 16px;padding:0}
.seg button{flex:1;height:36px;border-radius:18px;font-size:13.5px;font-weight:600;color:#222}
.seg button.on{background:#000;color:#fff}
.seg.wide{width:100%}
.last{display:flex;gap:16px;align-items:center;width:100%;text-align:left;border:1px solid #000;padding:14px 16px}
.last b{font-size:13.5px;font-weight:600;display:block;margin-bottom:6px}
.last span{display:block;font-size:13px}
/* ---------- inputs ---------- */
.ask{font-size:21px;font-weight:500;line-height:1.55;margin:30px 8px 0}
.pill-in{display:block;width:100%;height:48px;border:1px solid #CFCFCF;border-radius:24px;text-align:center;font-size:15px;font-weight:600;margin-top:12px}
.pill-in::placeholder{color:#222}
.pill-in:focus{border-color:#000}
.pill-in:focus::placeholder{color:#BDBDBD}
.cam{display:block;margin:14px auto 0;padding:6px}
.hint{font-size:12px;color:#9A9A9A;text-align:center;margin-top:4px}
.field{margin-top:18px}
.cmtrow{display:flex;gap:8px;margin-top:10px}.cmtrow .box{flex:1;min-width:0;display:flex;align-items:center;background:var(--g0);border-radius:12px;padding:0 16px;height:50px}.cmtrow input{flex:1;min-width:0;font-size:15px}
.addphoto.sq{width:50px;height:50px;flex-shrink:0;padding:0;border-radius:12px}.addphoto.sq svg{width:22px;height:22px}.addphoto.sq img{width:100%;height:100%;border-radius:11px;object-fit:cover}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.field .box{display:flex;align-items:center;background:var(--g0);border-radius:12px;padding:0 16px;height:50px}
.field .box input{flex:1;min-width:0;font-size:15px}
.field .box span{color:var(--g2);font-size:14px}
.field textarea{display:block;width:100%;background:var(--g0);border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.6}
.field small{display:block;font-size:12px;color:var(--g2);margin-top:8px}
.field .two{display:flex;gap:10px}
.field .two .box{flex:1}
::placeholder{color:#A6A6A6}
.note{background:var(--g0);border-radius:var(--r-card);padding:16px 18px;margin-top:22px}
.note b{display:block;font-size:14px;margin-bottom:6px}
.note p{font-size:13px;color:var(--g2)}
/* ---------- tea confirm / guide ---------- */
.confirm{text-align:center;margin-top:70px}
.confirm .brand{font-size:15px}
.confirm .name{font-size:32px;font-weight:500;margin:6px 0}
.grow{display:flex;align-items:center;background:var(--g0);border-radius:var(--r-card);padding:13px 16px;margin-top:9px;font-size:13.5px}
.grow .k{width:96px;color:var(--g2);flex-shrink:0}
.grow .v{font-weight:700;font-size:15px}
.grow .v small{display:block;font-weight:400;font-size:12px;color:var(--g2)}
.feelcard.enter,.btn.enter{animation:feelIn .45s ease both}
@keyframes feelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.feelnext{display:block;margin:14px 0 0 auto;height:38px;padding:0 16px;border-radius:19px;background:#111;color:#fff;font-size:13.5px;font-weight:700}
.feelnext[hidden]{display:none}
.tc-cup{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.tc-cup i{width:46px;height:46px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1.5px #D5D5D5;flex-shrink:0}
.tc.on .tc-cup i{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.tc-cup b{font-size:15px}.tc:not(.on) .tc-cup b{color:#999;font-weight:500}
.tc-cup span{display:block;font-size:11.5px;color:#999}
.tc-lab{font-size:11.5px;color:#666;font-weight:600;margin:10px 0 5px}
.tc-track{position:relative;height:28px;border-radius:14px;touch-action:none;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.tc-track i{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);transform:translate(-50%,-50%);pointer-events:none}
.tc:not(.on) .tc-track i{opacity:.55}
.tc-tl{display:flex;justify-content:space-between;font-size:11px;color:#999;margin:5px 0 12px}
.pill-in.sm{height:42px;font-size:14px;margin-top:10px;background:#fff}
.pill-in.sm::placeholder{color:#AAA;font-weight:500}
/* ---------- chat ---------- */
.tearow{display:flex;align-items:center;gap:16px;justify-content:center;margin:2px 0 14px}
.tearow b{display:block;font-size:15px}
.tearow .tm{font-size:12.5px;color:var(--g2)}
.pillbtn{display:inline-block;margin-top:4px;font-size:11.5px;border:1px solid #CFCFCF;border-radius:13px;padding:2px 10px}
#msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.msg{max-width:82%;padding:9px 14px;border-radius:18px;font-size:14px;line-height:1.5;white-space:pre-line;animation:fade .3s ease}
.msg.bot{background:var(--g0);align-self:flex-start}
.msg.me{background:#fff;border:1px solid #CFCFCF;align-self:flex-end}
/* 예시 문장 말풍선(아직 안 보낸 내 말) */
.sugbox{display:flex;flex-direction:column;align-items:flex-end;gap:6px;align-self:flex-end;max-width:86%;animation:fade .4s ease}.sugbox[hidden]{display:none}.sugbox small{font-size:11px;color:#A6A6A6;margin-right:4px}
.sugb{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:18px;font:inherit;font-size:14px;line-height:1.5;text-align:left;cursor:pointer;background:#fff;color:#8A8A8A;border:1.5px dashed #C4C4C4}
.sugb:active{transform:scale(.97)}
.sugb.sgB{border:1px solid #CFCFCF;color:#111;opacity:.45;padding-right:6px}.sugb.sgB i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#111;flex:0 0 auto}.sugb.sgB i svg{width:14px;height:14px}.sugb.sgB i svg *{stroke:#fff}
.sugb.sgC{position:relative;padding-top:14px}.sugb.sgC em{position:absolute;top:-9px;left:12px;font-style:normal;font-size:10.5px;font-weight:700;color:#737373;background:#fff;border:1px solid #D6D6D6;border-radius:8px;padding:0 6px;line-height:16px}
.sugb.sgE{border:1px solid #E2E2E2;background:var(--g0)}.sugb.sgE .caret{width:1.5px;height:16px;background:#111;animation:blink 1s steps(2) infinite}
.msg.typing{color:var(--g2)}
.msg .cdot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.askw{align-self:stretch;background:#fff;border:1px solid var(--g1);border-radius:var(--r-card);padding:14px 14px 12px;animation:fade .35s ease}
.askw .chips{gap:6px}
.askrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.askrow .feelnext{margin:0 0 0 auto}
.askhint{font-size:12px;color:#999}
.btn.danger{background:#111;color:#fff}.btn.danger:hover{background:#333}
.btn.line.danger{background:#fff;color:#111;border-color:#BDBDBD}.btn.line.danger:hover{background:var(--g0)}
.rec-h{font-size:14px;font-weight:700;margin:26px 0 10px;text-align:left}
.recs{display:flex;flex-direction:column;gap:8px;text-align:left}
.rec1{display:flex;align-items:center;gap:12px;background:var(--g0);border-radius:var(--r-card);padding:10px 14px}
.rec1 b{font-size:14.5px}.rec1 b small{font-size:11.5px;color:var(--g2);font-weight:500;margin-left:6px}
.rec1 p{font-size:12.5px;color:#555;margin-top:1px}.rec1 span{display:block;font-size:11.5px;color:var(--g2);margin-top:2px}
.rec1 em{font-style:normal;font-family:Pretendard,system-ui,sans-serif;font-weight:600;font-size:13px}
.own{text-align:center;margin:6px 16px 14px}
.own-l{display:block;font-size:11px;color:var(--g2);letter-spacing:.04em;margin-bottom:4px}
.own q{display:block;font-family:Pretendard,system-ui,sans-serif;font-weight:500;font-size:15px;line-height:1.55;color:#333;quotes:"“" "”"}
.ai-busy{font-size:12px;color:#999;text-align:center;margin-top:6px;animation:blink 1.6s ease-in-out infinite}
.ai-in{animation:fade .5s ease}
/* 채팅 안에서 누를 수 있는 버튼: 말풍선(회색)과 헷갈리지 않게 흰 바탕 + 진한 테두리 */
#msgs .chip{background:#fff;border:1.5px solid #222;color:#111;font-weight:600}
#msgs .chip:hover{background:#F3F3F3}
#msgs .chip.sel,#msgs .chip.dark{background:#111;color:#fff;border-color:#111}
#msgs .chip.done{border-color:#C9C9C9;color:#999;font-weight:500}
.kept em{font-style:normal;font-family:Pretendard,system-ui,sans-serif;font-weight:600;font-size:12.5px}
.kept-btn{align-self:flex-end;background:none;border:0;padding:2px 0;cursor:pointer;font:inherit}.kept-btn u{text-decoration:none;color:#777;border-bottom:1px solid #C9C9C9;margin-left:4px}
.fl-edit{align-self:stretch;background:#fff;border:1px solid var(--g1);border-radius:var(--r-card);padding:12px 12px 10px;animation:fade .3s ease}
.fl-edit p{font-size:12.5px;color:var(--g2);margin-bottom:8px}.fl-edit .chip i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.fl-edit .feelnext{margin-top:10px}
.msg-img{align-self:flex-end;max-width:62%;border-radius:16px;display:block}
.kept{align-self:flex-end;font-size:11px;color:#B5B5B5;margin-top:-6px}
.chips.end{justify-content:flex-end}
.gcard{align-self:flex-start;width:88%;background:#fff;border:1px solid var(--g1);border-radius:var(--r-card);padding:14px 16px;font-size:13px;animation:fade .3s ease}
.gcard b{font-size:14.5px}.gcard dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:10px}
.gcard dt{color:var(--g2)}.gcard dd{font-weight:600}.gcard dd small{display:block;font-weight:400;color:var(--g2);font-size:12px}
.gcard .gtip{margin-top:10px;font-size:12px;color:#666;background:var(--g0);border-radius:10px;padding:8px 10px}
.scr-chat .stepbar{position:sticky;top:0;z-index:4;background:#fff;margin-bottom:0}
.tearow.pin{position:sticky;top:44px;z-index:3;background:#fff;padding:6px 0 10px;margin:8px 0 6px;border-bottom:1px solid var(--g0)}
.tearow.pin b{max-width:230px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tearow .gsum{display:block;font-size:12px;color:var(--g2)}
.chips.more .chip.done{color:#999}
.chip.dark{background:#111;color:#fff}
.msg.sys{align-self:center;background:none;font-size:12px;color:var(--g2);padding:2px}
.chatfoot{position:sticky;bottom:0;background:#fff;padding:10px 0 4px;margin-top:auto}
/* 사파리 + 큰 화면(휴대폰 틀을 transform으로 키우고 줄임): 사파리는 이 틀 안의 sticky 위치를 잘못 계산해 입력칸이 화면 중간에 뜬다
   → 입력칸을 틀(.phone, transform이 있어 fixed의 기준이 됨) 바닥의 하단 탭 바로 위에 붙이고, 그 높이만큼 대화 아래에 여백 */
html.safari:not(.mob) .scr-chat .chatfoot{position:fixed;left:22px;right:22px;bottom:60px;z-index:5;margin:0}
html.safari:not(.mob) .scr-chat{padding-bottom:calc(var(--cfh,110px) + 8px)}
html.safari:not(.mob) .stickfoot{position:static;background:none}   /* 같은 이유로: 아래에 붙는 버튼은 내용 끝에 그대로 */
.inrow{display:flex;align-items:center;background:var(--g0);border-radius:26px;padding:5px 5px 5px 18px;margin-bottom:10px}
.inrow input{flex:1;font-size:14.5px;min-width:0}.inrow input::placeholder{color:#9A9A9A}/* 예시 문장: 입력칸 안에 흐린 글씨로, 문장 끝에 → 표시가 붙는다(누르거나 Tab·→ 키로 넣기) */.inwrap{position:relative;flex:1;min-width:0;display:flex}.inwrap input{flex:1;min-width:0}.sugg{position:absolute;left:0;right:6px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;font:inherit;font-size:14.5px;color:#A6A6A6;text-align:left;pointer-events:none}.sugg kbd{pointer-events:auto;cursor:pointer;padding:4px 8px!important}   /* 글씨를 누르면 직접 쓰기(입력칸에 커서), → 를 누르면 예시 문장 넣기 */.sugg[hidden]{display:none}.sugg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.sugg kbd{flex:0 0 auto;font:inherit;font-size:12px;font-weight:700;color:#737373;background:#fff;border:1px solid #D6D6D6;border-radius:6px;padding:1px 6px;line-height:1.4}
.send{width:38px;height:38px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;flex-shrink:0}
.vstate{font-size:12.5px;color:#9A9A9A;text-align:center;margin-top:2px;min-height:18px}
.heard{font-size:14px;text-align:center;margin-top:14px;min-height:22px}
/* ---------- loaders ---------- */
.loader{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-bottom:40px}
@keyframes rot{to{transform:rotate(360deg)}}
.phases{display:flex;align-items:flex-start;justify-content:center;gap:14px;margin-top:30px}
.phases .ph{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;color:var(--g2);width:84px}
.phases .ph i{width:9px;height:9px;border-radius:50%;background:#D4D4D4}
.phases .ph.on{color:#000;font-weight:700}
.phases .ph.on i{background:#000}
.phases .ar{color:#999;margin-top:-4px}
/* ---------- depth / compare ---------- */
.opt{display:flex;align-items:center;gap:12px;background:var(--g0);border-radius:var(--r-card);padding:13px 14px;margin-top:10px;width:100%;text-align:left}
.opt .ic{width:24px;display:grid;place-items:center;flex-shrink:0}
.opt .tx{flex:1;min-width:0}
.opt b{font-size:15px}
.opt b small{font-weight:400;font-size:12px;color:var(--g2);margin-left:4px}

.hp-shadow{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.2) 0,rgba(0,0,0,.08) 45%,rgba(0,0,0,0) 70%);animation:hpShadow 2.4s ease-in infinite}
.hp-finger{position:relative;width:64px;height:64px;transform-origin:50% 20%;animation:hpPress 2.4s ease-in infinite}
.hp-spot.fg1 .hp-finger,.hp-spot.fg2 .hp-finger{margin-top:56px}   /* 아래에서 올라온 손가락: 손끝이 그림자 한가운데 */

.hp-spot.fg4 .hp-finger{margin-top:50px}
.hp-spot.fg5 .hp-finger,.hp-spot.fg6 .hp-finger{width:54px;height:54px;top:15px;left:2px;transform-origin:45% 25%}   /* 손끝(탭 표시 안쪽)이 그림자 한가운데 */

.hp.holding .hp-finger{animation:none;transform:scale(.86)}.hp.holding .hp-shadow{animation:none;transform:scale(.7);opacity:1}.hp.holding .hp-wave{animation:none;opacity:0}
/* 꾹 누르는 느낌: 떠 있을 땐 크게 → 눌리면 작게, 눌린 채로 오래 머물렀다가 → 천천히 뗀다 */
@keyframes hpPress{0%,100%{transform:scale(1.12)}18%{transform:scale(.88);animation-timing-function:linear}72%{transform:scale(.86);animation-timing-function:ease-out}}
@keyframes hpShadow{0%,100%{transform:scale(1.3);opacity:.45}18%{transform:scale(.72);opacity:1;animation-timing-function:linear}72%{transform:scale(.7);opacity:1;animation-timing-function:ease-out}}

  addEventListener('focusin',e=>{ if(typing(e.target)){ R._kbFocusOnly=true; R.classList.add('kb'); setTimeout(()=>{ R._kbFocusOnly=false; upd(); },700); } });   // 키보드가 올라오는 동안엔 우선 숨기고, 다 올라온 뒤엔 높이로 판단
  addEventListener('focusout',()=>setTimeout(()=>{ if(!typing(document.activeElement)) R.classList.remove('kb'); },60));
  (window.visualViewport||window).addEventListener('resize',upd); })();</script>

const unfill=t=>{ let x=String(t||''); for(let i=0;i<3;i++) x=x.replace(FILLER,'$1'); return x.replace(/\s+/g,' ').replace(/^[\s,.]+|[\s,]+$/g,'').trim(); };
function ownWords(texts){ const out=[]; (texts||[]).forEach(t=>{ t=unfill(t); if(t.length<4||/모르겠|없어요/.test(t)||out.includes(t)||chipWords().has(t)) return; if(!FKEYS.filter(k=>FLAVORS[k].kw.some(w=>t.replace(/\s/g,'').includes(w))).length) out.push(t); }); return out.slice(0,3); }

const gongfuOf=type=>({temp:GONGFU_T[type]||'90 – 95°C',time:'15 – 25초',secs:20,amount:'찻잎 5 – 7g (개완 100ml)',how:['첫 물은 찻잎을 깨우듯 헹궈 버려주세요','우릴 때마다 5 – 10초씩 늘려가요.'],tip:'같은 잎으로 다섯 번 넘게 우려도 좋아요. 우림마다 달라지는 향을 비교해보세요.'});

const CANVAS_BG='#FAF8F4';

/* 기록 → 찻방울 데이터 */

function teaDrop(type){
  if(type==='clear') return {id:'clear',comps:[{key:'water',c:CLEAR,w:.6}]};
  if(!type) return {id:'empty',comps:[{key:'tea',c:'#C4C4C4',w:.85}]};
  const c=TEAS[type].color;

}
function recDrop(r){
  if(!r.flavors||!r.flavors.length) return {...teaDrop(r.type),id:'rb-'+r.id};
  return {id:r.id,comps:[{key:'tea',c:TEAS[r.type].color,w:.5},...r.flavors.map(f=>({key:f.k,c:FLAVORS[f.k].color,w:f.w}))]};
}

}

function spreadDrops(root){ if(!root) return;

    view.scrollTop = keepScroll ? top : 0;

const cvLegend=()=>(PREF.lang==='en'?`<div class="cvleg"><span><svg width="16" height="10" viewBox="0 0 16 10"><path d="M1 5h13M10 1.5L14 5l-4 3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><em>Further right: better <b>aroma</b></em></span><span><svg width="10" height="14" viewBox="0 0 10 14"><path d="M5 13V1.5M1.5 5L5 1.5 8.5 5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><em>Higher: better <b>taste</b></em></span></div>`:`<div class="cvleg"><span><svg width="16" height="10" viewBox="0 0 16 10"><path d="M1 5h13M10 1.5L14 5l-4 3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><em>오른쪽일수록 <b>향</b>이 좋아요</em></span><span><svg width="10" height="14" viewBox="0 0 10 14"><path d="M5 13V1.5M1.5 5L5 1.5 8.5 5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><em>위쪽일수록 <b>맛</b>이 좋아요</em></span></div>`).replace(/<\/div>$/,'<button class="help" onclick="openCanvasHelp()" aria-label="캔버스 읽는 법">?</button></div>');

const recsAsc=()=>[...S.records].filter(r=>r.canvas).sort((a,b)=>(a.ts||0)-(b.ts||0));
/* 캔버스 기간: 전체 · 1개월 · 3개월 · 올해 (기록 목록의 기간과 같은 기준) */
const cvFrom=p=>{ const now=new Date(); return {all:0,'1m':now.getTime()-31*864e5,'3m':now.getTime()-92*864e5,'1y':new Date(now.getFullYear(),0,1).getTime()}[p]||0; };
const cvRecs=()=>{ if(S.cvPeriod==='range'&&S.cvRange){ const {from,to}=S.cvRange; return recsAsc().filter(r=>{ const k=ymd(r.ts||0); return k>=from&&k<=to; }); } const f=cvFrom(S.cvPeriod||'all'); return recsAsc().filter(r=>(r.ts||0)>=f); };
/* 겹칠수록 연하게: 주변에 겹치는 찻방울이 많을수록 그 방울을 연하게 그려, 아무리 쌓여도 캔버스가 탁하고 어두워지지 않게 */

/* 표현 → 풍미 계열 */
let _AKW; const allKw=()=>_AKW||(_AKW=[...new Set(FKEYS.flatMap(k=>FLAVORS[k].kw))]);
function matchFlavors(text){ const raw=String(text||''), t=raw.replace(/\s/g,''), lo=' '+raw.toLowerCase().replace(/[^a-z]+/g,' ')+' ';
  const neg=i=>{ let seg=t.slice(i,i+16); const c=seg.search(/(고(?!소)|며|지만|는데|그리고|[,.!?~])/); if(c>=0) seg=seg.slice(0,c);
    const nx=allKw().reduce((m,w)=>{ const j=seg.indexOf(w,1); return j>0&&j<m&&!/^(이?나|이?랑|와|과|하고|및|도)$/.test(seg.slice(0,j))?j:m; },seg.length); seg=seg.slice(0,nx);   // 다른 풍미 낱말이 나오면 거기까지만('A나 B는 없어요'처럼 묶인 건 함께)   // 같은 마디 안에서만 본다(‘꽃향이 나고 쓴맛은 없어요’)
    return /(없|않|아니|별로|안나|안느|제로|zero)/i.test(seg); };
  const has=w=>{ let i=t.indexOf(w); while(i>=0){ const pre=t.slice(Math.max(0,i-1),i), pre2=t.slice(Math.max(0,i-2),i); if(!((pre==='안'&&!/^(입|편|불|미|보|치)안$/.test(pre2))||pre==='못')&&!neg(i+w.length)) return true; i=t.indexOf(w,i+1); } return false; };   // 뒤에 '없/않/아니/별로/제로', 앞에 '안/못'이 붙으면 그 풍미는 빼기
  return FKEYS.filter(k=>FLAVORS[k].kw.some(has)||(typeof FL_EN!=='undefined'&&FL_EN[k].some(w=>lo.includes(' '+w)&&!new RegExp('(no|not|without|hardly|barely)\\s+(any\\s+)?'+w).test(lo)))); }
function collectExprs(d){

/* 정도 표현: '살짝·조금·약간·은은하게'는 작게, '많이·진하게·엄청·확'은 크게(찻방울 안에서 그 색이 차지하는 크기) */
function amountOf(text){ const t=String(text||'').replace(/\s/g,'');
  const e=' '+String(text||'').toLowerCase()+' ';
  if(/(엄청|너무|아주|정말|진짜|완전|많이|강하게|강한|진하게|진한|확|가득|꽉|짙)/.test(t)||/\b(very|really|so|super|strong|strongly|intense|lots of|a lot|heavy|rich)\b/.test(e)) return 1.6;
  if(/\b(slightly|a bit|a little|little|faint|faintly|subtle|subtly|hint of|barely|mild|gentle)\b/.test(e)) return .55;
  if(/(살짝|조금|약간|은은|희미|살며시|미세|옅게|옅은|어렴풋|아주조금|살짝은)/.test(t)) return .55;

// 먼저 떠올린 표현과 여러 번 나온 풍미일수록 진하게(최대 4가지)
function scoreFlavors(exprs){
  const sc={}; let i=0;
  exprs.forEach(e=>{ if(!e.fl.length) return; const w=(1+(i===0?.4:i===1?.2:0))*amountOf(e.text); i++; e.fl.forEach(k=>sc[k]=(sc[k]||0)+w*(e.fl.length>2?.8:1)); });
  const ks=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]).slice(0,4), mx=sc[ks[0]]||1;

}

function suggestFor(d){ if(!d||S.typing) return '';
  const said=new Set(d.chat.filter(m=>m.who==='me').map(m=>String(m.text).trim())), bot=[...d.chat].reverse().find(m=>m.who==='bot'&&m.text), q=bot?String(bot.text).split('\n').pop():'', ty=d.type||'other';

  else if(d.stage==='teaType'||d.stage==='guide'||d.stage==='done'||d.stage==='deep') pool=null;
  else if(/기분|하루|날씨|마음/.test(q)) pool=SUG.mood;
  else if(/어디|누구|상황|자리/.test(q)) pool=SUG.scene;
  else if(/이유|만나게|당겼|고른/.test(q)||d.talkPending) pool=SUG.why;
  else if(d.stage==='color'||/색/.test(q)) pool=SUG.color;
  else if(/여운|끝에 남|식으면서/.test(q)||d.stage==='after') pool=SUG.after;
  else if(/맛|모금/.test(q)||d.stage==='taste') pool=SUG.taste[ty]||SUG.taste.other;
  else if(/향/.test(q)||d.stage==='aroma') pool=SUG.aroma[ty]||SUG.aroma.other;
  else if(d.stage==='wait'||d.stage==='wait2') pool=SUG.wait;   // 우리는 동안 감각 안내(질문이 아니어도)
  else if(d.stage==='free'||d.stage==='more') pool=SUG.free;
  if(!pool) return ''; const left=pool.filter(t=>!said.has(t)&&!said.has(L(t))); return left[0]||''; }

const BRANDS=['Twinings','Lipton','Harney & Sons','Mariage Freres','Kusmi','Ronnefeldt','TWG','Teavana','Dilmah','Yogi','Taylors','Osulloc','Tazo','Bigelow','오설록','티하우스','트와이닝','트와이닝스','운남 다원','TWG','립톤','로네펠트','마리아쥬','쿠스미','하니앤손스','녹차원','담터','다도원'];

function cleanTeaName(text){ let t=String(text||'').replace(/\([^)]*\)?|\[[^\]]*\]?/g,' ').replace(/[ㄱ-ㅎㅏ-ㅣ]+/g,' ').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,' ').replace(/\s+/g,' ').trim();
  const parts=t.replace(/\s*(이거|이건)?\s*(카페인|몇\s*번|어떻게|왜|효능|다이어트|차이|좋아요|있어요|되나요|돼요)[^,.!?~]*[?？]/g,'?').split(/[,!?~]|(?<=[가-힣])\.|\s(?:근데|그런데|그리고|그냥)\s|(?<=[가-힣])(?:인데|는데|이고)\s|(?<=요)\s/).map(x=>x.trim()).filter(Boolean);

  c=(c||t).trim(); return c.length>30?c.slice(0,30):c; }
function parseTea(text){ text=String(text||'').replace(/(^|\s)[ㄱ-ㅎㅏ-ㅣ]+(?=\s|$)/g,' ').trim(); const full=String(text||''), t=cleanTeaName(text).replace(/[.!?~]+$/,'').replace(/\s*(이에요|예요|이요|입니다|이야|요|마셔요|마실게요|마실래요|마셔|마실게|야|임|이다)$/,'').replace(/(?<=[가-힣])\s+차$/,m=>/^(녹|홍|보이|우롱|백|흑|허브|보리|옥수수|유자|생강|대추|말|현미녹|냉|밀크|과일|우엉|둥굴레|메밀|결명자|도라지|돼지감자|감잎|뽕잎|연잎|국화|현미|모과|레몬|자몽)$/.test(String(text).replace(/\s*차.*$/,'').trim().split(' ').pop())?m:'').trim(); let brand=''; for(const b of BRANDS){ if(full.toLowerCase().includes(b.toLowerCase())){ brand=b; break; } }
  let name=brand?t.replace(new RegExp(brand.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),'').replace(/^[\s,·\-/]+|[\s,·\-/]+$/g,'').trim():t; if(!name) name=t;

function flowMsg(text,forced,img){ const d=S.draft, at=d.tid, t0=Date.now(), st=d.stage, want=flowWant(d), vo=VOICE.fromVoice||null;   // img: 차 포장 사진(데이터 URL)

  d.pendingMe=forced||img?null:me;   // 생각하는 동안 내가 이어서 말하면 이 말에 붙여 다시 묻는다
  flowCallRetry('message',img?'(차 포장 사진을 보냈어요)':text,vo,img).then(j=>setTimeout(()=>{ if(j&&j.amended) return; if(d.pendingMe===me) d.pendingMe=null; if(!S.draft||S.draft.tid!==at){ S.typing=false; return; } S.typing=false;
    if(j&&vo&&j.heard&&j.heard!==text){ me.raw=text; me.text=j.heard; text=j.heard; }   // 잘못 들린 말은 AI가 고친 문장으로 (원래 들린 말은 raw에)
    if(!j){ const i=d.chat.lastIndexOf(me); if(i>=0) d.chat.splice(i,1); paintBadge();   // AI가 안 되면 이 말은 정해진 흐름으로. AI가 다시 되면 다음 말부터 다시 AI
      if(img){ d.chat.push(me); return botSay({who:'bot',text:'사진은 오늘 기록에 담아둘게요.\n사진 속 글자는 아직 읽지 못해서, 차 이름을 알려주시겠어요?',teaAsk:true},300); }   // AI가 안 되면 사진은 담기만
      if(forced) return answer(forced.k,text,forced.extra||{},true); return sendMsg(text,false,true); }
    const f=j.fill||{}; if(Array.isArray(j.unknown)) f.unknown=j.unknown;
    if(forced){ f[forced.k]=text; if(forced.k==='color'&&forced.extra&&forced.extra.color){ d.feel.colorHex=forced.extra.color; f._slider=true; } }
    const step=flowStepOf(j), got=want==='extra'?true:!!(want&&f[want]&&!(f.unknown||[]).includes(want));
    if(!forced){ if(got&&isAsk(want)) me.ans=want; else if(step==='finished_drinking'||step==='close') me.ans='nav'; else if((!j.sense||isQuestion(text))&&!(want==='after'&&got)) me.ans='talk'; }   // 질문·마무리 인사·잡담은 찻방울 표현에서 뺀다
    if(['tea','teaOK','teaType','guide'].includes(st)) me.ans='tea';
    flowFlavors(d,me,f,j.flavors,!!j.step);   // 새 서버는 늘 step을 준다 = Gemini가 판단함
    const r=flowDecide(d,f,step,{requests:j.requests,clear:j.clear});   // Gemini의 판단을 앱에 적용 (실시간 음성과 같은 함수)
    if(r==='teaOK') { d.chat.push({who:'bot',text:j.reply,ai:true,tea:true,chips:['맞아요','다시 적을게요']}); return rerender(); }
    if(r==='teaType'){ d.chat.push({who:'bot',text:j.reply,ai:true,tea:true,chips:ORDER.map(k=>TEAS[k].label)}); return rerender(); }
    if(r==='guide'){ d.chat.push({who:'bot',text:j.reply,ai:true}); return showGuide(); }
    if(r==='brew'){ d.chat.push({who:'bot',text:j.reply,ai:true}); beginBrew(true); flowTimer(j); return; }
    flowTimer(j);
    if(r==='reguide'){ d.chat.push({who:'bot',text:j.reply,ai:true}); return showGuide(true); }   // '개완으로 할게' / '개완 말고 그냥 컵에' → 그 가이드로
    if(r==='finish'){ flowBot(d,j.reply); return flowFinish(); }
    if(r==='moved'){ flowBot(d,j.reply); return rerender(); }
    if(r==='guidecard'){ d.chat.push({who:'bot',guide:true,basic:!!d.basic,gongfu:!!d.gongfu,text:j.reply,ai:true}); d.lastBotAt=Date.now(); return paintMsgs(); }
    if(st==='tea'){ d.chat.push({who:'bot',text:j.reply,ai:true,teaAsk:true}); return paintMsgs(); }
    if(st==='teaOK'||st==='teaType'||st==='guide'){ d.chat.push({who:'bot',text:j.reply,ai:true,tea:true,chips:st==='guide'?['우림 시작 ▶','바로 마실게요']:st==='teaOK'?['맞아요','다시 적을게요']:ORDER.map(k=>TEAS[k].label)}); return paintMsgs(); }
    flowBot(d,j.reply); },Math.max(0,500-(Date.now()-t0)))); }
/* Gemini가 비유·장면까지 읽어 고른 풍미 계열 → 이 말과 이번에 채운 향·맛·여운의 찻방울 색으로 */
function flowFlavors(d,me,f,fl,seen){ if(!seen) return; fl=(Array.isArray(fl)?fl:[]).filter(k=>FLAVORS[k]); const fm=d.flMap||(d.flMap={});   // seen: Gemini가 이 말을 읽고 판단함 → 빈 배열이어도 그 판단을 따른다 (앱의 낱말 사전으로 덧칠하지 않는다)
  ['aroma','taste','after'].forEach(k=>{ if(f[k]) fm[String(f[k])]=fl; }); if(me&&me.ans!=='tea'&&me.ans!=='nav'){ me.fl=fl; if(fl.length&&me.ans==='talk') delete me.ans; } }
/* Gemini가 앱 전체를 알 수 있게: 지난 기록 요약 (최근 30잔). 읽기만 하고, 지금 기록 중인 한 잔만 Gemini가 바꿀 수 있다 */
function appMemory(){ const like=v=>v>=.62?'좋아요':v<=.38?'별로':'보통';
  const rs=[...S.records].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,30).map(r=>({date:r.date||ymd(r.ts||0),ago:Math.max(0,Math.floor((Date.now()-(r.ts||0))/864e5)),name:r.name,brand:r.brand||'',type:TEAS[r.type]?TEAS[r.type].label:'',
    flavors:(Array.isArray(r.flavors)?r.flavors.map(f=>f&&f.k):(r.flAll||[])).filter(k=>FLAVORS[k]).slice(0,4).map(k=>FLAVORS[k].label),
    pos:r.canvas?`향 ${like(r.canvas.x)}·맛 ${like(1-r.canvas.y)}`:'',stars:r.stars||0,comment:String(r.comment||'').slice(0,50)}));
  let fav=''; try{ const f=favDrop(); if(f) fav=`${f.title} (${f.all.map(x=>FLAVORS[x.k]?FLAVORS[x.k].label:x.k).join('·')})`; }catch(e){}
  return {today:ymd(Date.now()),total:S.records.length,records:rs,fav}; }
function appMemoryText(){ const m=appMemory(); return `[앱 정보] 오늘: ${m.today}\n사용자의 지난 기록 (전체 ${m.total}잔, 최근 순; 날짜 / 차 / 종류 / 풍미 / 캔버스: 향·맛 호감 / 별점 / 코멘트):\n`+m.records.map(r=>[`${r.date} (${r.ago}일 전)`,r.name+(r.brand?`(${r.brand})`:''),r.type,r.flavors.join('·'),r.pos,r.stars?'★'+r.stars:'',r.comment?`"${r.comment}"`:''].filter(Boolean).join(' / ')).join('\n')+(m.fav?`\n나의 취향 찻방울: ${m.fav}`:'')+'\n(이건 참고 정보야. 대답하지 말고, 물어볼 때 써.)'; }
/* Gemini가 우림 타이머를 바꿔 달라고 하면: 남은 시간 바꾸기(timer_set, 초) · 멈추기 · 다시 돌리기 */
function flowTimer(j){ const t=S.timer, req=Array.isArray(j&&j.requests)?j.requests:[], n=Number(j&&j.timer_set); if(!t) return false; let ch=false;
  if(Number.isFinite(n)&&n>0){ const done=t.total-t.left; t.left=Math.round(n); t.total=done+t.left; t.running=true; ch=true; }
  const add=Number(j&&j.timer_add); if(!(n>0)&&Number.isFinite(add)&&add){ const done=t.total-t.left; t.left=Math.max(5,Math.round(t.left+add)); t.total=done+t.left; t.running=true; ch=true; }   // '1분 늘려줘' → 더하기
  if(req.includes('pause_timer')&&t.left>0){ t.running=false; ch=true; } if(req.includes('resume_timer')&&t.left>0){ t.running=true; ch=true; }
  if(ch) try{ paintTimer(); }catch(e){} return ch; }
/* Gemini의 다음 동작(step). 예전 모양(action·finish·end)으로 와도 같은 뜻으로 */
const flowStepOf=j=>j.step||({start_brew:'start_brew',drink_now:'drink_now',brew_done:'brew_done',ask_color:'show_color',confirm_tea:'confirm_tea',finish_drinking:'finished_drinking',end:'close'})[j.action]||(j.end?'close':j.finish?'finished_drinking':'stay');
/* Gemini의 판단(record·unknown·step)을 앱에 적용한다. 글 대화(flowMsg)와 실시간 음성(liveTool)이 같이 쓴다.
   앱은 판단하지 않고, 지금 단계에서 그 동작이 가능한지만 보고 실행한다.
   돌려주는 값 = 그다음 화면 일: 'teaOK'·'teaType'(종류 확인) 'guide'(우림 가이드) 'brew'(타이머 시작) 'moved'(단계가 바뀜) 'finish'(기록 정리) '' */
function flowDecide(d,f,step,ask={}){ const st=d.stage, want=flowWant(d);
  const req=new Set((Array.isArray(ask.requests)?ask.requests:[]).concat(({show_color:'show_color',guide_gongfu:'gongfu_guide',guide_basic:'basic_guide'})[step]||[]));   // Gemini가 앱에 하는 요청
  (Array.isArray(f.unknown)?f.unknown:[]).forEach(k=>{ delete f[k]; }); delete f.unknown;   // '모르겠어'는 기록이 아니다
  const drink=()=>{ startDrink(); d.direct=true; S.timer=null; d.stage='color'; S.ask={hd:TC_GUESS[d.type]?[...TC_GUESS[d.type]]:null,sel:[]}; return 'moved'; };
  const switchGuide=()=>{ const g=req.has('gongfu_guide')?true:req.has('basic_guide')?false:null; if(g===null||!!d.gongfu===g) return false; d.gongfu=g; d.basic=false; return true; };
  if(['tea','teaOK','teaType','guide'].includes(st)){
    if(f.name) d.name=String(f.name).slice(0,30); if('brand' in f) d.brand=cleanBrand(f.brand); if(f.about) d.about=String(f.about).slice(0,160);
    if(st==='guide'){ if(switchGuide()||req.has('show_guide')) return 'reguide'; return step==='start_brew'?'brew':step==='drink_now'?drink():''; }
    if(TEAS[f.type]) d.type=f.type;
    if(!d.name) return '';
    if(d.type&&['confirm_tea','start_brew','drink_now'].includes(step)&&(st!=='tea'||TEAS[f.type])){ switchGuide(); return step==='drink_now'?drink():step==='start_brew'?'brew':'guide'; }
    if(st==='tea'){ d.stage=TEAS[f.type]?'teaOK':'teaType'; return d.stage; }
    return ''; }
  let teaFix=false;   // 기록 중 언제든 '이름이 ○○였어', '홍차가 아니라 우롱차야' → 지금 기록의 차 정보를 고친다
  if(f.name&&f.name!==d.name){ d.name=String(f.name).slice(0,30); teaFix=true; } if('brand' in f&&cleanBrand(f.brand)!==(d.brand||'')){ d.brand=cleanBrand(f.brand); teaFix=true; } if(TEAS[f.type]&&f.type!==d.type){ d.type=f.type; teaFix=true; } if(f.about) d.about=String(f.about).slice(0,160);
  if((st==='wait'||st==='wait2')&&S.timer&&S.timer.left>0&&switchGuide()){ S.timer=null; return 'reguide'; }   // 우리는 중에 우림 방법을 바꾸면 가이드부터 다시
  flowApply(d,f);
  // 지우기: '아까 맛 표현 지워줘' → 그 칸을 비우고, 이미 지나간 단계면 그 단계로 돌아가 다시 묻는다
  const ORD=['wait','color','wait2','aroma','taste','free','after','more']; let back=null;
  (Array.isArray(ask.clear)?ask.clear:[]).forEach(k=>{
    if(k==='color'){ d.feel.color=''; d.feel.colorHex=null; d.feel.colorHD=null; } else if(k==='aroma'||k==='taste') d.feel[k]=''; else if(k==='after') d.afterText='';
    else if(k==='memo'||k==='extra'){ if(d.deep) d.deep.memo=''; } else if(d.talk) delete d.talk[k];
    const to=k==='after'?'after':k; if(ORD.includes(to)&&ORD.indexOf(st)>ORD.indexOf(to)&&(back===null||ORD.indexOf(to)<ORD.indexOf(back))) back=to; });
  if(back){ d.stage=back; S.ask={hd:back==='color'?(d.feel.colorHD||(TC_GUESS[d.type]?[...TC_GUESS[d.type]]:null)):null,sel:[]}; return 'moved'; }
  const got=want==='extra'?!!(f.extra||f.memo):!!(want&&f[want]);
  if(step==='brew_done'&&(st==='wait'||st==='wait2')&&S.timer&&S.timer.left>0){   // '다 우렸어' → 타이머를 끝내고 색(또는 향)으로
    S.timer.left=0; S.timer.running=false; startDrink(); try{ paintTimer(); }catch(e){}
    d.stage=st==='wait'&&!d.feel.color?'color':'aroma'; S.ask={hd:d.stage==='color'&&TC_GUESS[d.type]?[...TC_GUESS[d.type]]:null,sel:[]}; flowAdvance(d,true); return 'moved'; }
  if(req.has('show_color')&&['wait','wait2','color','aroma','taste','free'].includes(st)&&!f.color){ d.stage='color'; S.ask={hd:(S.ask&&S.ask.hd)||d.feel.colorHD||(TC_GUESS[d.type]?[...TC_GUESS[d.type]]:null),sel:[]}; return 'moved'; }   // 색 슬라이더 (다시). 고르고 나면 아직 빈 칸으로 돌아간다
  if(st==='wait'&&f.color){ d.stage=brewDone()?'aroma':'wait2'; S.ask={hd:null,sel:[]}; flowAdvance(d,true); return 'moved'; }   // 우리는 중에 색을 말하면 바로 기록
  if((st==='after'||st==='more')&&(step==='close'||(st==='more'&&got))){ d.stage='done'; return 'finish'; }
  if(got) flowAdvance(d); else if(st==='free'&&(step==='finished_drinking'||step==='close')) flowAdvance(d);
  if(req.has('show_guide')&&d.stage===st) return 'guidecard';   // 우림 가이드 카드를 다시 (단계는 그대로)
  return d.stage!==st||teaFix?'moved':''; }

/* 봇이 생각하는 동안 내가 이어서 말하면: 기다리던 요청은 버리고, 앞말과 합쳐 다시 묻는다 (클로드·GPT 음성 모드처럼) */
function flowAmend(more){ const d=S.draft, me=d&&d.pendingMe; if(!me){ return false; }
  const i=d.chat.lastIndexOf(me); if(i>=0) d.chat.splice(i,1); d.pendingMe=null;
  if(AI_FLOW_CTL){ AI_FLOW_CTL.amend=true; try{ AI_FLOW_CTL.abort(); }catch(e){} }
  S.typing=false; VOICE.fromVoice={alts:VOICE.alts||[]}; flowMsg((me.raw||me.text)+' '+more); VOICE.fromVoice=null; return true; }
/* 앱 쪽 일(색이 우러남·다 우러남·다 마심)을 AI가 말로 전한다. 실패하면 false */
function flowEvent(ev){ const d=S.draft, at=d.tid; S.typing=true; paintMsgs();
  return flowCall(ev).then(j=>{ if(!S.draft||S.draft.tid!==at){ S.typing=false; return false; } S.typing=false; if(!j){ paintMsgs(); return false; } flowApply(d,j.fill||{}); flowBot(d,j.reply); return true; }); }
/* AI 대화일 때 우리는 동안: 정해진 질문 대신, 한동안(25초) 조용하면 AI가 한마디 건넨다(최대 3번) */
function aiNudge(delay){ setTimeout(()=>{ const d=S.draft; if(!d||cur()!=='chat'||!(d.stage==='wait'||d.stage==='wait2')) return;
  if(LIVE.on){ const quiet=Date.now()-Math.max(d.lastMeAt||0,d.lastBotAt||0); if(quiet<25000||LIVE.sources.length) return aiNudge(5000); if((d.aiNudgeN||0)>=3) return; d.aiNudgeN=(d.aiNudgeN||0)+1; d.lastBotAt=Date.now(); liveEvent('사용자가 한동안 조용해요. 차가 우러나는 지금에 어울리는 말을 한 번 건네 주세요.'); return aiNudge(5000); }
  if(!chatAIOn()) return talkNext(1000);
  const inp=$('#chatIn'), quiet=Date.now()-Math.max(d.lastMeAt||0,d.lastBotAt||0);
  if(S.typing||(inp&&inp.value.trim())||VOICE.phase==='speaking'||quiet<25000) return aiNudge(5000);
  if((d.aiNudgeN||0)>=3) return; d.aiNudgeN=(d.aiNudgeN||0)+1; d.lastBotAt=Date.now(); aiSay('idle').then(()=>{ d.lastBotAt=Date.now(); aiNudge(5000); }); },delay); }
function beginBrew(quiet){ const d=S.draft, g=guideOf(d);
  S.timer={total:g.secs,left:g.secs,running:true}; d.stage='wait';
  if(quiet){ d.lastBotAt=Date.now(); rerender(); return talkNext(5000); }   // AI가 이미 '시작했어요'라고 말했으면 안내 말 없이 타이머만
  if(chatAIOn()){ d.chat.push({who:'bot',text:'우림을 시작했어요. 다 우려지면 알려드릴게요.',wait:true}); d.lastBotAt=Date.now(); rerender(); setTimeout(()=>{ if(S.draft===d&&d.stage==='wait') aiSay('brew_start').then(()=>{ d.lastBotAt=Date.now(); talkNext(5000); }); },900); return; }
  d.chat.push({who:'bot',text:'우림을 시작했어요. 다 우려지면 알려드릴게요.\n그동안 마른 찻잎 향을 살짝 맡아봐도 좋아요.',wait:true}); rerender(); talkNext(2600); }
function guideCard(m){ const d=S.draft, g=guideOf(d,m);
  return `<div class="gcard"><b>${m.basic?L('기본 우림 가이드'):m.gongfu?esc(L(d.name+' 개완 우림 가이드')):esc(L(d.name+' 우림 가이드'))}</b>
    <dl><dt>${L('물 온도')}</dt><dd>${g.temp}</dd><dt>${L('우리는 시간')}</dt><dd>${L(g.time)}</dd><dt>${L('양')}</dt><dd>${L(g.amount)}</dd><dt>${L('맛있게')}</dt><dd>${L(g.how[0])}<small>${L(g.how[1])}</small></dd></dl>
    <p class="gtip">✦ ${L(g.tip)}</p></div>`; }
const brewDone=()=>!S.timer||S.timer.left<=0, brewed=()=>S.timer?S.timer.total-S.timer.left:1e9;
/* 우리는 중: 1분 지나면(또는 다 우리면) 색을 묻고, 색 뒤에는 다 우려질 때까지 기다렸다가 향을 묻는다 */
function chatTick(){ const d=S.draft; if(!d) return false;
  if(d.stage==='wait'&&(brewDone()||brewed()>=60)){ askNext(); return true; }
  if(d.stage==='wait2'&&brewDone()){ askNext(); return true; }
  return false; }
function askNext(){
  const d=S.draft, order=['wait','color','wait2','aroma','taste','free'], i=order.indexOf(d.stage);
  d.stage=order[Math.min(order.length-1,i+1)]; S.ask={hd:null,sel:[]}; d.talkPending=null;
  if(d.stage==='wait2'){ if(brewDone()) d.stage='aroma'; else { d.chat.push({who:'bot',text:'좋아요. 다 우려지면 향과 맛을 함께 볼게요.\n찻물 색이 조금씩 변하는 것도 지켜봐요.',wait:true}); talkNext(2200); return; } }
  if(LIVE.on){ if(d.stage==='color'&&d.type&&TC_GUESS[d.type]) S.ask.hd=[...TC_GUESS[d.type]];   // 실시간 음성: 앱이 할 말은 Live 모델에게 알리고, 모델이 말로 전한다
    liveEvent({color:'찻물에 색이 우러나기 시작했어요. 찻물 색을 보자고 권해 주세요.',aroma:'차가 다 우러났어요. 다 됐다고 알리고 향을 맡아보자고 권해 주세요.',taste:'이제 한 모금 마셔보고 맛을 말해 달라고 권해 주세요.',free:'이제 천천히 마시며 편하게 이야기해요. 다 마시면 말해 달라고 알려 주세요.'}[d.stage]||'다음 단계로 이어가 주세요.'); paintMsgs(); return; }
  if(flowOn(d)&&(d.stage==='color'||d.stage==='aroma')){ const st=d.stage; if(st==='color'&&d.type&&TC_GUESS[d.type]) S.ask.hd=[...TC_GUESS[d.type]];
    flowEvent(st==='color'?'color_ready':'brew_done').then(ok=>{ if(!ok&&S.draft===d&&d.stage===st){ paintBadge(); askMsg(d); paintMsgs(); } }); return; }
  askMsg(d); }
function askMsg(d){   // 정해진 질문 (AI가 안 될 때)
  if(d.stage==='free'){ d.chat.push({who:'bot',text:FREE_INTRO}); }
  else if(d.stage==='color'&&d.type&&TC_GUESS[d.type]){ S.ask.hd=S.ask.hd||[...TC_GUESS[d.type]]; S.ask.hd=[...TC_GUESS[d.type]]; const t=d.type==='other'?'이 차':TEAS[d.type].label;
    d.chat.push({who:'bot',text:VOICE.on?`${d.direct?'':'찻물에 색이 우러나기 시작했어요.\n'}지금 찻물 색은 어떤가요? 보이는 색을 말로 알려주세요.`:`${d.direct?'먼저 찻물 색부터 볼까요?':brewDone()?'다 우러났어요. 찻물 색부터 볼까요?':'찻물에 색이 우러나기 시작했어요.'}\n${t}${josa(t,'은','는')} 보통 이런 색이에요. 비슷하면 그대로 보내고, 다르면 움직여서 맞춰주세요.`,ask:'color'}); }
  else { let q=ASK_VAR[d.stage]?pick(ASK_VAR[d.stage],(d.tid||1)+d.stage.length):ASK[d.stage]; if(d.direct) q=q.replace(/^(다 우려졌어요|차가 다 우려졌어요)\.\s*/,''); d.chat.push({who:'bot',text:q,ask:d.stage}); }
}
const isAsk=st=>st==='color'||st==='aroma'||st==='taste';
function answer(k,text,extra={},legacy){
  const d=S.draft; if(S.typing) return;
  if(!legacy&&flowOn(d)&&isAsk(k)&&d.stage===k) return flowMsg(text,{k,extra});
  d.feel[k]=text; d.chat.push({who:'me',text,ans:k,...extra}); d.lastMeAt=Date.now();
  S.typing=true; paintMsgs();
  const next=()=>{ S.typing=false; askNext(); if(cur()==='chat'&&S.chatMode==='chat') paintMsgs(); };
  if(!chatAIOn()||text==='잘 모르겠어요') return setTimeout(next,650);
  const at=d.tid, t0=Date.now();   // AI가 내 대답에 한마디 반응하고 → 다음 질문
  aiChat('answered:'+k,text).then(a=>setTimeout(()=>{ if(!S.draft||S.draft.tid!==at){ S.typing=false; return; } if(a) d.chat.push({who:'bot',text:a.reply,ai:true}); next(); },Math.max(0,450-(Date.now()-t0))));
}
function answerColor(t){ const d=S.draft, a=S.ask||{};
  if(t){ d.feel.colorHD=null; d.feel.colorHex=null; return answer('color',t); }
  if(!a.hd) return; const c=tcColor(a.hd[0],a.hd[1]); d.feel.colorHD=a.hd; d.feel.colorHex=c; answer('color',tcName(a.hd[0],a.hd[1]),{color:c}); }
/* 자유롭게 말하는 게 기본. 모르겠을 때만 보기를 꺼내준다 */
function showOpts(k,said){ const d=S.draft; if(S.typing) return; d.chat.push({who:'me',text:said||'잘 모르겠어요',ans:'skip'});
  S.typing=true; paintMsgs(); setTimeout(()=>{ S.typing=false; S.ask={hd:null,sel:[]}; d.chat.push({who:'bot',text:VOICE.on?`괜찮아요. 이 중에 가까운 게 있을까요?\n${FEEL[k].opts.slice(0,6).join(', ')}… 떠오르는 걸 말해주세요.`:`괜찮아요. 이 중에 가까운 ${k==='aroma'?'향':'맛'}이 있나요?\n여러 개 골라도 돼요.`,ask:k,opts:true}); paintMsgs(); },500); }
function answerMulti(k,o){ const a=S.ask||(S.ask={sel:[]});
  if(o==='잘 모르겠어요') return answer(k,o);
  if(o==='__send'){ if(a.sel.length) answer(k,a.sel.join(', ')); return; }
  const i=a.sel.indexOf(o); i<0?a.sel.push(o):a.sel.splice(i,1); paintMsgs(); }
/* 질문 아래 대답 도구: 색은 슬라이드 두 개, 향·맛은 여러 개 고르는 칩 */
function askWidget(st){
  const a=S.ask||(S.ask={hd:null,sel:[]});
  if(st==='color'){ const hd=a.hd||[.33,.4], on=!!a.hd, c=tcColor(hd[0],hd[1]);
    return `<div class="askw tc ${on?'on':''}" id="askW"><div class="tc-cup"><i style="background:${on?c:'transparent'}"></i><div><b>${on?L(tcName(hd[0],hd[1])):L('끌어서 골라주세요')}</b><span>${L(L('고른 찻물 색'))}</span></div></div>
      <div class="tc-lab">${L(L('색 계열'))}</div><div class="tc-track" id="tcH" style="background:linear-gradient(90deg,${TC_FAM.map(x=>x[1]).join(',')})"><i style="left:${hd[0]*100}%;background:${tcBase(hd[0])}"></i></div>
      <div class="tc-lab">${L(L('진하기'))}</div><div class="tc-track" id="tcD" style="background:linear-gradient(90deg,${tcColor(hd[0],0)},${tcColor(hd[0],.5)},${tcColor(hd[0],1)})"><i style="left:${hd[1]*100}%;background:${c}"></i></div>
      <div class="tc-tl"><span>${L(L('맑게'))}</span><span>${L(L('진하게'))}</span></div>
      <div class="askrow">${(AI_ENDPOINT&&aiChatPref())||LIVE.on?'<span></span>':`<button class="chip" onclick="answerColor('잘 모르겠어요')">${L('잘 모르겠어요')}</button>`}<button class="feelnext" id="askSend" onclick="answerColor()" ${on?'':'hidden'}>${L(L('이 색으로 보내기 →'))}</button></div></div>`; }
  const f=FEEL[st], last=[...S.draft.chat].reverse().find(m=>m.ask===st)||{};
  if(!last.opts) return (AI_ENDPOINT&&aiChatPref())||LIVE.on?'':`<div class="chips"><button class="chip" onclick="showOpts('${st}')">${L('잘 모르겠어요')}</button></div>`;   /* AI 대화에선 '잘 모르겠어요' 버튼 없이 AI가 말로 도와준다 */
  return `<div class="askw" id="askW"><div class="chips">${f.opts.map(o=>`<button class="chip ${a.sel.includes(o)?'sel':''}" onclick="answerMulti('${st}','${o}')">${L(o)}</button>`).join('')}</div>
    <div class="askrow"><span class="askhint">${a.sel.length?L(a.sel.length+'개 골랐어요'):L('떠오르면 직접 적어도 돼요')}</span><button class="feelnext" onclick="answerMulti('${st}','__send')" ${a.sel.length?'':'hidden'}>${L(L('보내기 →'))}</button></div></div>`;
}
function bindAskColor(){
  const box=$('#askW'); if(!box||!box.querySelector('#tcH')) return; const a=S.ask;
  const paint=()=>{ const [h,v]=a.hd, c=tcColor(h,v); box.classList.add('on');
    box.querySelector('.tc-cup i').style.background=c; box.querySelector('.tc-cup b').textContent=L(tcName(h,v));
    const x=box.querySelector('#tcH i'), y=box.querySelector('#tcD i'); x.style.left=h*100+'%'; x.style.background=tcBase(h); y.style.left=v*100+'%'; y.style.background=c;
    box.querySelector('#tcD').style.background=`linear-gradient(90deg,${tcColor(h,0)},${tcColor(h,.5)},${tcColor(h,1)})`; box.querySelector('#askSend').hidden=false; };
  [['#tcH',0],['#tcD',1]].forEach(([sel,ix])=>{ const tr=box.querySelector(sel);
    const mv=e=>{ const r=tr.getBoundingClientRect(), t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)); a.hd=a.hd?[...a.hd]:[.33,.4]; a.hd[ix]=+t.toFixed(3); paint(); };
    tr.addEventListener('pointerdown',e=>{ tr.setPointerCapture(e.pointerId); mv(e); tr.onpointermove=mv; });
    tr.addEventListener('pointerup',()=>{ tr.onpointermove=null; }); });
}

const enTime=t=>String(t).replace(/분/g,' min').replace(/초/g,' s');
const isEN=()=>PREF.lang==='en';
function L(t){ if(!isEN()||t==null) return t; t=String(t); if(EN[t]) return EN[t]; if(EN_TYPE_LABEL[t]) return EN_TYPE_LABEL[t]; if(EN_COLOR[t]) return EN_COLOR[t];
  for(const [re,f] of EN_RE){ const m=t.match(re); if(m) return f(...m); } return t.replace(/(\d+(?:\s*–\s*\d+)?)분/g,'$1 min'); }

function ab2b64(buf){ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
async function startLive(){

    const code="class P extends AudioWorkletProcessor{constructor(){super();this.r=sampleRate/16000;this.a=0;this.b=[];}process(i){const c=i[0]&&i[0][0];if(c){for(let k=0;k<c.length;k++){this.a+=1;if(this.a>=this.r){this.a-=this.r;this.b.push(c[k]);}}if(this.b.length>=1600){const o=new Int16Array(this.b.length);let q=0;for(let k=0;k<o.length;k++){const v=Math.max(-1,Math.min(1,this.b[k]));q+=v*v;o[k]=v*32767;}this.port.postMessage({b:o.buffer,r:Math.sqrt(q/o.length)},[o.buffer]);this.b=[];}}return true;}}registerProcessor('tc-mic',P);";

    LIVE.ctx.tcMic=true;   /* 같은 소리 장치에 'tc-mic'를 두 번 등록하지 않게 */

function liveConnect(first){ return new Promise(res=>{ let ws, done=false; const fin=v=>{ if(!done){ done=true; clearTimeout(t); if(!v&&ws){ ws.onclose=null; try{ ws.close(); }catch(e){} if(LIVE.ws===ws) LIVE.ws=null; } res(v); } };   // 연결 실패면 이 연결은 조용히 닫는다(다시 잇기 안 함)

  ws.onmessage=e=>{ let j; try{ j=JSON.parse(typeof e.data==='string'?e.data:''); }catch(_){ return; } if(!j) return;
    if(j.setupComplete&&!done){ LIVE.on=true; fin(true); if(first) try{ LIVE.ws.send(JSON.stringify({clientContent:{turns:[{role:'user',parts:[{text:appMemoryText()}]}],turnComplete:false}})); }catch(e){}   /* 처음 연결될 때 지난 기록을 조용히 알려준다 (대답은 하지 않음) */ if(first){ LIVE.capOff=false; liveCaptionStart(); } VOICE.phase='listening'; S.listening=true; paintVoice(); paintBadge();

           : `내 표현과 전문가 설명 모두 ${a}의 인상을 담고 있어요.`+(b?` 여기에 ‘${esc(b)}’처럼 나만의 표현이 더해졌어요.`:' 내 감각이 설명과 같은 쪽을 짚었어요.'); }
function myExpression(d){
  if(d.mine) return d.mine;   // AI가 정리한 게 있으면 그걸로
  const rec=['aroma','taste'].map(k=>d.feel&&d.feel[k]).concat(d.afterText).filter(v=>v&&!NOT_ANSWER.test(String(v)));   // 기록된 향·맛·여운이 먼저
  const said=d.aiFlow?[]:(d.chat||[]).filter(m=>m.who==='me'&&(!m.ans||['aroma','taste'].includes(m.ans))&&!isQuestion(m.text||'')).map(m=>m.text);   // AI 대화는 Gemini가 정리해 둔 칸만 쓴다 (질문·고치기 전 표현·'정정할게요' 같은 원문은 빼고)
  const mine=[...new Set(rec.concat(said).map(t=>unfill(String(t).replace(/[.!?]+$/,''))))].filter(t=>t.length>=2&&t!=='잘 모르겠어요');
  if(mine.length) return mine.slice(0,6).map(x=>isEN()?(EN[x]||x):x).join(', ') + '.';
  const f=['aroma','taste'].map(k=>(d.feel||{})[k]).filter(v=>typeof v==='string'&&v&&v!=='잘 모르겠어요');
  if(f.length) return `${f.join(', ')}${josa(f[f.length-1],'이','가')} 먼저 느껴졌어요.`;
  return '이번에는 남긴 표현이 없어요.';
}

function bindPick(cv,d=S.draft,drop=draftDrop(d),skip=null,drag=false){
  const others=recsAsc().filter(r=>r.id!==skip), ctx=cv.getContext('2d'), bg=document.createElement('canvas');
  const px=pxFor(cv.clientWidth); cv.width=cv.height=bg.width=bg.height=px;
  const b=bg.getContext('2d'); b.fillStyle=CANVAS_BG; b.fillRect(0,0,px,px); axes(b,px);
  others.forEach(r=>drawRec1(b,recFlav(r),r.canvas.x*px,r.canvas.y*px,R1(px),r.id,CV_SPREAD,.12));   // 이전 방울은 아주 옅게
  const L=dropFlav(drop), sid=dropSid(drop);
  let prog=1, holding=false, raf=0, t0=0, last=0;
  const frame=()=>{ ctx.drawImage(bg,0,0); if(d.canvas){ const cx=d.canvas.x*px, cy=d.canvas.y*px, R=R1(px); drawRec1(ctx,L,cx,cy,R,sid,prog*(CV_SPREAD+1.4),.95);
    /* 방금 찍은 방울: 점선 고리로 강조 */ ctx.save(); ctx.globalAlpha=Math.min(1,prog*2); ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=Math.max(1.5,px/260); ctx.setLineDash([px/80,px/100]); ctx.beginPath(); ctx.arc(cx,cy,R*(1.15+.15*(1-prog)),0,Math.PI*2); ctx.stroke(); ctx.restore(); } };
  const loop=now=>{
    if(!cv.isConnected){ raf=0; return; }
    last=now; prog=Math.min(1,(now-t0)/1500); frame();
    if(holding||prog<1) raf=requestAnimationFrame(loop); else { raf=0; }
  };
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:clamp((e.clientX-r.left)/r.width),y:clamp((e.clientY-r.top)/r.height)}; };
  frame();
  // 톡 누르면 그 자리에 찍힌다(다시 누르면 새 자리로). 끌면 화면이 스크롤될 뿐 방울이 따라오지 않는다
  if(drag){   // 위치 옮기기: 누른 채 끌면 방울이 따라온다
    cv.onpointerdown=e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); holding=true; d.canvas={...pos(e),i:d.canvas?d.canvas.i:.6}; if(!raf) raf=requestAnimationFrame(loop); };
    cv.onpointermove=e=>{ if(holding){ Object.assign(d.canvas,pos(e)); } };
    const up=()=>{ if(!holding) return; holding=false; const c=$('#pickCap'); if(c) c.textContent=posText(d.canvas); }; cv.onpointerup=up; cv.onpointercancel=up; return; }
  let down=null; cv.onpointerdown=e=>{ down={x:e.clientX,y:e.clientY}; };
  cv.onpointerup=e=>{ if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>10){ down=null; return; } down=null;
    d.canvas={...pos(e),i:.6}; t0=last=performance.now(); prog=0; if(!raf) raf=requestAnimationFrame(loop); { const sb=$('#saveBtn'); if(sb) sb.classList.remove('off'); } const c=$('#pickCap'); if(c) c.textContent=posText(d.canvas); };
  cv.onpointercancel=()=>{ down=null; };
}

g image preview","개완으로 우려요":"Brew gongfu-style","머그컵으로 우려요":"Brew in a mug","개완으로 짧게 여러 번 우리는 방법이에요.\n한 번 우릴 때마다 맛을 보고 기록해봐요.":"Gongfu style: short, repeated infusions.\nTaste and note each one.","15 – 25초":"15 – 25 sec","찻잎 5 – 7g (개완 100ml)":"5 – 7 g leaves (100 ml gaiwan)","첫 물은 찻잎을 깨우듯 헹궈 버려주세요":"Rinse the leaves with the first pour","우릴 때마다 5 – 10초씩 늘려가요.":"Add 5 – 10 sec each infusion.","같은 잎으로 다섯 번 넘게 우려도 좋아요. 우림마다 달라지는 향을 비교해보세요.":"The same leaves can go five rounds or more. Compare how the aroma changes.","이런 식으로 말해도 좋아요.\n누르면 입력칸에 들어가요. 내 느낌에 맞게 고쳐 보내세요.":"You could say things like these.\nTap one to put it in the box, then tweak it to fit.","비 온 뒤 숲길 같아요":"Like a forest path after rain","구운 빵처럼 고소해요":"Nutty like toasted bread","끝에 꿀 같은 단맛이 남아요":"A honey-like sweetness at the end","혀가 살짝 조이는 느낌이에요":"My tongue tightens a little","입안이 시원하게 맑아져요":"It feels cool and clean","베르가못의 상큼한 시트러스 향이 먼저 올라오고, 홍차의 달큰함과 은은한 꽃향이 뒤를 받쳐주는 차예요.":"Zesty bergamot citrus comes first, backed by black tea's mellow sweetness and a soft floral note.","청포도를 닮은 머스캣 향과 가벼운 꽃향이 산뜻하게 퍼지고, 맑고 가볍게 마무리되는 홍차예요.":"A muscat-grape aroma and light florals spread brightly, finishing clean and light.","몰트처럼 진하고 고소한 향에 묵직한 바디감, 기분 좋은 떫은맛이 이어지는 홍차예요.":"Rich, malty and nutty with a full body and a pleasant astringency.","난꽃을 닮은 맑은 꽃향에 크리미하고 매끄러운 질감, 삼킨 뒤 단맛이 길게 도는 우롱차예요.":"A clear orchid-like floral aroma, creamy smooth texture, and a long sweet finish.","꿀과 잘 익은 복숭아를 닮은 달콤한 향, 부드러운 과일 단맛이 오래 남는 우롱차예요.":"Sweet notes of honey and ripe peach, with a soft fruity sweetness that lingers.","볶은 현미의 구수함과 녹차의 산뜻한 풀향이 어우러진, 순하고 편안한 차예요.":"Toasty roasted rice meets fresh green-tea grassiness — mild and comforting.","사과를 닮은 달콤한 꽃향에 부드럽고 포근한 맛이 이어지는 허브차예요.":"A sweet, apple-like floral aroma with a soft, cozy taste.","입안이 시원해지는 청량한 민트 향에 깔끔한 끝맛이 남는 허브차예요.":"Cooling, crisp mint with a clean finish.","드래그해서 돌려보세요":"Drag to rotate",

function trNode(n){ const v=n.nodeValue; if(!v||!/[가-힣]/.test(v)) return; const t=v.trim(), o=L(t); if(o&&o!==t) n.nodeValue=v.replace(t,o); }
function trAttr(e){ ['placeholder','aria-label','title','alt'].forEach(a=>{ const v=e.getAttribute&&e.getAttribute(a); if(v&&/[가-힣]/.test(v)){ const o=L(v.trim()); if(o!==v.trim()) e.setAttribute(a,o); } }); }
function trTree(root){ if(!root) return; if(root.nodeType===3) return trNode(root); if(root.nodeType!==1||root.closest('script,style')) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; while(n=w.nextNode()) trNode(n); trAttr(root); root.querySelectorAll('[placeholder],[aria-label],[title],[alt]').forEach(trAttr); }

  document.readyState==='loading'?addEventListener('DOMContentLoaded',start):start(); }

function openCamera(cb){ if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)) return pickFile(cb,true);
  const w=document.createElement('div'); w.className='camview';
  w.innerHTML=`<video playsinline autoplay muted></video><p class="cam-tip">${L('차 포장의 글자가 잘 보이게 찍어 주세요')}</p><div class="cambar"><button class="cam-x">${L('취소')}</button><button class="cam-shot" aria-label="${L('찍기')}"></button><button class="cam-alb">${L('앨범')}</button></div>`;
  $('#sheetWrap').parentNode.appendChild(w); const v=w.querySelector('video'); let stream=null, gone=false;
  const close=()=>{ gone=true; try{ stream&&stream.getTracks().forEach(t=>t.stop()); }catch(e){} w.remove(); };
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:1280}},audio:false})
    .then(st=>{ if(gone){ st.getTracks().forEach(t=>t.stop()); return; } stream=st; v.srcObject=st; v.play&&v.play().catch(()=>{}); })
    .catch(()=>{ if(gone) return; close(); toast('카메라를 열 수 없어 휴대폰 카메라로 찍을게요'); pickFile(cb,true); });
  w.querySelector('.cam-x').onclick=close; w.querySelector('.cam-alb').onclick=()=>{ close(); pickFile(cb,false); };
  w.querySelector('.cam-shot').onclick=()=>{ if(!v.videoWidth) return; const k=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight)), c=document.createElement('canvas'); c.width=Math.round(v.videoWidth*k); c.height=Math.round(v.videoHeight*k);
    c.getContext('2d').drawImage(v,0,0,c.width,c.height); let u=''; try{ u=c.toDataURL('image/jpeg',.82); }catch(e){} close(); if(u) cb(u); else toast('사진을 찍지 못했어요'); }; }

function pickFile(cb,camera){ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; if(camera) i.setAttribute('capture','environment'); i.style.display='none';
  i.onchange=()=>{ const f=i.files&&i.files[0]; i.remove(); if(!f) return; const rd=new FileReader();

      x.globalAlpha=C.aw*lf*.9; x.drawImage(cvWash(240,k,c,601+j*31).frame(.6+(CV_SPREAD-.6)*lf),px-D/2,py-D/2,D,D); }
    x.globalAlpha=1; };
  const loop=now=>{ if(!cv.isConnected){ raf=0; return; }
    if(fill){ f=Math.min(1,(now-fill)/FILL); paint(); if(f>=1){ raf=0;
        if(HS.demo){ setTimeout(()=>{ if(!cv.isConnected) return; fill=0; f=0; u=0; home.classList.remove('holding'); paint(); setTimeout(()=>{ if(!cv.isConnected) return; holding=true; t0=performance.now(); home.classList.add('holding'); raf=requestAnimationFrame(loop); },900); },1600); return; }
        setTimeout(()=>{ if(cur()==='home') startRecord(); },450); return; } raf=requestAnimationFrame(loop); return; }
    u=holding?Math.min(1,(now-t0)/HOLD):Math.max(0,u-.03); paint();
    if(holding&&u>=1){ holding=false; fill=now; }
    raf=(holding||u>0||fill)?requestAnimationFrame(loop):0; };
  cv._frame=v=>{ u=v; paint(); };   /* 시안·점검용: 번짐 단계(0~1)를 바로 그려 본다 */
  if(HS.demo) setTimeout(()=>{ if(!cv.isConnected) return; holding=true; t0=performance.now(); home.classList.add('holding'); if(!raf) raf=requestAnimationFrame(loop); },700);
  const say=$('#hpSay');
  spot.onpointerdown=e=>{ if(fill) return; e.preventDefault(); try{ spot.setPointerCapture(e.pointerId); }catch(_){} holding=true; t0=performance.now()-u*HOLD; home.classList.add('holding'); if(say) say.textContent=L('그대로 누르고 있어요…'); if(!raf) raf=requestAnimationFrame(loop); };
  const up=()=>{ if(!holding) return; holding=false; home.classList.remove('holding'); if(say) say.textContent=L('조금 더 꾹 눌러주세요'); if(!raf) raf=requestAnimationFrame(loop); };
  spot.onpointerup=up; spot.onpointercancel=up; spot.onpointerleave=up; spot.oncontextmenu=e=>e.preventDefault();
  spot.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); startRecord(); } };
  /* 물감 줄: 양옆에 더 있으면 옅은 그림자 */
  const pal=$('#hpPal'), pw=$('#hpPalW'), edge=()=>{ if(!pal||!pw) return; pw.classList.toggle('at-start',pal.scrollLeft<4); pw.classList.toggle('at-end',pal.scrollLeft+pal.clientWidth>=pal.scrollWidth-4); };
  if(pal){ pal.onscroll=edge; const on=pal.querySelector('.on'); if(on&&on.offsetLeft>pal.clientWidth*.6) pal.scrollLeft=on.offsetLeft-pal.clientWidth/2+on.offsetWidth/2; edge(); }
  paint(); }
function mountHomeDrop(el){
  if(!el) return;
  if(startHome3D(el)) return;
  const k=ORDER[Math.floor(Math.random()*6)], f=FKEYS[Math.floor(Math.random()*FKEYS.length)];
  el.innerHTML=orb({id:'home-'+k+f,comps:[{key:'tea',c:TEAS[k].color,w:.7},{key:f,c:FLAVORS[f].color,w:.5}]},230,'breath');
}

/* sheet */
function openSheet(html){ $('#sheet').innerHTML=html; $('#sheetWrap').classList.add('open'); fitIn($('#sheet')); paintDrops($('#sheet')); }
/* 폰 높이에 맞추기: 화면이 넘치면 data-fit="최대,최소,모양" 요소(찻방울·캔버스)를 넘친 만큼 줄여 스크롤 없이 한 화면에 */
function fitIn(box,grow=true){ if(!box) return; const els=[...box.querySelectorAll('[data-fit]')]; if(!els.length) return;
  const set=(e,v)=>{ const [,,m='sq']=e.dataset.fit.split(','); if(m!=='h') e.style.width=v+'px'; if(m!=='w') e.style.height=v+'px'; };
  if(grow) els.forEach(e=>set(e,+e.dataset.fit.split(',')[0]));
  els.forEach(e=>{ const over=box.scrollHeight-box.clientHeight; if(over<=0) return; const [,mn]=e.dataset.fit.split(',').map(Number), now=e.dataset.fit.endsWith(',h')?e.offsetHeight:e.offsetWidth; set(e,Math.max(mn,Math.floor(now-over)));  }); }
function fitScreen(){ fitIn($('#view')); if($('#sheetWrap').classList.contains('open')) fitIn($('#sheet')); }
addEventListener('resize',()=>{ clearTimeout(fitScreen.t); fitScreen.t=setTimeout(fitScreen,120); });
function closeSheet(){ stopPreview(); $('#sheetWrap').classList.remove('open'); const sh=$('#sheet'); if(sh){ sh.style.transform=''; sh.style.transition=''; } }
/* 시트 위쪽(손잡이)을 잡고 끌어내리면 닫힌다 */
(function(){ let y0=null, dy=0, t0=0; const sh=()=>$('#sheet');
  addEventListener('pointerdown',e=>{ const el=sh(); if(!el||!$('#sheetWrap').classList.contains('open')||!el.contains(e.target)) return;
    const top=el.getBoundingClientRect().top; if(!(e.target.closest('.grab')||(el.scrollTop<=0&&e.clientY-top<56))) return;
    if(e.target.closest('button,input,select,textarea,canvas')) return;
    y0=e.clientY; dy=0; t0=Date.now(); el.style.transition='none'; },true);
  addEventListener('pointermove',e=>{ if(y0===null) return; dy=Math.max(0,e.clientY-y0); const el=sh(); if(el) el.style.transform=`translateY(${dy}px)`; if(dy>4) e.preventDefault(); },{passive:false,capture:true});
  const end=()=>{ if(y0===null) return; const el=sh(), fast=dy>30&&dy/(Date.now()-t0+1)>.5; y0=null; if(!el) return;
    el.style.transition='transform .22s ease';
    if(dy>90||fast){ el.style.transform='translateY(100%)'; setTimeout(()=>closeSheet(),200); } else el.style.transform=''; };
  addEventListener('pointerup',end,true); addEventListener('pointercancel',end,true);
})();

/* error */
let lastErrToast=0; addEventListener('error',()=>{ if(Date.now()-lastErrToast>5000){ lastErrToast=Date.now(); try{ toast('잠시 문제가 생겼어요. 다시 시도해 주세요'); }catch(e){} } });
function retryError(){ if(S.stack.length>1){ S.stack.pop(); NAV_DIR='back'; render(); } else goTab('home'); }

function resetAll(){ savePaused(null);
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  S.records=seedRecords(); persist(); S.draft=null; S.timer=null; S.forceEmpty=false; S.lastSaved=null;
  S.filter={q:'',date:'all',fl:[]};
  $('#optEmpty').checked=false; goTab('home'); toast('처음 상태로 되돌렸어요');
}

/* =========================================================
   DEV PANEL — jump list
   ========================================================= */
const JUMPS = [
  ['홈','home'],['기록(채팅)','chat'],['정리 중','organizing'],['기록 부족','thin'],['찻방울 완성','analyzing'],['설명과 비교','compare'],
  ['캔버스에 찍기','@canvas'],['기록 완료','@done'],['전체 대화','@fullChat'],['Tea Tag','@teaTag'],
  ['캔버스','@cv'],['기록 목록','@list'],['상세 기록','@detail'],['My','my'],['알림','noti'],['오류','error'],
];
$('#jump').innerHTML = JUMPS.map(([l],i)=>`<button onclick="jump(${i})">${l}</button>`).join('');
function jump(i){
  const k=JUMPS[i][1]; closeSheet();
  if(k==='home'||k==='my'){ goTab(k); return; }
  if(k==='@cv'||k==='@list'){ go('canvas',{tab:k==='@cv'?'canvas':'list'},{reset:true}); return; }
  if(k==='noti'||k==='error'){ go(k,{},{reset:true}); return; }
  if(k==='@detail'){ sortRecs(); openDetail(S.records[0].id); return; }
  if(k==='@done'||k==='@fullChat'||k==='@teaTag'){
    if(!S.lastSaved){ S.draft=null; ensureDraft(); demoFill(); S.draft.canvas={x:.7,y:.3,i:.8}; S.draft.stars=2; S.draft.comment='집에서 혼자 마셔본 첫 허브차!'; saveRecord(); }
    else { S.stack=[{name:'home',params:{}}]; go('done'); }
    if(k!=='@done') go(k.slice(1));
    return;
  }
  ensureDraft();
  if(['analyzing','compare','@canvas'].includes(k)) demoFill();
  if(k==='@canvas'){ S.stack=[{name:'home',params:{}}]; go('compare'); openCanvasSheet(); return; }
  if(k==='chat') S.chatMode='chat';
  S.stack=[{name:'home',params:{}}]; go(k);
}
function demoFill(){
  const d=S.draft; d.flavors=null; if(d.chat.length) return;
  d.feel={color:'보랏빛',aroma:'풀향',taste:'부드러움'};
  d.chat=[{who:'bot',text:'오늘 차는 어땠나요?'},{who:'me',text:'풀 향이 먼저 났어요.'},{who:'bot',text:'입안에서는 어떤 느낌이 남았나요?'},
    {who:'me',text:'따뜻하고 둥글게 퍼졌어요.'},{who:'bot',text:'좋아요.\n따뜻하고 둥근 풀 향으로 남겨둘게요.'},{who:'me',text:'식으니까 고소한 향도 느껴져요.'},
    {who:'bot',text:'그 여운은 어떤 느낌인가요?'},{who:'me',text:'볶은 곡물처럼 고소하고 편안해요.'},{who:'bot',text:'고소하고 포근한 여운도 함께 적어둘게요.\n다음에 마실 때 오늘의 느낌과 비교해봐요.'}];
  d.picked=['고소한 여운'];
}

/* =========================================================
   EXHIBITION — 폰 프레임 크기 맞춤 · 유휴 복귀 · 숨은 단축키
   ========================================================= */
function fitPhone(){
  const wrap=$('#phoneWrap'), p=$('#phone'), st=$('#stage');
  if(document.documentElement.classList.contains('mob')){ SCALE=1; wrap.style.width=wrap.style.height=''; p.style.transform=''; return; }
  // 세로 모니터(1080×1920) 기준: 위·아래 안내 영역을 화면 높이에 비례해 잡고, 남는 높이에 폰을 맞춘다
  const H=innerHeight, W=innerWidth;
  st.style.setProperty('--logo',Math.max(22,Math.min(44,H*.022))+'px');
  st.style.setProperty('--ex-line-size',Math.max(14,Math.min(24,H*.012))+'px');
  st.style.setProperty('--hint',Math.max(13,Math.min(20,H*.0105))+'px');
  st.style.setProperty('--gap',Math.max(18,Math.min(56,H*.028))+'px');
  const top=$('.ex-top'), chrome=(top?top.offsetHeight:0)+$('.ex-bottom').offsetHeight+parseFloat(getComputedStyle(st).getPropertyValue('--gap'))*2+48+18;
  SCALE=Math.max(.5,Math.min(4,(H-chrome)/852,(W-48)/393));   // 큰 화면(스탠바이미 2 Max 4K 등)에서도 화면 높이에 맞게 키운다
  wrap.style.width=393*SCALE+'px'; wrap.style.height=852*SCALE+'px';
  p.style.transform=`scale(${SCALE})`;
}
addEventListener('resize',fitPhone); fitPhone();

/* 1분 30초 동안 입력이 없으면 기록은 그대로 두고 홈으로만 돌아간다 */
const IDLE_MS=90000; let lastInput=Date.now();   /* 기록 중에는 90초 뒤 '이어하기'로 저장해두고 홈으로 */
['pointerdown','pointermove','keydown','wheel','input'].forEach(ev=>addEventListener(ev,()=>{ lastInput=Date.now(); },{passive:true,capture:true}));
setInterval(()=>{
  if(Date.now()-lastInput<IDLE_MS) return;
  lastInput=Date.now();
  const atHome=cur()==='home' && !$('#sheetWrap').classList.contains('open');
  if(atHome && !S.draft) return;
  if(S.draft&&(VOICE.on||(S.timer&&S.timer.left>0&&S.timer.running))) return;   // 우리는 중 · 음성 대화 중에는 그대로
  if(recording()){ S.quitTo='home'; const said=S.draft&&S.draft.chat.some(m=>m.who==='me'); quitRecord(said,!said); return; }             // 작성 중인 기록은 이어하기로 남긴다
  closeSheet(); stopTimer(); S.draft=null; S.listening=false; goTab('home',true);
},5000);

/* 팀원용 숨은 단축키: Ctrl+Alt+D 도구 패널 · Ctrl+Alt+Shift+0 기록 초기화 */
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&dismissOverlay()){ e.preventDefault(); return; }   // Esc로 메뉴·시트 닫기
  if(!(e.ctrlKey&&e.altKey)) return;
  if(e.code==='KeyD' && !e.shiftKey){ e.preventDefault(); $('#dev').classList.toggle('show'); }
  if(e.code==='Digit0' && e.shiftKey){ e.preventDefault(); if(confirm('관람객 기록을 모두 지우고 예시 기록만 남길까요?')) resetAll(); }
});

/* boot */
try{ history.scrollRestoration='manual'; scrollTo(0,0); history.replaceState({tc:0},''); }catch(e){}
function dismissOverlay(){ const m=document.querySelector('.actmenu'); if(m){ m.remove(); return true; } if($('#sheetWrap').classList.contains('open')){ closeSheet(); return true; } return false; }
addEventListener('popstate',()=>{
  if(dismissOverlay()){ history.pushState({tc:S.stack.length},''); return; }
  if(cur()==='chat'&&recording()){ history.pushState({tc:S.stack.length},''); askQuit(); return; }
  NAV_DIR='back'; if(S.stack.length>1){ S.stack.pop(); render(); } else if(cur()!=='home') go('home',{},{reset:true}); });
go('home',{},{reset:true});
if(SG.demo) setTimeout(()=>{ try{ startRecord(true); const d=S.draft; d.chat.push({who:'me',text:'오설록 제주 세작'}); d.name='제주 세작'; d.brand='오설록'; d.type='green'; d.stage='aroma'; d.chat.push({who:'bot',text:'좋아요. 찻잔에 코를 가까이 대 볼까요?\n어떤 향이 나요?'}); paintMsgs(); }catch(e){ console.warn(e); } },300);
{ let re=null; try{ re=sessionStorage.getItem('tc.reopen'); sessionStorage.removeItem('tc.reopen'); }catch(e){} if(re==='app'){ goTab('my',true); openSettings('app'); } }   // 언어를 바꾼 뒤 설정 창으로 돌아오기
</script>
