<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>번짐 경계 진하기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#F4F4F4;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:1400px;margin:0 auto;padding:28px 16px 60px}h1{font-size:24px;margin:0 0 6px}p.sub{color:#737373;margin:0 0 22px;line-height:1.6;font-size:14px}
.grid{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
.card{width:236px}.frame{width:236px;height:511px;border-radius:26px;border:6px solid #111;overflow:hidden;background:#fff;position:relative}
.frame iframe{width:393px;height:852px;border:0;transform:scale(.57);transform-origin:0 0;position:absolute;left:0;top:0}
.card h2{font-size:16px;margin:12px 0 4px}.card p{font-size:13px;color:#555;margin:0;line-height:1.5}
.card .tag{display:inline-block;font-size:12px;font-weight:700;background:#111;color:#fff;border-radius:10px;padding:2px 8px;margin-right:6px}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.colors button{border:1px solid #DDD;background:#fff;border-radius:16px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.colors button.on{background:#111;color:#fff;border-color:#111}
</style></head><body><main>
<h1>첫 화면 · 번짐 경계 진하기</h1>
<p class="sub">크기와 모양은 같고(6번 잔물결 · 크기 1.0), 물이 멈춘 자리의 경계선 진하기만 달라요. 되풀이할 때마다 새 모양이 나와요. 직접 눌러 볼 수도 있어요.</p>
<div class="grid" id="grid"></div>
</main><script>
const V=[['지금','1.6','경계가 또렷'],['A','1.1','조금 연하게'],['B','.7','연하게'],['C','.4','아주 연하게'],['D','0','경계선 없이 옅게 사라짐']];
document.getElementById('grid').outerHTML=`<div class="grid">${V.map(([k,e,d])=>`<div class="card"><div class="frame"><iframe src="../TEA_CANVAS_prototype_v6.html?he=${e}&hc=floral&hsdemo=1" title="${k}"></iframe></div><h2><span class="tag">${k}</span></h2><p>${d}</p></div>`).join('')}</div>`;
</script></body></html>
