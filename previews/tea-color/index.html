<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>찻물 색 고르기 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,system-ui,sans-serif;background:#ECECEA;color:#111;padding:32px max(16px,env(safe-area-inset-right,0px)) 200px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1500px;margin:0 auto}
h1{font-size:24px;font-weight:800}
.lead{color:#737373;font-size:14px;margin-top:6px;max-width:860px;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;margin-top:20px;align-items:start}
.item{position:relative}
.item h2{font-size:15.5px}
.item p.d{font-size:12.5px;color:#737373;margin-top:3px;min-height:38px;line-height:1.5}
.star{position:absolute;right:0;top:-3px;font-size:24px;color:#BBB;background:none;border:0;cursor:pointer;line-height:1}
.star.on{color:#111}
.card{background:#fff;border-radius:22px;padding:18px 16px 18px;margin-top:8px}
.fc{background:#F3F3F3;border-radius:14px;padding:12px 14px 16px}
.fc .q{font-size:12.5px;color:#737373;margin-bottom:10px}
.fc .q b{color:#111;margin-right:6px}
.cup{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cup i{width:52px;height:52px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),inset 0 -6px 10px rgba(255,255,255,.35);transition:background .12s}
.cup b{font-size:16px}
.cup span{display:block;font-size:11.5px;color:#999;font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{height:31px;padding:0 13px;border-radius:16px;background:#ECECEC;font:inherit;font-size:13px;border:0;cursor:pointer}
.chip.sel{background:#000;color:#fff}
/* 슬라이더 공통 */
.track{position:relative;height:30px;border-radius:15px;touch-action:none;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.thumb{position:absolute;top:50%;width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);transform:translate(-50%,-50%);pointer-events:none}
.tl{display:flex;justify-content:space-between;font-size:11px;color:#999;margin-top:5px}
.sl2 .track{margin-top:4px}
.sl2 .lab{font-size:11.5px;color:#666;margin-top:12px;font-weight:600}
.svgw{display:block;margin:0 auto;touch-action:none;cursor:pointer}
.caro{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px calc(50% - 30px) 4px;scrollbar-width:none}
.caro::-webkit-scrollbar{display:none}
.caro button{flex:0 0 60px;height:60px;border-radius:50%;border:0;scroll-snap-align:center;cursor:pointer;transition:transform .2s,opacity .2s;opacity:.55;transform:scale(.8)}
.caro button.on{opacity:1;transform:scale(1)}
.caro-wrap{position:relative}
.caro-wrap:after{content:'';position:absolute;left:50%;top:0;width:68px;height:68px;transform:translateX(-50%);border-radius:50%;box-shadow:0 0 0 2px #111;pointer-events:none;top:2px}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 4px}
.sw button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:#555;background:none;border:0;cursor:pointer;font-family:inherit}
.sw i{width:36px;height:36px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw button.sel i{box-shadow:0 0 0 2px #fff,0 0 0 4px #111}
.pickbox{position:fixed;right:16px;bottom:16px;z-index:20;background:#111;color:#fff;border-radius:14px;padding:12px 14px;max-width:min(420px,calc(100vw - 32px));font-size:13px;display:flex;flex-direction:column;gap:8px}
.pickbox .pl{white-space:pre-wrap;color:#ddd}
.pickbox button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;background:#fff;color:#111}
.pickbox button:disabled{opacity:.5}
.pickbox textarea{width:100%;height:80px}
</style></head><body>
<div class="wrap"><h1>찻물 색 고르기 시안 6종</h1>
<p class="lead">'먼저 느껴보기'의 색 질문을 슬라이드·휠 형태로 바꿔봤어요. 각 상자에서 직접 끌거나 눌러보세요. 왼쪽 위 원이 고른 찻물 색이고, 옆에 가장 가까운 색 이름이 떠요. A는 지금 쓰고 있는 견본(비교용)이에요. ☆로 고르고 오른쪽 아래에서 복사해 붙여넣으세요.</p>
<div class="grid" id="grid"></div></div>
<script>
/* 찻물 색 길: 맑은 물빛 → 노랑 → 연두 → 금빛 → 호박 → 주황 → 적갈 → 진갈 → 흑갈 */
const PATH=[['맑은 물빛','#F3F0DF'],['연한 노랑','#F1E6B0'],['맑은 연두','#D6E4A4'],['진한 연두','#ADC678'],['황금빛','#EBC870'],['호박색','#DC9C46'],['붉은 주황','#CF7442'],['적갈색','#A4502F'],['진한 갈색','#6B3D2A'],['흑갈색','#3E2419']];
const HERB=[['보랏빛','#B9A6D6'],['분홍빛','#E9B6C2']];
/* 계열(휠·슬라이더 2개용): 진하기는 따로 */
const FAM=[['노랑','#E9CF5E'],['연두','#9DBF55'],['금빛','#E0AE3E'],['주황','#D9773A'],['붉은','#B5492E'],['갈색','#7A4630'],['보라','#9C82C9'],['분홍','#E08CA4']];
const hx=h=>{ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; };
const toH=c=>'#'+c.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>toH(hx(a).map((v,i)=>v+(hx(b)[i]-v)*t));
function along(list,t){ t=Math.max(0,Math.min(1,t)); const f=t*(list.length-1), i=Math.min(list.length-2,Math.floor(f)); return mix(list[i][1],list[i+1][1],f-i); }
const near=(list,t)=>list[Math.round(Math.max(0,Math.min(1,t))*(list.length-1))][0];
/* 진하기 0(맑게)~1(진하게): 흰빛 ↔ 원색 ↔ 짙게 */
const depth=(c,d)=>d<.5?mix('#FBF8EE',c,.25+d*1.5):mix(c,'#2A1A12',(d-.5)*.9);
const dword=d=>d<.3?'맑은 ':d<.6?'':d<.85?'진한 ':'아주 진한 ';
const LG=list=>`linear-gradient(90deg,${list.map(x=>x[1]).join(',')})`;
const cupHTML=`<div class="cup"><i></i><div><b>골라주세요</b><span>고른 찻물 색</span></div></div>`;
function setCup(el,c,name){ el.querySelector('.cup i').style.background=c||'transparent'; el.querySelector('.cup b').textContent=name||'골라주세요'; }
function drag(target,fn){ const h=e=>{ const r=target.getBoundingClientRect(); fn(e.clientX-r.left,e.clientY-r.top,r); };
  target.addEventListener('pointerdown',e=>{ target.setPointerCapture(e.pointerId); h(e); target.onpointermove=h; });
  target.addEventListener('pointerup',()=>target.onpointermove=null); }
const extra=`<div class="chips"><button class="chip" data-x="직접 쓰기">직접 쓰기</button><button class="chip" data-x="잘 모르겠어요">잘 모르겠어요</button></div>`;
function extraChips(el){ el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{ el.querySelectorAll('[data-x]').forEach(q=>q.classList.toggle('sel',q===b)); setCup(el,null,b.dataset.x); }); }
const V=[
 {k:'A',name:'견본 10개 (지금)',desc:'비교용. 지금 v5에 들어간 방식.',html:()=>`<div class="sw">${PATH.slice(1,9).concat(HERB).map(([n,c])=>`<button data-c="${c}" data-n="${n}"><i style="background:${c}"></i>${n}</button>`).join('')}</div>`,
  init(el){ el.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{ el.querySelectorAll('.sw button').forEach(q=>q.classList.toggle('sel',q===b)); setCup(el,b.dataset.c,b.dataset.n); }); }},
 {k:'B',name:'한 줄 슬라이드',desc:'맑은 물빛부터 흑갈색까지 찻물 색이 한 줄로 이어져요. 끌어서 고르고, 꽃차 색은 아래 칩으로.',
  html:()=>`<div class="track" style="background:${LG(PATH)}"><div class="thumb"></div></div><div class="tl"><span>맑게</span><span>진하게</span></div><div class="chips">${HERB.map(([n,c])=>`<button class="chip hb" data-c="${c}" data-n="${n}"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c};margin-right:5px"></span>${n}</button>`).join('')}</div>`,
  init(el){ const tr=el.querySelector('.track'), th=el.querySelector('.thumb'); const set=t=>{ th.style.left=t*100+'%'; th.style.background=along(PATH,t); setCup(el,along(PATH,t),near(PATH,t)); el.querySelectorAll('.hb').forEach(b=>b.classList.remove('sel')); };
    set(.35); drag(tr,(x,y,r)=>set(Math.max(0,Math.min(1,x/r.width))));
    el.querySelectorAll('.hb').forEach(b=>b.onclick=()=>{ el.querySelectorAll('.hb').forEach(q=>q.classList.toggle('sel',q===b)); setCup(el,b.dataset.c,b.dataset.n); }); }},
 {k:'C',name:'슬라이드 두 개 (색 계열 + 진하기)',desc:'위에서 색 계열을, 아래에서 맑게↔진하게를 따로 골라요. 이름도 "진한 주황"처럼 두 가지를 합쳐서 떠요.',
  html:()=>`<div class="sl2"><div class="lab">색 계열</div><div class="track t1" style="background:${LG(FAM)}"><div class="thumb"></div></div><div class="lab">진하기</div><div class="track t2"><div class="thumb"></div></div><div class="tl"><span>맑게</span><span>진하게</span></div></div>`,
  init(el){ let h=.35,d=.5; const t1=el.querySelector('.t1'), t2=el.querySelector('.t2'), a=t1.firstChild, b=t2.firstChild;
    const up=()=>{ const base=along(FAM,h), c=depth(base,d); a.style.left=h*100+'%'; a.style.background=base; b.style.left=d*100+'%'; b.style.background=c;
      t2.style.background=`linear-gradient(90deg,${depth(base,0)},${depth(base,.5)},${depth(base,1)})`; setCup(el,c,dword(d)+near(FAM,h)); };
    up(); drag(t1,(x,y,r)=>{ h=Math.max(0,Math.min(1,x/r.width)); up(); }); drag(t2,(x,y,r)=>{ d=Math.max(0,Math.min(1,x/r.width)); up(); }); }},
 {k:'D',name:'반원 휠 (부채꼴)',desc:'찻물 색이 부채꼴로 펼쳐져요. 원 둘레를 따라 돌리듯 끌어서 골라요. 엄지로 쓰기 편한 모양.',
  html:()=>`<svg class="svgw" viewBox="0 0 300 168" width="100%"><g class="arcs"></g><circle class="th" r="13" fill="#fff" stroke="rgba(0,0,0,.25)"/><circle class="th2" r="9"/></svg><div class="tl"><span>맑게</span><span>진하게</span></div>${''}`,
  init(el){ const svg=el.querySelector('svg'), g=svg.querySelector('.arcs'), cx=150, cy=156, R=130, w=34, N=60; let s='';
    for(let i=0;i<N;i++){ const a0=Math.PI*(1-i/N), a1=Math.PI*(1-(i+1)/N)-.01, c=along(PATH,(i+.5)/N);
      const p=(a,r)=>`${cx+Math.cos(a)*r},${cy-Math.sin(a)*r}`; s+=`<path d="M${p(a0,R)} A${R},${R} 0 0 1 ${p(a1,R)} L${p(a1,R-w)} A${R-w},${R-w} 0 0 0 ${p(a0,R-w)}Z" fill="${c}"/>`; }
    g.innerHTML=s; const th=svg.querySelector('.th'), th2=svg.querySelector('.th2');
    const set=t=>{ const a=Math.PI*(1-t), x=cx+Math.cos(a)*(R-w/2), y=cy-Math.sin(a)*(R-w/2); [th,th2].forEach(c=>{ c.setAttribute('cx',x); c.setAttribute('cy',y); }); th2.setAttribute('fill',along(PATH,t)); setCup(el,along(PATH,t),near(PATH,t)); };
    set(.4); drag(svg,(x,y,r)=>{ const sx=x/r.width*300, sy=y/r.height*168; let a=Math.atan2(cy-sy,sx-cx); if(a<0) a=sx<cx?Math.PI:0; set(1-a/Math.PI); }); }},
 {k:'E',name:'둥근 컬러 휠 (찻물 색 범위만)',desc:'둘레를 돌면 색 계열이, 가운데로 갈수록 맑게·바깥으로 갈수록 진하게 바뀌어요. 한 번 눌러서 바로 골라요.',
  html:()=>`<canvas class="svgw wh" width="440" height="440" style="width:220px;height:220px"></canvas>`,
  init(el){ const cv=el.querySelector('.wh'), x=cv.getContext('2d'), S=440, R=S/2-6, im=x.createImageData(S,S), D=im.data;
    for(let j=0;j<S;j++) for(let i=0;i<S;i++){ const dx=i-S/2, dy=j-S/2, r=Math.hypot(dx,dy); if(r>R) continue; let a=(Math.atan2(dy,dx)/(Math.PI*2)+1.25)%1;
      const fam=[...FAM,FAM[0]], c=hx(depth(along(fam,a),r/R)), k=(j*S+i)*4; D[k]=c[0]; D[k+1]=c[1]; D[k+2]=c[2]; D[k+3]=255*Math.min(1,(R-r)/2); }
    x.putImageData(im,0,0); const base=x.getImageData(0,0,S,S);
    const pick=(px,py)=>{ const dx=px-S/2, dy=py-S/2, r=Math.min(R,Math.hypot(dx,dy)), a=(Math.atan2(dy,dx)/(Math.PI*2)+1.25)%1, fam=[...FAM,FAM[0]], c=depth(along(fam,a),r/R);
      x.putImageData(base,0,0); const ang=Math.atan2(dy,dx); x.beginPath(); x.arc(S/2+Math.cos(ang)*r,S/2+Math.sin(ang)*r,16,0,7); x.fillStyle=c; x.fill(); x.lineWidth=6; x.strokeStyle='#fff'; x.stroke();
      setCup(el,c,dword(r/R)+near(fam,a)); };
    pick(S/2+R*.5,S/2-R*.2); drag(cv,(px,py,r)=>pick(px/r.width*S,py/r.height*S)); }},
 {k:'F',name:'넘겨 고르는 슬라이드 (카드 넘기기)',desc:'큰 색 원을 옆으로 넘기다가 가운데 멈춘 색이 골라져요. 하나씩 차분히 비교하기 좋아요.',
  html:()=>`<div class="caro-wrap"><div class="caro">${PATH.slice(1,9).concat(HERB).map(([n,c])=>`<button data-n="${n}" data-c="${c}" style="background:${c}" aria-label="${n}"></button>`).join('')}</div></div>`,
  init(el){ const c=el.querySelector('.caro'), bs=[...c.children]; const pick=()=>{ const r=c.getBoundingClientRect(), mid=r.left+r.width/2; let best=bs[0],bd=1e9; bs.forEach(b=>{ const q=b.getBoundingClientRect(), d=Math.abs(q.left+q.width/2-mid); if(d<bd){bd=d;best=b;} }); bs.forEach(b=>b.classList.toggle('on',b===best)); setCup(el,best.dataset.c,best.dataset.n); };
    c.addEventListener('scroll',()=>requestAnimationFrame(pick),{passive:true}); bs.forEach(b=>b.onclick=()=>b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}));
    requestAnimationFrame(()=>{ bs[3].scrollIntoView({inline:'center',block:'nearest'}); pick(); }); }},
];
const g=document.getElementById('grid');
g.innerHTML=V.map((v,i)=>`<section class="item" data-i="${i}"><button class="star" data-i="${i}">☆</button><h2>${v.k}. ${v.name}</h2><p class="d">${v.desc}</p><div class="card"><div class="fc"><div class="q"><b>색</b>찻물을 보면 가장 가까운 색은?</div>${cupHTML}${v.html()}${extra}</div></div></section>`).join('');
document.querySelectorAll('.item').forEach(el=>{ const v=V[+el.dataset.i]; v.init(el); extraChips(el); });
window.READY=true;
let FAV=new Set(); try{ FAV=new Set(JSON.parse(localStorage.getItem('tc.teacolor.fav')||'[]')); }catch(e){}
const names=()=>V.filter((v,i)=>FAV.has(i)).map(v=>v.k+'. '+v.name);
const box=document.createElement('div'); box.className='pickbox'; box.innerHTML='<b id="pc"></b><div class="pl" id="pl"></div><button id="cp">선택한 시안 복사하기</button><textarea id="ta" hidden readonly></textarea>'; document.body.appendChild(box);
function up(){ const L=names(); document.getElementById('pc').textContent=L.length?`☆ ${L.length}개 골랐어요`:'마음에 드는 시안의 ☆을 눌러 골라주세요'; document.getElementById('pl').textContent=L.join('\n'); document.getElementById('cp').disabled=!L.length;
  document.querySelectorAll('.star').forEach(b=>{ const on=FAV.has(+b.dataset.i); b.classList.toggle('on',on); b.textContent=on?'★':'☆'; }); }
document.getElementById('cp').onclick=async()=>{ const t='찻물 색 고르기 - 내가 고른 시안\n'+names().join('\n'), ta=document.getElementById('ta'), b=document.getElementById('cp'); try{ await navigator.clipboard.writeText(t); b.textContent='복사했어요'; setTimeout(()=>b.textContent='선택한 시안 복사하기',2000); }catch(e){ ta.hidden=false; ta.value=t; ta.select(); } };
document.querySelectorAll('.star').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; FAV.has(i)?FAV.delete(i):FAV.add(i); try{ localStorage.setItem('tc.teacolor.fav',JSON.stringify([...FAV])); }catch(e){} up(); });
up();
</script></body></html>
