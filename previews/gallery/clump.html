<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한 잔 한 덩어리 점묘</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--line:#E5E5E5;--g2:#737373}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;background:#F4F4F2;color:#111;line-height:1.5;padding:36px 20px 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:26px;font-weight:800;letter-spacing:-.3px}
.lead{color:var(--g2);font-size:14px;margin-top:6px;max-width:860px}
.bar{position:sticky;top:0;z-index:5;background:#F4F4F2;padding:12px 0;margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar button{font:inherit;font-size:13px;border:1px solid #D8D8D8;background:#fff;border-radius:16px;height:32px;padding:0 13px;cursor:pointer;color:#333}
.bar button.on{background:#111;border-color:#111;color:#fff}
.bar .sp{flex:1}
.bar .cnt{font-size:12.5px;color:var(--g2)}
.list{display:grid;gap:14px;margin-top:6px}
.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
.meta .no{font-size:12px;font-weight:800;color:#999}
.meta h2{font-size:17px;margin-top:2px;letter-spacing:-.2px}
.meta .cat{display:inline-block;font-size:11.5px;background:#F1F1F1;border-radius:10px;padding:1px 9px;margin-top:6px;color:#444}
.meta p{font-size:12.5px;color:var(--g2);margin-top:8px}
.meta .ms{font-size:11px;color:#AAA;margin-top:8px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trio figure{min-width:0}
.trio canvas{display:block;width:100%;aspect-ratio:1/1;border-radius:8px;background:#EEE}
.trio figcaption{font-size:11.5px;color:var(--g2);text-align:center;margin-top:4px}
.star{cursor:pointer;font-size:18px;color:#CCC;float:right;line-height:1}
.star.on{color:#111}
@media (max-width:820px){.item{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>한 잔 한 덩어리 점묘 — 기록 내용 비중대로 색을 나눈 또렷한 점</h1>
  <p class="lead">같은 사람이 차를 10잔, 50잔, 100잔 마셨을 때 기록이 어떻게 보일지 여러 방식으로 그려봤어요. 모든 시안은 같은 기록 데이터와 같은 색(찻물 색 + 풍미 색)을 써요. 기록의 위치는 앱과 같아요. 가로는 마시기 전 향(오른쪽일수록 좋음), 세로는 마신 뒤 맛(위쪽일수록 좋음)이에요. 마음에 드는 시안은 ☆을 눌러 표시해두세요(이 브라우저에만 저장돼요).</p>
  <div class="bar" id="bar"></div>
  <div class="list" id="list"></div>
</div>
<script src="harness.js"></script>
<script>
const FILES=['styles-clump.js'];
const params=new URLSearchParams(location.search), only=params.get('f');
const SIZE=+(params.get('size')||240);
function loadAll(files){ return files.reduce((p,f)=>p.then(()=>new Promise(res=>{ const s=document.createElement('script'); s.src=f+'?v='+Date.now(); s.onload=res; s.onerror=()=>{ console.warn('없음',f); res(); }; document.body.appendChild(s); })),Promise.resolve()); }
let FAV=new Set(); try{ FAV=new Set(JSON.parse(localStorage.getItem('tc.gallery.clfav')||'[]')); }catch(e){}
const saveFav=()=>{ try{ localStorage.setItem('tc.gallery.clfav',JSON.stringify([...FAV])); }catch(e){} };
loadAll(only?[only]:FILES).then(()=>{
  const S=GALLERY.styles; S.forEach((s,i)=>s.no=i+1);
  const cats=[...new Set(S.map(s=>s.cat))];
  let cur='전체';
  const bar=document.getElementById('bar');
  const drawBar=()=>{ bar.innerHTML=['전체','☆ 표시한 것',...cats].map(c=>`<button class="${c===cur?'on':''}" data-c="${c}">${c}</button>`).join('')+`<span class="sp"></span><span class="cnt">${S.length}가지</span>`;
    bar.querySelectorAll('button').forEach(b=>b.onclick=()=>{ cur=b.dataset.c; drawBar(); drawList(); }); };
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; io.unobserve(e.target); paint(e.target); }),{rootMargin:'600px'});
  function paint(el){ const s=S[+el.dataset.i]; let tot=0, err=null;
    el.querySelectorAll('canvas').forEach(cv=>{ const r=GALLERY.renderTo(s,cv,+cv.dataset.n,SIZE); tot+=r.ms; if(r.err) err=r.err; });
    el.querySelector('.ms').textContent=err?('오류: '+err.message):`그리는 데 ${Math.round(tot)}ms`; el.dataset.done='1'; }
  function drawList(){
    const L=S.map((s,i)=>[s,i]).filter(([s])=>cur==='전체'||(cur==='☆ 표시한 것'?FAV.has(s.id):s.cat===cur));
    const list=document.getElementById('list');
    list.innerHTML=L.map(([s,i])=>`<section class="item" data-i="${i}" id="${s.id}"><div class="meta"><span class="star ${FAV.has(s.id)?'on':''}" data-id="${s.id}">${FAV.has(s.id)?'★':'☆'}</span><div class="no">${String(s.no).padStart(3,'0')}</div><h2>${s.name}</h2><span class="cat">${s.cat}</span><p>${s.desc||''}</p><div class="ms"></div></div>
      <div class="trio">${[10,50,100].map(n=>`<figure><canvas data-n="${n}"></canvas><figcaption>${n}잔</figcaption></figure>`).join('')}</div></section>`).join('');
    list.querySelectorAll('.star').forEach(b=>b.onclick=()=>{ const id=b.dataset.id; FAV.has(id)?FAV.delete(id):FAV.add(id); saveFav(); b.classList.toggle('on'); b.textContent=FAV.has(id)?'★':'☆'; });
    list.querySelectorAll('.item').forEach(el=>params.get('all')?paint(el):io.observe(el));
  }
  drawBar(); drawList(); window.GALLERY_READY=true;
});
</script>
</body>
</html>
