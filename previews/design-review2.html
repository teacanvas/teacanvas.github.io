<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>디자인 점검 2차 시안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#F4F4F4;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:1300px;margin:0 auto;padding:28px 16px 60px}h1{font-size:24px;margin:0 0 6px}p.sub{color:#666;margin:0 0 14px;line-height:1.6;font-size:14px}
h2{font-size:18px;margin:34px 0 4px}.grid{display:flex;flex-wrap:wrap;gap:20px}
.card{width:236px}.frame{width:236px;height:511px;border-radius:26px;border:6px solid #111;overflow:hidden;background:#fff;position:relative}
.frame iframe{width:393px;height:852px;border:0;transform:scale(.57);transform-origin:0 0;position:absolute;left:0;top:0}
.card h3{font-size:15px;margin:10px 0 3px}.card p{font-size:12.5px;color:#555;margin:0;line-height:1.5}.tag{display:inline-block;font-size:12px;font-weight:700;background:#111;color:#fff;border-radius:10px;padding:1px 8px;margin-right:6px}
</style></head><body><main>
<h1>전체 디자인 점검 · 고를 것 5가지</h1>
<p class="sub">항목마다 왼쪽이 지금(a)이에요. 모두 실제 앱 화면이라 눌러 볼 수 있어요. "1-b, 2-a, 4-b"처럼 알려 주세요. 지금 그대로 두려면 a를 고르면 돼요.</p>
<div id="all"></div>
</main><script>
const P=[
 ['1','종이색과 흰색 규칙','지금은 홈·채팅 대화 칸·캔버스 상자만 종이색이고 나머지는 흰색이라, 같은 기록 흐름에서 바탕이 바뀌어요.',[[1,'','a','지금'],[1,'p1a','b','앱 전체를 종이색으로 (카드만 흰색)'],[1,'p1b','c','종이색은 홈·캔버스에만, 채팅은 흰색'],[5,'','a','지금 · 비교 화면'],[5,'p1a','b','b를 비교 화면에서 보면']]],
 ['2','채팅 선택 버튼(칩)','채팅 칩이 1.5px 검은 테두리 + 굵은 글씨라 앱에서 가장 진해요. 브랜드 원칙(얇은 선, 낮은 대비)과 어긋나요.',[[1,'','a','지금'],[1,'p2a','b','얇은 회색 테두리, 주 버튼만 검은 테두리'],[1,'p2b','c','얇은 회색 테두리, 주 버튼은 검은 면']]],
 ['3','기록 흐름 위쪽 로고 줄','채팅에서는 로고 줄이 숨는데, 바로 다음 정리 중·비교·완료·Tea Tag에서는 다시 나타나 화면이 위아래로 튀어요.',[[7,'','a','지금'],[7,'p3a','b','기록 흐름 전체에서 로고 줄 숨김']]],
 ['4','검정 면 줄이기 (캔버스·기록 전환, 종 아이콘)','선택된 탭이 꽉 찬 검정 면, 종 아이콘도 꽉 찬 검정이에요.',[[10,'','a','지금'],[10,'p4a','b','흰 면 + 얇은 검은 테두리, 종은 선 아이콘'],[10,'p4b','c','밑줄 탭, 종은 선 아이콘']]],
 ['5','풍미 이름 글자 색 (상세·취향 찻방울)','풍미 이름을 풍미 색 그대로 쓰고 있어 글자가 흐리고(대비 3.3:1), 찻방울 밖에 색을 쓰지 않는다는 원칙과도 어긋나요.',[[12,'','a','지금 (풍미 색 글자)'],[12,'p5a','b','진회색 글자']]]];
document.getElementById('all').innerHTML=P.map(([n,t,why,vs])=>`<h2>${n}. ${t}</h2><p class="sub">${why}</p><div class="grid">${vs.map(([j,f,k,d],i)=>`<div class="card"><div class="frame"><iframe loading="lazy" src="../TEA_CANVAS_prototype_v6.html?jump=${j}&dz=${f}" title="${n}-${i}"></iframe></div><h3><span class="tag">${n}-${k}</span></h3><p>${d}</p></div>`).join('')}</div>`).join('');
</script></body></html>
