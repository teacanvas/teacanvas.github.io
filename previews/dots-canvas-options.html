<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>점묘 캔버스 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--line:#E5E5E5;--g2:#737373}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;background:#F4F4F2;color:#111;line-height:1.5;padding:40px 24px 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:24px;font-weight:700;letter-spacing:-.3px}
.lead{color:var(--g2);font-size:14px;margin-top:6px;max-width:820px}
.bar{position:sticky;top:10px;z-index:5;display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:5px 6px 5px 14px;font-size:13px;margin:18px 0 4px}
.bar span{font-weight:700;margin-right:4px}
.bar button{font:inherit;border:0;background:none;height:30px;padding:0 14px;border-radius:15px;cursor:pointer;color:#444}
.bar button.on{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px;margin-top:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{font-size:15.5px}
.card h2 small{font-size:11px;font-weight:700;background:#111;color:#fff;border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.card p{font-size:12.5px;color:var(--g2);margin-top:4px;min-height:38px}
.card canvas{display:block;width:100%;aspect-ratio:1/1;border-radius:8px;margin-top:12px;cursor:pointer}
.hint{font-size:11.5px;color:var(--g2);text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>점묘 캔버스 시안 4종</h1>
  <p class="lead">그라데이션 시안과 같은 색면을 계산한 뒤, 그 색을 점으로 찍어요. 예전 점묘가 번잡했던 건 점이 무작위로 뭉쳤다 비었다 했기 때문이라, 이번엔 점 사이 간격을 고르게 맞췄어요. 기록이 많은 곳일수록 점이 크고 촘촘해져요. 캔버스를 누르면 그 자리에 새 방울이 번져 들어와요.</p>
  <div class="bar" id="bar"><span>기록 수</span><button data-n="8">8개</button><button data-n="50" class="on">50개</button><button data-n="150">150개</button></div>
  <div class="grid" id="grid"></div>
</div>
<script>
/* @@D3_BEGIN (src/drop3d.js에서 빌드) */
/* =========================================================
   D3 — 3D 찻방울 (WebGL, 라이브러리 없음)
   방울 속 3D 색 공간: 찻물 색(바탕) 위에 풍미 잉크가 각자 자리에서 번지고,
   흐르는 노이즈로 경계가 섞인다. 같은 색 공간을 JS로도 계산해 2D 캔버스에 칠한다.
   ========================================================= */
const D3 = (()=>{
  const VERT = `attribute vec2 p; varying vec2 v; void main(){ v=p; gl_Position=vec4(p,0.,1.); }`;
  const GLSL_FIELD = `
float h3(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float n3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*n3(p); p=p*2.02+vec3(3.1,1.7,5.3); a*=.5; } return s; }
uniform vec3 baseC; uniform float baseW; uniform vec3 inkC[10]; uniform vec3 inkP[10]; uniform float inkW[10]; uniform float t, flow, swirl;
vec3 fieldC(vec3 q){
  vec3 w=vec3(fbm(q*1.6+vec3(0.,0.,t*flow)), fbm(q*1.6+vec3(5.2,1.3,-t*flow)), fbm(q*1.6+vec3(2.7,8.1,t*flow*.7)));
  q+=(w-.5)*swirl;
  float b=baseW*baseW*sqrt(baseW); vec3 acc=baseC*b; float tot=b;
  for(int i=0;i<10;i++){
    float wi=inkW[i]; if(wi<.001) continue;
    vec3 d=q-inkP[i]; float f=wi*exp(-dot(d,d)/(.06+.3*wi));
    f=f*f*sqrt(f); acc+=inkC[i]*f; tot+=f;
  }
  return acc/max(tot,1e-6);
}`;
  const FRAG = `precision highp float; varying vec2 v; uniform mat3 rot; uniform float wob, glit;
${GLSL_FIELD}
void main(){
  vec2 uv=v; float r=length(uv), ang=atan(uv.y,uv.x);
  float R=.8+wob*(.012*sin(t*1.3)+.024*(n3(vec3(cos(ang)*1.3,sin(ang)*1.3,t*.3))-.5));
  if(r>R){ gl_FragColor=vec4(0.); return; }
  vec2 s=uv/R; float z=sqrt(max(0.,1.-dot(s,s)));
  vec3 N=vec3(s,z), col=vec3(0.); float ws=0.;
  for(int k=0;k<2;k++){ float zz=z*(1.-float(k)*.6); vec3 q=rot*vec3(s*.94,zz*.94); float w=k==0?1.:.3; col+=fieldC(q)*w; ws+=w; }
  col/=ws;
  float lum=dot(col,vec3(.299,.587,.114)); col=clamp(mix(vec3(lum),col,1.28),0.,1.);
  vec3 L=normalize(vec3(-.45,.6,.65));
  col*=.9+.16*max(dot(N,L),0.);
  float fres=pow(1.-z,2.6);
  col=mix(col,col*.72,fres*.6);
  col+=pow(max(dot(reflect(-L,N),vec3(0,0,1)),0.),46.)*.6;
  col+=vec3(.95,.97,1.)*smoothstep(.45,1.,fres)*.28;
  if(glit>0.){ // 표면의 색 입자: 가까이 보면 방울이 작은 점들로 이루어져 있다
    vec3 qs=rot*vec3(s,z)*.97; vec3 cell=floor(qs*34.); float hh=h3(cell+7.3);
    vec3 cc=(cell+.5+(vec3(h3(cell+1.1),h3(cell+2.2),h3(cell+3.3))-.5)*.5)/34.;
    float dd=length(qs-cc)*34., sp=step(.55,hh)*smoothstep(.42,.12,dd)*smoothstep(.0,.35,z);
    vec3 pc=fieldC(cc); float tw=.75+.25*sin(t*2.2+hh*60.);
    col=mix(col,clamp(pc*1.12+.04,0.,1.)*tw+vec3(.12)*step(.93,hh),sp*glit*.85);
  }
  float a=smoothstep(R,R-.014,r);
  gl_FragColor=vec4(col*a,a);
}`;

  /* ---------- 색 공간 데이터 ---------- */
  const rng = seed => { let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; };
  const hash = s => { let h=2166136261; for(const ch of String(s)){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; };
  const rgb = h => { const n=parseInt(h.slice(1),16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]; };
  // comps: [{key:'tea',c,w}, {key:flavor,c,w}...] → 바탕 + 잉크(강한 풍미는 가운데 가까이, 약한 풍미는 가장자리)
  function fromComps(id,comps){
    const r=rng(hash(id)), tea=comps.find(c=>c.key==='tea')||comps[0];
    const fl=comps.filter(c=>c!==tea).sort((a,b)=>b.w-a.w).slice(0,5);
    // 풍미마다 1~3개의 덩어리를 방울 표면 가까이 고르게 흩어, 어느 쪽으로 돌려도 색이 보이게
    const lobes=[]; fl.forEach(c=>{ for(let k=0,n=1+Math.round(c.w*2);k<n;k++) lobes.push(c); });
    const L=lobes.slice(0,10), N=L.length, off=r()*6.28;
    const order=L.map((_,i)=>i).sort(()=>r()-.5);
    const inks=L.map((c,j)=>{
      const i=order[j], y=1-2*(i+.5)/N, s=Math.sqrt(1-y*y), th=i*2.39996+off, d=.6+.22*r();
      return {key:c.key,c:rgb(c.c),p:[s*Math.cos(th)*d,y*d,s*Math.sin(th)*d],w:c.w};
    });
    return {base:rgb(tea.c),baseW:fl.length?.3:1,inks};
  }

  /* ---------- 같은 색 공간을 JS로 (2D 캔버스용) ---------- */
  const fr=x=>x-Math.floor(x);
  function h3(x,y,z){ x=fr(x*.3183099+.1)*17; y=fr(y*.3183099+.1)*17; z=fr(z*.3183099+.1)*17; return fr(x*y*z*(x+y+z)); }
  function n3(x,y,z){
    const ix=Math.floor(x), iy=Math.floor(y), iz=Math.floor(z); let fx=x-ix, fy=y-iy, fz=z-iz;
    fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy); fz=fz*fz*(3-2*fz);
    const L=(a,b,t)=>a+(b-a)*t;
    return L(L(L(h3(ix,iy,iz),h3(ix+1,iy,iz),fx),L(h3(ix,iy+1,iz),h3(ix+1,iy+1,iz),fx),fy),
             L(L(h3(ix,iy,iz+1),h3(ix+1,iy,iz+1),fx),L(h3(ix,iy+1,iz+1),h3(ix+1,iy+1,iz+1),fx),fy),fz);
  }
  function fbm(x,y,z){ let s=0,a=.5; for(let i=0;i<4;i++){ s+=a*n3(x,y,z); x=x*2.02+3.1; y=y*2.02+1.7; z=z*2.02+5.3; a*=.5; } return s; }
  function colorAt(F,x,y,z,t=0,flow=.04,swirl=.9){
    const wx=fbm(x*1.6,y*1.6,z*1.6+t*flow), wy=fbm(x*1.6+5.2,y*1.6+1.3,z*1.6-t*flow), wz=fbm(x*1.6+2.7,y*1.6+8.1,z*1.6+t*flow*.7);
    x+=(wx-.5)*swirl; y+=(wy-.5)*swirl; z+=(wz-.5)*swirl;
    const bw=F.baseW**2.5; let r=F.base[0]*bw, g=F.base[1]*bw, b=F.base[2]*bw, tot=bw;
    for(const k of F.inks){ const w=k.w*(k.vis??1); if(w<.001) continue; const dx=x-k.p[0], dy=y-k.p[1], dz=z-k.p[2];
      let f=w*Math.exp(-(dx*dx+dy*dy+dz*dz)/(.06+.3*w)); f=f*f*Math.sqrt(f); r+=k.c[0]*f; g+=k.c[1]*f; b+=k.c[2]*f; tot+=f; }
    r/=tot; g/=tot; b/=tot; const l=.299*r+.587*g+.114*b, S=1.35, c=v=>Math.max(0,Math.min(1,l+(v-l)*S));
    return [c(r),c(g),c(b)];
  }

  /* ---------- 렌더러 ---------- */
  function makeGL(cv,preserve=false){
    const gl=cv.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:true,preserveDrawingBuffer:preserve});
    if(!gl) return null;
    const sh=(type,src)=>{ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,VERT)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FRAG)); gl.linkProgram(pr); gl.useProgram(pr);
    const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    const U={}; ['rot','wob','glit','baseC','baseW','inkC','inkP','inkW','t','flow','swirl'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
    return {gl,
      draw(F,yaw,pitch,t,o={}){
        const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
        // R = Ry(yaw) * Rx(pitch), column-major
        gl.uniformMatrix3fv(U.rot,false,[cy,0,-sy, sy*sp,cp,cy*sp, sy*cp,-sp,cy*cp]);
        gl.uniform1f(U.t,t); gl.uniform1f(U.wob,o.wob??1); gl.uniform1f(U.glit,o.glit??0); gl.uniform1f(U.flow,o.flow??.04); gl.uniform1f(U.swirl,o.swirl??.9);
        gl.uniform3fv(U.baseC,F.base); gl.uniform1f(U.baseW,F.baseW);
        const C=[],P=[],W=[]; for(let i=0;i<10;i++){ const k=F.inks[i]; C.push(...(k?k.c:[0,0,0])); P.push(...(k?k.p:[0,0,0])); W.push(k?k.w*(k.vis??1):0); }
        gl.uniform3fv(U.inkC,C); gl.uniform3fv(U.inkP,P); gl.uniform1fv(U.inkW,W);
        gl.viewport(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      },
      dispose(){ const e=gl.getExtension('WEBGL_lose_context'); e&&e.loseContext(); }};
  }
  // 스냅샷용 공유 렌더러(화면 밖 캔버스 하나)
  let snapR=null, snapCv=null;
  function snapshot(F,px,yaw=0,pitch=0,t=0,o){
    if(!snapCv){ snapCv=document.createElement('canvas'); try{ snapR=makeGL(snapCv,true); }catch(e){ snapR=null; } }
    if(!snapR) return null;
    if(snapCv.width!==px){ snapCv.width=snapCv.height=px; }
    snapR.draw(F,yaw,pitch,t,{wob:0,...o}); return snapCv;
  }

  /* 화면 속 3D 방울: 자동으로 천천히 돌고, interactive면 드래그로 돌려본다 */
  function mount(el,F,{size=200,px=null,interactive=false,spin=.32,flow=.04,swirl=.9,wob=1,glit=0,onFrame=null}={}){
    const cv=document.createElement('canvas'); cv.className='d3'; cv.style.width=cv.style.height=size+'px';
    let R; try{ R=makeGL(cv); }catch(e){ R=null; } if(!R) return null;
    el.innerHTML=''; el.appendChild(cv);
    const n=px||Math.min(1000,Math.round(size*Math.min(2,window.devicePixelRatio||1)*(typeof SCALE!=='undefined'?SCALE:1))); cv.width=cv.height=n;
    const st={F,yaw:Math.random()*6.28,pitch:.25,vy:spin,drag:false,t0:performance.now(),last:performance.now()};
    if(interactive){
      cv.style.cursor='grab'; cv.style.touchAction='none';
      let px0=0,py0=0,lt=0;
      cv.addEventListener('pointerdown',e=>{ st.drag=true; cv.setPointerCapture(e.pointerId); px0=e.clientX; py0=e.clientY; lt=performance.now(); cv.style.cursor='grabbing'; });
      cv.addEventListener('pointermove',e=>{ if(!st.drag) return; const b=cv.getBoundingClientRect(), k=4/b.width, now=performance.now(), dx=(e.clientX-px0)*k, dy=(e.clientY-py0)*k;
        st.yaw+=dx; st.pitch=Math.max(-1.2,Math.min(1.2,st.pitch+dy)); st.vy=dx/Math.max(.008,(now-lt)/1000); px0=e.clientX; py0=e.clientY; lt=now; });
      const up=()=>{ st.drag=false; cv.style.cursor='grab'; st.vy=Math.max(-4,Math.min(4,st.vy)); };
      cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
    }
    (function loop(now){
      if(!cv.isConnected){ R.dispose(); return; }
      const dt=Math.min(.05,(now-st.last)/1000); st.last=now; const t=(now-st.t0)/1000;
      if(!st.drag){ st.vy+=(spin-st.vy)*Math.min(1,dt*1.5); st.yaw+=st.vy*dt; st.pitch+=(.25-st.pitch)*dt*.6; }
      onFrame&&onFrame(t,st);
      R.draw(st.F,st.yaw,st.pitch,t,{flow,swirl,wob,glit:st.glit??glit});
      requestAnimationFrame(loop);
    })(performance.now());
    return st;
  }
  return {fromComps,colorAt,snapshot,mount,rgb,rng,hash};
})();
/* @@D3_END */

const TEA_C={green:'#B5D07E',white:'#EEDC9A',oolong:'#E3A03A',black:'#CF5E3A',dark:'#7C3E2C',herb:'#C4B2E2'};
const FL={floral:'#E9A9C6',fruity:'#F2946A',citrus:'#E8D45A',vegetal:'#96C46A',fresh:'#79C3BC',nutty:'#A87A4E',sweet:'#E5B04F',earthy:'#6B5643',spicy:'#B8513A',soft:'#E3D3BF',astringent:'#8E8A4C'};
const FK=Object.keys(FL), TK=Object.keys(TEA_C), DPR=Math.min(2,devicePixelRatio||1);
function randRec(r,id){ const nf=1+Math.floor(r()*3), fl=[], used=new Set();
  for(let k=0;k<nf;k++){ let f; do{ f=FK[Math.floor(r()*FK.length)]; }while(used.has(f)); used.add(f); fl.push([f,.35+r()*.6]); }
  return {id,type:TK[Math.floor(r()*6)],fl,x:.06+r()*.88,y:.06+r()*.88,i:.3+r()*.7}; }
const comps=r=>[{key:'tea',c:TEA_C[r.type],w:.5},...r.fl.map(([k,w])=>({key:k,c:FL[k],w}))];

/* 방울 하나 → 색 점 7개(가운데 = 앞면, 둘레 = 옆·뒷면) */
const lin=v=>Math.pow(v,2.2), gam=v=>Math.pow(Math.max(0,v),1/2.2);
function pointsOf(r){
  if(r.pts) return r.pts;
  const F=D3.fromComps(r.id,comps(r)), yaw=D3.hash(r.id)%628/100, out=[];
  const dirs=[[0,0,1,1]]; for(let k=0;k<6;k++){ const a=k/6*6.283; dirs.push([Math.cos(a)*.93,Math.sin(a)*.93,-.35,.75]); }
  for(const [x,y,z,w] of dirs){
    const cy=Math.cos(yaw), sy=Math.sin(yaw), qx=x*cy+z*sy, qz=-x*sy+z*cy, n=Math.hypot(qx,y,qz);
    const c=D3.colorAt(F,qx/n*.9,y/n*.9,qz/n*.9);
    out.push({dx:x*.6,dy:y*.6,c:c.map(lin),w});
  }
  return r.pts=out;
}

/* 캔버스 전체 색면: 가까운 색 점일수록 강하게, 밝은(선형) 공간에서 섞는다 */
function field(recs,n,{spread=1,sharp=2,warp=null,t=0,grow=null}={}){
  // 기록이 많을수록 방울 하나가 차지하는 자리를 줄여, 모두 섞여 한 색이 되지 않게
  const dens=Math.min(1,Math.sqrt(12/Math.max(12,recs.length)))*.35+.65;
  const P=[]; recs.forEach(r=>{ const R=(.045+.05*r.i)*spread*dens, g=grow&&grow.r===r?grow.k:1;
    pointsOf(r).forEach(p=>P.push({x:r.x+p.dx*R,y:r.y+p.dy*R,s2:2*(R*.75)*(R*.75)*Math.max(.05,g*g),a:p.w*(.6+.4*r.i)*g,c:p.c})); });
  const col=new Float32Array(n*n*3), cov=new Float32Array(n*n);
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    let u=(i+.5)/n, v=(j+.5)/n; if(warp){ const o=warp(u,v,t); u+=o[0]; v+=o[1]; }
    let r=0,g=0,b=0,ws=0,tot=0;
    for(const p of P){ const dx=u-p.x, dy=v-p.y, e=p.a*Math.exp(-(dx*dx+dy*dy)/p.s2); if(e<1e-4) continue; const w=Math.pow(e,sharp); r+=p.c[0]*w; g+=p.c[1]*w; b+=p.c[2]*w; ws+=w; tot+=e; }
    const k=j*n+i; if(ws>0){ col[k*3]=r/ws; col[k*3+1]=g/ws; col[k*3+2]=b/ws; } cov[k]=1-Math.exp(-tot*2.2);
  }
  return {col,cov,n};
}
const fr=x=>x-Math.floor(x), h2=(x,y)=>fr(Math.sin(x*127.1+y*311.7)*43758.5453);
function n2(x,y){ const ix=Math.floor(x), iy=Math.floor(y); let fx=x-ix, fy=y-iy; fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy);
  const a=h2(ix,iy), b=h2(ix+1,iy), c=h2(ix,iy+1), d=h2(ix+1,iy+1); return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy; }
const fbm=(x,y)=>.5*n2(x,y)+.25*n2(x*2.03+5.1,y*2.03+1.3)+.125*n2(x*4.1+2.7,y*4.1+8.2);
const ss=(a,b,x)=>{ const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); };
const mk=n=>{ const c=document.createElement('canvas'); c.width=c.height=n; return c; };

/* 고운 필름 입자 */
let GR=null;
function grain(ctx,W,amt,mode='overlay'){
  if(!GR){ GR=mk(256); const x=GR.getContext('2d'), im=x.createImageData(256,256), d=im.data, r=D3.rng(3);
    for(let i=0;i<d.length;i+=4){ const v=r()*255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; } x.putImageData(im,0,0); }
  ctx.save(); ctx.globalCompositeOperation=mode; ctx.globalAlpha=amt; ctx.fillStyle=ctx.createPattern(GR,'repeat'); ctx.fillRect(0,0,W,W); ctx.restore();
}
/* 작은 해상도에서 계산 → 부드럽게 키워 그린다 */
function blit(ctx,W,F,shade){
  const n=F.n, c=mk(n), x=c.getContext('2d'), im=x.createImageData(n,n), d=im.data;
  for(let k=0;k<n*n;k++){ const o=shade(F.col[k*3],F.col[k*3+1],F.col[k*3+2],F.cov[k],k%n/n,Math.floor(k/n)/n); d[k*4]=o[0]; d[k*4+1]=o[1]; d[k*4+2]=o[2]; d[k*4+3]=o[3]??255; }
  x.putImageData(im,0,0);
  const m=mk(n*3), mx=m.getContext('2d'); mx.imageSmoothingQuality='high'; mx.drawImage(c,0,0,n*3,n*3);
  // 마지막에 살짝 흐려 색면 사이를 부드럽게 잇는다(가장자리가 비지 않게 조금 크게 그림)
  ctx.save(); ctx.imageSmoothingQuality='high'; ctx.filter=`blur(${Math.round(W*.014)}px)`; const o=W*.04; ctx.drawImage(m,-o,-o,W+2*o,W+2*o); ctx.restore();
}
const pastel=(c,lift,sat)=>{ const l=.2126*c[0]+.7152*c[1]+.0722*c[2]; return c.map(v=>{ v=l+(v-l)*sat; return v+(1-v)*lift; }); };

/* ---------- 점 놓기 ---------- */
// 고른 간격의 무작위 점(블루노이즈, Bridson)
const PDS=new Map();
function poisson(W,d,seed){
  const k=W+'|'+d+'|'+seed; if(PDS.has(k)) return PDS.get(k);
  const r=D3.rng(seed), cs=d/Math.SQRT2, gw=Math.ceil(W/cs), grid=new Int32Array(gw*gw).fill(-1), pts=[], act=[];
  const add=(x,y)=>{ pts.push([x,y]); act.push(pts.length-1); grid[Math.floor(y/cs)*gw+Math.floor(x/cs)]=pts.length-1; };
  add(r()*W,r()*W);
  while(act.length){ const ai=Math.floor(r()*act.length), [px,py]=pts[act[ai]]; let ok=false;
    for(let t=0;t<20;t++){ const a=r()*6.283, rr=d*(1+r()), x=px+Math.cos(a)*rr, y=py+Math.sin(a)*rr; if(x<0||y<0||x>=W||y>=W) continue;
      const gx=Math.floor(x/cs), gy=Math.floor(y/cs); let far=true;
      for(let j=Math.max(0,gy-2);j<=Math.min(gw-1,gy+2)&&far;j++) for(let i=Math.max(0,gx-2);i<=Math.min(gw-1,gx+2);i++){ const q=grid[j*gw+i]; if(q>=0&&Math.hypot(pts[q][0]-x,pts[q][1]-y)<d){ far=false; break; } }
      if(far){ add(x,y); ok=true; break; } }
    if(!ok) act.splice(ai,1); }
  PDS.set(k,pts); return pts;
}
// 색면에서 한 점의 색·농도 읽기(쌍선형)
function sample(F,u,v){ const n=F.n, x=Math.min(n-1.001,Math.max(0,u*n-.5)), y=Math.min(n-1.001,Math.max(0,v*n-.5)), i=Math.floor(x), j=Math.floor(y), fx=x-i, fy=y-j;
  const at=(a,b)=>{ const k=b*n+a; return [F.col[k*3],F.col[k*3+1],F.col[k*3+2],F.cov[k]]; };
  const A=at(i,j),B=at(i+1,j),C=at(i,j+1),D=at(i+1,j+1); return A.map((_,q)=>A[q]*(1-fx)*(1-fy)+B[q]*fx*(1-fy)+C[q]*(1-fx)*fy+D[q]*fx*fy); }
const rgbOf=(c,lift=.06,sat=1.25)=>`rgb(${pastel(c.slice(0,3),lift,sat).map(v=>gam(v)*255|0)})`;
function underlay(ctx,W,F,alpha,bg){ ctx.save(); ctx.globalAlpha=alpha; blit(ctx,W,F,(r,g,b,a)=>{ const c=pastel([r,g,b],.2,1.1), p=bg.map(v=>lin(v/255)), m=ss(0,.9,a); return c.map((v,i)=>gam(p[i]+(v-p[i])*m)*255); }); ctx.restore(); }

const STYLES=[
  {k:'blue',n:'A. 고른 점묘',tag:'추천',d:'점 사이 간격을 고르게 맞춘 점묘예요. 뭉침이 없어 차분하고, 기록이 많은 곳은 점이 커져요.',
   bg:'#F7F5F0', render(ctx,W,recs,o){ const F=field(recs,o.grow?90:120,{spread:1.25,sharp:2,...o}), d=W/72, pts=poisson(W,d,7), r=D3.rng(9);
     for(const [x,y] of pts){ const s=sample(F,x/W,y/W), a=s[3]; if(a<.04||r()>Math.min(1,a*1.6)) continue;
       ctx.fillStyle=rgbOf(s); ctx.beginPath(); ctx.arc(x,y,d*(.22+.26*ss(0,1,a)),0,6.283); ctx.fill(); }
     grain(ctx,W,.05); }},
  {k:'half',n:'B. 하프톤 격자',tag:'',d:'인쇄물처럼 일정한 격자에 점을 놓고, 점 크기로 진하기를 나타내요. 가장 정돈되고 그래픽적이에요.',
   bg:'#F7F5F0', render(ctx,W,recs,o){ const F=field(recs,o.grow?90:120,{spread:1.25,sharp:2,...o}), d=W/46;
     for(let j=0;j*d*.866<W+d;j++) for(let i=-1;i*d<W+d;i++){ const x=i*d+(j%2?d/2:0)+d/2, y=j*d*.866+d/2, s=sample(F,x/W,y/W), a=s[3]; if(a<.05) continue;
       ctx.fillStyle=rgbOf(s); ctx.beginPath(); ctx.arc(x,y,d*.5*Math.sqrt(ss(0,1,a))*.96,0,6.283); ctx.fill(); }
     }},
  {k:'seurat',n:'C. 붓 점묘 (쇠라)',tag:'',d:'짧은 붓 터치로 찍은 큰 점이에요. 아주 옅은 색면을 아래에 깔아 빈 곳이 덜 비어 보여요.',
   bg:'#F7F5F0', render(ctx,W,recs,o){ const F=field(recs,o.grow?90:120,{spread:1.25,sharp:2,...o}); underlay(ctx,W,F,.35,[247,245,240]);
     const d=W/52, pts=poisson(W,d,11), r=D3.rng(5);
     for(const [x,y] of pts){ const s=sample(F,x/W,y/W), a=s[3]; if(a<.05||r()>Math.min(1,a*1.4)) continue;
       const c=s.slice(0,3).map(v=>v*(.92+.16*r()));
       ctx.save(); ctx.translate(x,y); ctx.rotate(-.6+r()*.5); ctx.fillStyle=rgbOf([...c,a],.04,1.3); ctx.beginPath(); ctx.ellipse(0,0,d*.48,d*.28,0,0,6.283); ctx.fill(); ctx.restore(); }
     grain(ctx,W,.06); }},
  {k:'fine',n:'D. 고운 점 + 옅은 색면',tag:'',d:'옅은 그라데이션 위에 작고 고운 점을 촘촘히 뿌려요. 멀리서는 색면, 가까이서는 점이에요.',
   bg:'#F9F8F4', render(ctx,W,recs,o){ const F=field(recs,o.grow?90:120,{spread:1.25,sharp:2,...o}); underlay(ctx,W,F,.55,[249,248,244]);
     const d=W/110, pts=poisson(W,d,13), r=D3.rng(3);
     for(const [x,y] of pts){ const s=sample(F,x/W,y/W), a=s[3]; if(a<.05||r()>a) continue;
       ctx.fillStyle=rgbOf(s,0,1.35); ctx.beginPath(); ctx.arc(x,y,d*(.2+.22*a),0,6.283); ctx.fill(); }
     grain(ctx,W,.05); }},
];
let COUNT=50;
const recsFor=n=>{ const r=D3.rng(5050+n); return Array.from({length:n},(_,i)=>randRec(r,'m'+n+'-'+i)); };
let SETS={}; const recs=()=>SETS[COUNT]||(SETS[COUNT]=recsFor(COUNT));
document.getElementById('grid').innerHTML=STYLES.map(s=>`<section class="card"><h2>${s.n}${s.tag?`<small>${s.tag}</small>`:''}</h2><p>${s.d}</p><canvas id="c-${s.k}"></canvas><div class="hint">누르면 그 자리에 새 방울이 번져 들어와요</div></section>`).join('');

let GEN=0;
function init(){
  const gen=++GEN;
  STYLES.forEach(s=>{
    const cv=document.getElementById('c-'+s.k), W=Math.round(cv.clientWidth*DPR); cv.width=cv.height=W;
    const ctx=cv.getContext('2d'), list=[...recs()];
    const draw=(o={})=>{ ctx.fillStyle=s.bg; ctx.fillRect(0,0,W,W); s.render(ctx,W,list,o); };
    if(s.anim){ let t=0; (function loop(){ if(gen!==GEN) return; t+=1; draw({t}); setTimeout(()=>requestAnimationFrame(loop),60); })(); }
    else draw();
    cv.onclick=e=>{ const b=cv.getBoundingClientRect(), nr=randRec(Math.random,'n'+Date.now()); nr.x=(e.clientX-b.left)/b.width; nr.y=(e.clientY-b.top)/b.height; nr.i=.6+Math.random()*.4; list.push(nr);
      if(s.anim) return; const t0=performance.now(); (function f(now){ const k=Math.min(1,(now-t0)/1100), e=1-Math.pow(1-k,3); draw({grow:{r:nr,k:Math.max(.05,e)}}); if(k<1) requestAnimationFrame(f); })(t0); };
  });
}
init();
document.querySelectorAll('#bar button').forEach(b=>b.onclick=()=>{ COUNT=+b.dataset.n; document.querySelectorAll('#bar button').forEach(x=>x.classList.toggle('on',x===b)); setTimeout(init,20); });
</script>
</body>
