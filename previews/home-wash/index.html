<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>홈 수채 번짐 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,system-ui,sans-serif;background:#F4F4F2;color:#111;padding:32px max(16px,env(safe-area-inset-right,0px)) 200px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:24px;font-weight:800}
.lead{color:#737373;font-size:14px;margin-top:6px;max-width:820px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:18px}
.card{background:#fff;border:1px solid #E5E5E5;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;position:relative}
.card canvas{width:100%;aspect-ratio:1/1;display:block}
.card .no{font-size:11.5px;font-weight:800;color:#999}
.card h2{font-size:14px}
.card p{font-size:12px;color:#737373}
.star{position:absolute;right:10px;top:8px;font-size:22px;color:#CCC;background:none;border:0;cursor:pointer;line-height:1}
.star.on{color:#111}
.pickbox{position:fixed;right:16px;bottom:16px;z-index:20;background:#111;color:#fff;border-radius:14px;padding:12px 14px;max-width:min(420px,calc(100vw - 32px));font-size:13px;display:flex;flex-direction:column;gap:8px}
.pickbox .pl{white-space:pre-wrap;color:#ddd}
.pickbox button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;background:#fff;color:#111}
.pickbox button:disabled{opacity:.5}
.pickbox textarea{width:100%;height:80px}
</style></head><body>
<div class="wrap"><h1>홈 수채 번짐 시안 10종</h1>
<p class="lead">위에서 내려다본 종이에 물감이 스며들며 퍼지고, 마르면서 테두리가 생겨요(맺히는 방울 없음). 퍼지는 속도, 젖은 경계의 흐림, 테두리 진하기, 반짝임, 종이 입자, 크기를 바꿨어요. 풍미 색이 차례로 바뀌며 반복돼요. ☆로 고르고 오른쪽 아래에서 복사해 붙여넣으세요.</p>
<div class="grid" id="grid"></div></div>
<script>
const WC={rng:seed=>{ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }};
function makeWash(N,hex,seed,P){
  const r=WC.rng(seed), s1=r()*50, s2=r()*50;
  const fr=x=>x-Math.floor(x), h2=(x,y)=>fr(Math.sin(x*127.1+y*311.7)*43758.5453);
  const nz=(x,y)=>{ const ix=Math.floor(x), iy=Math.floor(y); let fx=x-ix, fy=y-iy; fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy); const a=h2(ix,iy), b=h2(ix+1,iy), c=h2(ix,iy+1), d=h2(ix+1,iy+1); return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy; };
  const fbm=(x,y)=>.5*nz(x,y)+.25*nz(x*2.03+5,y*2.03+1)+.125*nz(x*4.1+2,y*4.1+7)+.0625*nz(x*8.3,y*8.3);
  const T=new Float32Array(N*N), G=new Float32Array(N*N), H=new Float32Array(N*N);
  const el=1, ea=0, ce=1, se=0; // 위에서 똑바로 내려다본 모습: 찌그러뜨리지 않는다
  // 색이 고이는 자리 몇 군데(진한 얼룩)
  const pools=[0,1,2].map(()=>({x:(r()-.5)*.8,y:(r()-.5)*.8,r:.12+.18*r(),k:.35+.5*r()}));
  for(let j=0;j<N;j++) for(let i=0;i<N;i++){
    let u=(i+.5)/N*2-1, v=(j+.5)/N*2-1; const a=u*ce+v*se, b=-u*se+v*ce; const uu=a/el, vv=b*el;
    const rr=Math.hypot(uu,vv), th=Math.atan2(vv,uu);
    const ang=fbm(Math.cos(th)*1.3+s1,Math.sin(th)*1.3+s2);          // 방향별로 멀리/덜 퍼짐
    const paper=fbm(u*5+s1,v*5+s2);                                   // 종이 결(낮은 곳으로 빨리 스민다)
    const fine=fbm(u*16+s2,v*16+s1);                                  // 가장자리의 잔 톱니
    const k=j*N+i;
    T[k]=rr*(1+.26*(ang-.5)*2)*(1+.2*(paper-.5)*2)+.045*(fine-.5)*2;
    G[k]=nz(i*.9+s1,j*.9+s2)*.6+nz(i*.35,j*.35)*.4;                   // 입자
    let hp=0; for(const q of pools){ const d=Math.hypot(u-q.x,v-q.y); hp+=q.k*Math.exp(-d*d/(q.r*q.r)); } H[k]=hp*(.6+.8*fbm(u*3+s2,v*3));
  }
  const n=parseInt(hex.slice(1),16), base=[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];
  const L=.2126*base[0]+.7152*base[1]+.0722*base[2], body=base.map(c=>{ c=L+(c-L)*1.15; return c+(1-c)*.38; }), rim=base.map(c=>{ c=L+(c-L)*1.25; return c*.78; });
  const cv=document.createElement('canvas'); cv.width=cv.height=N; const x=cv.getContext('2d'), im=x.createImageData(N,N), d=im.data;
  const REACH=.5;
  // 젖은 단계 → 마르는 단계
  //  0~0.3초: 물방울이 톡 떨어진 둥근 웅덩이(진하고 반짝임)
  //  0.3~2.6초: 물이 먼저 퍼지고 색은 뒤따라 번짐(가장자리 흐림, 가운데 진함, 물 표면 반짝임)
  //  2.6~5.5초: 마르며 반짝임이 사라지고 전체가 밝아지며, 안료가 가장자리로 몰려 테두리가 또렷·진해짐, 입자가 드러남
  function frame(t,fade=1){
    t=t*P.spd;
    const RCH=REACH*P.reach, water=P.start+(RCH-P.start)*(1-Math.exp(-t/1.25));                 // 물이 닿은 범위
    const pig=water*(.62+.38*(1-Math.exp(-t/1.8)));                    // 색이 번진 범위(물보다 늦다)
    const w=1-Math.min(1,Math.max(0,(t-2.4)/3.0)), dry=1-w;            // 젖음 정도
    const soft=(.012+.07*w*Math.min(1,t/.9))*P.soft;                                              // 경계 흐림(젖을수록 흐림)
    const sh=Math.max(0,1-t/3.4)*1.25*P.gloss;                                       // 물 표면 반짝임
    for(let k=0;k<N*N;k++){ const o=k*4, tk=T[k];
      const bead=Math.max(0,1-t/P.beadT);
      if(tk>water+soft&&!(bead>0&&Math.hypot((k%N+.5)/N*2-1,(Math.floor(k/N)+.5)/N*2-1)<.075*P.beadR)){ d[o+3]=0; continue; }
      // 젖은 색: 가운데가 진하고 물 가장자리로 갈수록 옅게 번진다
      const q=tk/Math.max(.001,pig), wetA=(1.05*Math.exp(-q*q*1.2)+.25*(tk<pig?1:Math.exp(-(tk-pig)/(.02+.06*w))))*(1-.35*Math.min(1,tk/water));
      // 마른 색: 속은 맑고 고르게, 테두리에 안료가 몰림
      const inside=water-tk, rimBand=Math.exp(-Math.max(0,inside)/.02);
      const dryA=.3+H[k]*.3+rimBand*.6*P.rim;
      let amt=wetA*w+dryA*dry;
      amt*=1-.24*P.gran*(G[k]-.5)*2*dry;                                      // 마르면 입자가 드러난다
      const edgeA=Math.max(0,Math.min(1,(water+soft*.4-tk)/soft));        // 경계: 젖을수록 부드럽게, 마르면 또렷
      const m=Math.min(1,rimBand*dry*.9);
      let c0=body[0]+(rim[0]-body[0])*m, c1=body[1]+(rim[1]-body[1])*m, c2=body[2]+(rim[2]-body[2])*m;
      // 젖은 물감은 더 진하고 선명하다
      { const L=.2126*c0+.7152*c1+.0722*c2, sat=1+.45*w, dk=1-.08*w; c0=Math.max(0,Math.min(1,(L+(c0-L)*sat)*dk)); c1=Math.max(0,Math.min(1,(L+(c1-L)*sat)*dk)); c2=Math.max(0,Math.min(1,(L+(c2-L)*sat)*dk)); }
      // 물 표면 반짝임: 왼쪽 위에 넓고 부드러운 빛, 물 가장자리에 가는 밝은 테
      const i=k%N, j=(k-i)/N, u=(i+.5)/N*2-1, v=(j+.5)/N*2-1, hx=u+.12*water, hy=v+.12*water;
      const gloss=sh*(.22*Math.exp(-(hx*hx+hy*hy)/(.004+.12*water*water))*(1-bead*.5)+.12*Math.exp(-Math.abs(water-tk)/.01)*(v<0?1:.3));
      c0+= (1-c0)*gloss; c1+=(1-c1)*gloss; c2+=(1-c2)*gloss;
      d[o]=c0*255; d[o+1]=c1*255; d[o+2]=c2*255; d[o+3]=Math.max(0,Math.min(1,Math.max(amt,gloss*.6)*edgeA*fade))*255;
    }
    x.putImageData(im,0,0);
    // 첫 순간: 위에서 본 둥근 물감 방울이 종이에 맺혔다가 퍼지며 사라진다
    const bead=Math.max(0,1-t/P.beadT);
    if(bead>0){ const R0=N*.05*P.beadR*(1+.5*(1-bead)), c=`rgb(${body.map(v=>Math.round(Math.max(0,Math.min(1,v*.88))*255))})`;
      x.save(); x.globalAlpha=Math.min(1,bead*1.4)*fade; x.fillStyle=c; x.beginPath(); x.arc(N/2,N/2,R0,0,6.283); x.fill();
      x.globalAlpha=Math.min(1,.55*P.gloss)*bead*fade; x.fillStyle='#fff'; x.beginPath(); x.ellipse(N/2-R0*.32,N/2-R0*.32,R0*.28,R0*.2,-.6,0,6.283); x.fill(); x.restore(); }
    return cv;
  }
  return {frame};
}

const V=[{n:'기본',spd:1,gloss:1,start:0.07,reach:1,soft:1,rim:1,gran:1,beadR:0,beadT:.001},{n:'느리게 퍼짐',spd:0.6,gloss:1,start:0.07,reach:1,soft:1,rim:1,gran:1,beadR:0,beadT:.001},{n:'아주 느리게 · 크게',spd:0.4,gloss:1,start:0.05,reach:1.15,soft:1.2,rim:1,gran:1,beadR:0,beadT:.001},{n:'빠르게 퍼짐',spd:1.5,gloss:1,start:0.07,reach:1,soft:1,rim:1,gran:1,beadR:0,beadT:.001},{n:'젖은 경계 아주 흐리게',spd:0.7,gloss:1,start:0.07,reach:1,soft:2,rim:1,gran:1,beadR:0,beadT:.001},{n:'경계 또렷 · 테두리 진하게',spd:0.8,gloss:0.6,start:0.07,reach:1,soft:0.5,rim:1.8,gran:1,beadR:0,beadT:.001},{n:'테두리 없이 맑게',spd:0.8,gloss:1,start:0.07,reach:1,soft:1.3,rim:0.2,gran:0.4,beadR:0,beadT:.001},{n:'젖은 반짝임 강하게',spd:0.7,gloss:2.5,start:0.07,reach:1,soft:1.2,rim:1,gran:1,beadR:0,beadT:.001},{n:'입자 많이 · 마른 종이 느낌',spd:0.8,gloss:0.5,start:0.07,reach:1,soft:0.8,rim:1.3,gran:2.2,beadR:0,beadT:.001},{n:'한 점에서 크게 피어남',spd:0.55,gloss:1.4,start:0.02,reach:1.2,soft:1.4,rim:1.2,gran:1,beadR:0,beadT:.001}];
const COLS=['#E9A9C6','#F2946A','#96C46A','#79C3BC','#E5B04F','#A87A4E'];
const PX=Math.round(220*Math.min(2,devicePixelRatio||1)), N=Math.round(PX*.55);
let FAV=new Set(); try{ FAV=new Set(JSON.parse(localStorage.getItem('tc.wash2.fav')||'[]')); }catch(e){}
const g=document.getElementById('grid');
g.innerHTML=V.map((v,i)=>`<section class="card"><button class="star ${FAV.has(i)?'on':''}" data-i="${i}">${FAV.has(i)?'★':'☆'}</button><div class="no">${String(i+1).padStart(3,'0')}</div><canvas width="${PX}" height="${PX}"></canvas><h2>${v.n}</h2><p>속도 ${v.spd} · 경계 흐림 ${v.soft} · 테두리 ${v.rim}</p></section>`).join('');
const cards=[...g.querySelectorAll('.card')].map((el,i)=>({el,cv:el.querySelector('canvas'),v:V[i],i,cache:{}}));
function cycleLen(v){ return 6.5/v.spd+1.6; }
function draw(c,tt){ const L=cycleLen(c.v), cyc=Math.floor(tt/L), age=tt-cyc*L-.3, col=COLS[(cyc+c.i)%COLS.length];
  const w=c.cache[col]||(c.cache[col]=makeWash(N,col,(c.i+1)*7919+cyc%2*31,c.v));
  const x=c.cv.getContext('2d'); x.clearRect(0,0,PX,PX); if(age<0) return;
  const fade=1-Math.max(0,Math.min(1,(age-(L-1.4))/1.1)); x.imageSmoothingQuality='high'; const m=PX*.06; x.drawImage(w.frame(age,fade),m,m,PX-2*m,PX-2*m); }
const vis=new Set(); const io=new IntersectionObserver(es=>es.forEach(e=>{ const c=cards.find(x=>x.el===e.target); e.isIntersecting?vis.add(c):vis.delete(c); })); cards.forEach(c=>io.observe(c.el));
const t0=performance.now(); (function loop(now){ const tt=Math.max(0,(now-t0)/1000); vis.forEach(c=>draw(c,tt)); requestAnimationFrame(loop); })(t0);
window.drawAt=(i,tt)=>{ draw(cards[i],tt); const c=document.createElement('canvas'); c.width=c.height=PX; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,PX,PX); x.drawImage(cards[i].cv,0,0); return c.toDataURL('image/jpeg',.85); };
function names(){ return V.map((v,i)=>FAV.has(i)?String(i+1).padStart(3,'0')+' '+v.n:null).filter(Boolean); }
const box=document.createElement('div'); box.className='pickbox'; box.innerHTML='<b id="pc"></b><div class="pl" id="pl"></div><button id="cp">선택한 시안 복사하기</button><textarea id="ta" hidden readonly></textarea>'; document.body.appendChild(box);
function up(){ const L=names(); document.getElementById('pc').textContent=L.length?`☆ ${L.length}개 골랐어요`:'마음에 드는 시안의 ☆을 눌러 골라주세요'; document.getElementById('pl').textContent=L.join('\n'); document.getElementById('cp').disabled=!L.length; }
document.getElementById('cp').onclick=async()=>{ const t='홈 수채 번짐 - 내가 고른 시안\n'+names().join('\n'), ta=document.getElementById('ta'), b=document.getElementById('cp'); try{ await navigator.clipboard.writeText(t); b.textContent='복사했어요'; setTimeout(()=>b.textContent='선택한 시안 복사하기',2000); }catch(e){ ta.hidden=false; ta.value=t; ta.select(); } };
g.querySelectorAll('.star').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; FAV.has(i)?FAV.delete(i):FAV.add(i); try{ localStorage.setItem('tc.wash2.fav',JSON.stringify([...FAV])); }catch(e){} b.classList.toggle('on'); b.textContent=FAV.has(i)?'★':'☆'; up(); });
up(); window.READY=true;
</script></body></html>
