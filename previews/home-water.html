<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈 물번짐 시안</title>
<style>
:root{--bg:#EFEDE8;--fg:#141414;--sub:#6E6A62;--paper:#FAF8F4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:1400px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:24px;margin:0 0 6px}p.sub{margin:0 0 24px;color:var(--sub);line-height:1.6}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 20px}
.c{display:grid;gap:8px;align-content:start}
.ph{position:relative;width:100%;aspect-ratio:393/852;border-radius:22px;overflow:hidden;background:var(--paper);border:1px solid #D9D5CC;cursor:pointer}
.ph canvas,.ph img{position:absolute;inset:0;width:100%;height:100%}
.c b{font-size:15px}.c span{font-size:13px;color:var(--sub);line-height:1.5}
.one main{padding:0;max-width:none}.one h1,.one p.sub{display:none}.one .g{display:block}.one .c{display:none}.one .c.on{display:block}.one .ph{height:100dvh;width:auto;max-width:100vw;margin:0 auto;border-radius:0;border:0}.one .c.on b,.one .c.on span{display:none}
#back{display:none;position:fixed;left:12px;bottom:12px;z-index:5;background:#111;color:#fff;border:0;border-radius:20px;padding:8px 14px;font:inherit;font-size:13px}.one #back{display:block}
</style></head><body><main>
<h1>홈 물번짐 시안 10가지</h1>
<p class="sub">터치했을 때 색이 번지는 것과 똑같은 번짐(같은 셰이더)을, 색 없이 물만으로 저절로 번지게 했어요. 시안마다 번지는 자리·크기·빠르기·진하기가 달라요. 카드를 누르면 한 화면 크게 보기(폰에서 열면 실제 크기)예요.</p>
<div class="g" id="g"></div></main>
<button id="back" onclick="location.hash=''">← 전체 시안</button>
<script>
const HOME_FS=`precision highp float;
uniform vec2 res; uniform vec2 ctr; uniform float Rm; uniform float edg; uniform vec4 sp1; uniform vec2 sp2; uniform vec3 sp3; uniform float t; uniform vec3 col; uniform float seed; uniform float dry; uniform float mode;
float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7))+seed*13.7)*43758.5453); }
float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*n(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
void main(){
  vec2 uv=gl_FragCoord.xy/res.x, c=ctr;
  vec2 p=uv-c; float d=length(p), ang=atan(p.y,p.x);
  float paper=fbm(uv*38.)*.6+fbm(uv*140.)*.4;                 /* 종이 결 */
  float T=clamp(t,0.,1.), R=Rm*sqrt(T);                     /* Washburn: r ∝ √t */
  float irr=(fbm(uv*5.+seed)-.5)*.16+(fbm(uv*14.+seed*2.)-.5)*.05;   /* 섬유가 고르지 않아 앞쪽이 울퉁불퉁 */
  vec2 w=vec2(fbm(uv*4.+seed),fbm(uv*4.+seed+3.)); irr+=(fbm(uv*3.+w*2.5)-.5)*.14;   /* 흐름 결 */
  vec2 cs=vec2(cos(ang),sin(ang)); float lob=sp1.x*sin(ang*sp1.y+seed*1.7+T*1.6*sp3.y)+sp1.z*sin(ang*sp1.w-seed+T*2.4*sp3.y)+sp2.x*sin(ang*sp2.y+seed*2.3-T*1.9*sp3.y)+sp3.x*(fbm(cs*1.3+vec2(seed,T*1.1*sp3.y))-.5);   /* 방향마다 다른 빠르기 */
  float soft=.018*(1.+max(0.,1.6-edg)*2.2);   /* 경계를 연하게 할수록 가장자리도 깃털처럼 풀어진다 */
  float dd=d/max(.45,1.+lob*(1.-.35*T))+irr*(.7+.5*T)*(Rm/.62)*sp3.z;
  float pig=smoothstep(R,R-soft*1.5-.01,dd);
  float ring=exp(-pow((R-dd)/(.022+soft*.6),2.))*pig;          /* 가장자리에 색이 모임 */
  float core=1.-smoothstep(0.,R+.001,dd); float dens=pig*(.16+.74*pow(core,.85))+.35*edg*ring*(.4+.6*T);   /* 가운데가 가장 진하고 바깥으로 갈수록 옅게 */
  dens*=mix(1.,.45+1.2*paper,.12);
  dens*=dry;
  vec3 bg=vec3(.98,.972,.957)*(1.-.035*paper);
  if(mode<.5) gl_FragColor=vec4(bg,1.); else gl_FragColor=vec4(mix(vec3(1.),col,clamp(dens,0.,1.)),1.);
}`, HOME_SHAPE=[.04,3,.07,9,.06,13,.2,1,1.5];
const PW=393,PH=852, FX=196.5/PW, FY=(432.5+18)/PH;   // 손가락 자리(실제 홈 기준)
const WATER='#E4DED2', DEEP='#D6CEBF';
/* 시안: grow 번지는 시간(초) · hold 젖어 있는 시간 · dry 마르는 시간 · keep 마른 뒤 남는 정도 · R 크기(화면 폭 기준) · edg 가장자리 물때 · every 새 번짐 간격 · max 동시 개수 · at 자리 */
const V=[
 ['터치와 똑같이','터치 번짐과 같은 크기·빠르기(1.5초)로 화면 아무 곳에서 한 번씩 번지고 천천히 말라요.',{grow:1.5,hold:2.5,dry:3.5,R:1,edg:.4,every:7,max:1,at:'any'}],
 ['아주 느리게','같은 번짐이 6초에 걸쳐 아주 천천히 퍼져요. 가만히 보고 있어야 알아챌 만큼 차분해요.',{grow:6,hold:2,dry:5,R:1,edg:.4,every:12,max:1,at:'any'}],
 ['손가락 자리에서','손가락 아이콘 아래에서만 작게 번졌다 말라요. "여기를 누르면 이렇게 번져요"라는 예고.',{grow:1.5,hold:.8,dry:1.8,R:.5,edg:.4,every:4.4,max:1,at:'finger'}],
 ['작은 번짐 여러 개','작은 번짐이 여기저기서 엇갈려 피어나요. 빗방울이 종이에 떨어진 느낌.',{grow:1.2,hold:1.5,dry:3,R:.32,edg:.5,every:1.6,max:4,at:'any'}],
 ['겹쳐 쌓이는 자국','번진 물이 완전히 마르지 않고 옅은 자국으로 남아 겹겹이 쌓였다가, 오래된 것부터 사라져요.',{grow:1.8,hold:1.5,dry:3,keep:.35,life:16,R:.55,edg:.7,every:3.2,max:6,at:'any'}],
 ['가장자리에서','화면 모서리·가장자리에서 안쪽으로 번져 들어와요. 가운데 글자 주변은 비교적 깨끗해요.',{grow:3,hold:2,dry:4,R:.9,edg:.5,every:5,max:2,at:'edge'}],
 ['물때 테두리 강조','번짐 가장자리에 물이 모여 마른 물때 선이 또렷해요. 수채화 종이 느낌이 가장 강해요.',{grow:2,hold:2,dry:4,R:.8,edg:1.8,every:6,max:1,at:'any'}],
 ['조금 더 진한 물','1번과 같은 번짐을 조금 더 진한 물빛으로. 전시장 큰 화면에서 멀리서도 보이게.',{grow:1.5,hold:2.5,dry:3.5,R:1,edg:.5,every:7,max:1,at:'any',col:DEEP}],
 ['이어 번지기','하나가 마를 즈음 바로 옆에서 다음 번짐이 시작돼, 물이 화면을 천천히 떠도는 것처럼 이어져요.',{grow:2.5,hold:1,dry:3.5,R:.7,edg:.5,every:3.6,max:2,at:'walk'}],
 ['화면 가득 젖음','터치했을 때처럼 화면 전체가 아주 옅게 젖었다가 마르기를 반복해요.',{grow:2.5,hold:2,dry:4,R:1.7,edg:.3,every:10,max:1,at:'center'}],
];
const g=document.getElementById('g');
V.forEach(([t,d],i)=>{ const c=document.createElement('div'); c.className='c'; c.dataset.i=i+1;
  c.innerHTML=`<div class="ph"><canvas></canvas><img src="home-water/ui.png" alt=""></div><b>${i+1}. ${t}</b><span>${d}</span>`;
  c.querySelector('.ph').onclick=()=>{ location.hash=location.hash==='#'+(i+1)?'':'#'+(i+1); }; g.appendChild(c); });
function route(){ const n=+location.hash.slice(1); document.body.classList.toggle('one',!!n); document.querySelectorAll('.c').forEach(c=>c.classList.toggle('on',+c.dataset.i===n)); fit(); }
addEventListener('hashchange',route);
const r=(a,b)=>a+Math.random()*(b-a), cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function mk(cv){ const gl=cv.getContext('webgl',{antialias:false}); if(!gl) return null;
  const sh=(t,s)=>{ const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o); if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o)); return o; };
  const pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}')); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,HOME_FS)); gl.linkProgram(pr); gl.useProgram(pr);
  const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW); const al=gl.getAttribLocation(pr,'a'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
  const U={}; ['res','ctr','Rm','edg','sp1','sp2','sp3','t','col','seed','dry','mode'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
  const shape=()=>{ const B=HOME_SHAPE; return {seed:r(0,40),sp1:[B[0]*r(.5,1.6),Math.max(1,Math.round(B[1]+r(-1.4,1.4))),B[2]*r(.5,1.6),Math.max(2,Math.round(B[3]+r(-2.4,2.4)))],sp2:[B[4]*r(.5,1.6),Math.max(3,Math.round(B[5]+r(-2.4,2.4)))],sp3:[B[6]*r(.6,1.6),B[7]*r(.7,1.6),B[8]*r(.8,1.3)]}; };
  return { shape, frame(bl){ const W=cv.width,H=cv.height; gl.viewport(0,0,W,H); gl.uniform2f(U.res,W,H);
    gl.disable(gl.BLEND); gl.uniform1f(U.mode,0); gl.uniform1f(U.t,0); gl.uniform1f(U.dry,0); gl.uniform1f(U.seed,7); gl.uniform2f(U.ctr,.5,.5); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);   // 종이
    gl.enable(gl.BLEND); gl.blendFunc(gl.DST_COLOR,gl.ZERO); gl.uniform1f(U.mode,1);   // 물 한 겹씩 곱하기
    for(const o of bl){ const s=o.s; gl.uniform1f(U.seed,s.seed); gl.uniform4f(U.sp1,...s.sp1); gl.uniform2f(U.sp2,...s.sp2); gl.uniform3f(U.sp3,...s.sp3);
      gl.uniform2f(U.ctr,o.x/PW,(PH-o.y)/PH*H/W); gl.uniform1f(U.Rm,o.R); gl.uniform1f(U.edg,o.edg); gl.uniform1f(U.t,o.t); gl.uniform1f(U.dry,o.dry); gl.uniform3fv(U.col,[1,3,5].map(i=>parseInt(o.col.slice(i,i+2),16)/255)); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); } } }; }
function spot(p,prev){ if(p.at==='finger') return [PW*FX,PH*FY]; if(p.at==='center') return [PW*.5,PH*.48];
  if(p.at==='edge'){ const k=Math.floor(r(0,4)); return k===0?[r(0,PW),r(40,90)]:k===1?[r(0,PW),PH-r(120,170)]:k===2?[r(-30,10),r(100,700)]:[PW+r(-10,30),r(100,700)]; }
  if(p.at==='walk'&&prev){ const a=r(0,6.28); return [cl(prev[0]+Math.cos(a)*130,30,PW-30),cl(prev[1]+Math.sin(a)*160,120,PH-160)]; }
  return [r(40,PW-40),r(120,PH-160)]; }
const runs=[...document.querySelectorAll('.c')].map((c,i)=>{ const cv=c.querySelector('canvas'); return {c,cv,p:V[i][2],G:mk(cv),bl:[],next:i*.4,last:null}; });
function fit(){ runs.forEach(o=>{ const bb=o.cv.getBoundingClientRect(), k=Math.min(1.5,devicePixelRatio||1,Math.sqrt(450000/Math.max(1,bb.width*bb.height))); o.cv.width=Math.max(1,Math.round(bb.width*k)); o.cv.height=Math.max(1,Math.round(bb.height*k)); }); }
addEventListener('resize',fit);
const T0=performance.now();
function loop(now){ const t=(now-T0)/1000, one=document.body.classList.contains('one');
  for(const o of runs){ const p=o.p; if(!o.G) continue;
    if(t>=o.next&&o.bl.filter(b=>!b.dead).length<p.max){ const [x,y]=spot(p,o.last); o.last=[x,y]; o.bl.push({x,y,t0:t,s:o.G.shape()}); o.next=t+p.every*r(.8,1.2); }
    const L=[]; o.bl=o.bl.filter(b=>{ const a=t-b.t0, gT=cl(a/p.grow), d=cl((a-p.grow-p.hold)/p.dry); let dry=1-d*(1-(p.keep||0));
      if(p.keep){ const old=a-p.grow-p.hold-p.dry; if(old>0){ b.dead=true; dry*=cl(1-(old-(p.life-p.grow-p.hold-p.dry))/3); } if(dry<=0) return false; }
      else if(d>=1) return false;
      L.push({x:b.x,y:b.y,R:p.R,edg:p.edg,t:gT,dry,col:p.col||WATER,s:b.s}); return true; });
    if(one&&!o.c.classList.contains('on')) continue; o.G.frame(L); }
  requestAnimationFrame(loop); }
route(); requestAnimationFrame(loop);
</script></body></html>
