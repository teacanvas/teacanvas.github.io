<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈 물번짐 시안</title>
<style>
:root{--bg:#EFEDE8;--fg:#141414;--sub:#6E6A62;--paper:#FAF8F4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:1400px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:24px;margin:0 0 6px}p.sub{margin:0 0 24px;color:var(--sub);line-height:1.6}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 20px}
.c{display:grid;gap:8px}
.ph{position:relative;width:100%;aspect-ratio:393/852;border-radius:22px;overflow:hidden;background:var(--paper);border:1px solid #D9D5CC;cursor:pointer}
.ph canvas,.ph img{position:absolute;inset:0;width:100%;height:100%}
.c b{font-size:15px}.c span{font-size:13px;color:var(--sub);line-height:1.5}
.one main{padding:0;max-width:none}.one h1,.one p.sub{display:none}.one .g{display:block}.one .c{display:none}.one .c.on{display:block}.one .ph{height:100dvh;width:auto;max-width:100vw;margin:0 auto;border-radius:0;border:0}.one .c.on b,.one .c.on span{display:none}
#back{display:none;position:fixed;left:12px;bottom:12px;z-index:5;background:#111;color:#fff;border:0;border-radius:20px;padding:8px 14px;font:inherit;font-size:13px}.one #back{display:block}
</style></head><body><main>
<h1>홈 물번짐 시안 10가지</h1>
<p class="sub">색 없이 물만 번지는 배경입니다. 실제 홈 화면 위에 겹쳐서 움직이는 그대로 보여 드려요. 카드를 누르면 한 화면 크게 보기(폰에서 열면 실제 크기)로 바뀌어요.</p>
<div class="g" id="g"></div></main>
<button id="back" onclick="location.hash=''">← 전체 시안</button>
<script>
const V=[
 ['스며드는 물자국','큰 물자국 2~3개가 천천히 젖었다가 마르는 것을 반복해요. 테두리 없이 가장 은은해요.'],
 ['물 테두리','물이 퍼지면서 가장자리에 얇은 물때 선이 생기고, 마르면서 흐려져요. 수채화 종이 느낌이 가장 강해요.'],
 ['빗방울','작은 물방울이 화면 여기저기에 톡톡 떨어져 번졌다가 말라요. 가장 생동감 있어요.'],
 ['손가락 아래 물방울','손가락 아이콘 아래에서만 물이 번졌다 마르기를 반복해요. 터치를 유도하는 힌트 역할.'],
 ['가장자리에서 스며듦','화면 모서리·가장자리에서 물이 안쪽으로 스며들어요. 가운데 글자는 깨끗하게 유지돼요.'],
 ['흘러내리는 물줄기','위에서 물이 천천히 흘러내리며 자국을 남겨요. 우린 찻물이 흐르는 느낌.'],
 ['쌓이는 마른 자국','번진 물이 마르며 꽃양배추 모양 물때를 남기고, 자국이 겹겹이 쌓였다가 오래된 것부터 사라져요.'],
 ['물결 빛','종이 위에 얕은 물이 고인 것처럼 빛 무늬가 느리게 일렁여요. 번짐보다 수면 느낌.'],
 ['젖은 종이 결','물이 닿은 곳만 종이 섬유 결이 드러났다가 마르면 사라져요. 가까이서 볼 때 가장 섬세해요.'],
 ['잔잔한 파문','손가락 자리에서 동심원 파문이 아주 옅게 퍼져 나가요. 찻잔 수면을 닮았어요.'],
];
const PW=393,PH=852,FX=196.5/PW,FY=432.5/PH;   // 손가락 위치(실제 홈 기준)
const g=document.getElementById('g');
V.forEach(([t,d],i)=>{ const c=document.createElement('div'); c.className='c'; c.dataset.i=i+1;
  c.innerHTML=`<div class="ph"><canvas></canvas><img src="home-water/ui.png" alt=""></div><b>${i+1}. ${t}</b><span>${d}</span>`;
  c.querySelector('.ph').onclick=()=>{ location.hash=location.hash==='#'+(i+1)?'':'#'+(i+1); }; g.appendChild(c); });
function route(){ const n=+location.hash.slice(1); document.body.classList.toggle('one',!!n); document.querySelectorAll('.c').forEach(c=>c.classList.toggle('on',+c.dataset.i===n)); fit(); }
addEventListener('hashchange',route);
/* 공통 도구 */
const R=(a,b)=>a+Math.random()*(b-a), cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), ease=x=>1-Math.pow(1-x,3);
const TONE='118,104,84';
function shape(n=7){ const h=[]; for(let k=2;k<2+n;k++) h.push([k,R(.02,.11)/Math.sqrt(k-1),R(0,6.28),R(-.15,.15)]); return h; }
function path(x,cx,cy,r,h,t,sy=1){ x.beginPath(); for(let j=0;j<=72;j++){ const a=j/72*6.283; let q=1; for(const [k,am,ph,sp] of h) q+=am*Math.sin(k*a+ph+sp*t); const px=cx+Math.cos(a)*r*q, py=cy+Math.sin(a)*r*q*sy; j?x.lineTo(px,py):x.moveTo(px,py); } x.closePath(); }
/* 물자국 하나: 안은 옅게 젖고, 가장자리는 물때가 진하게 */
function wet(x,b,t,o={}){ const age=t-b.t0; if(age<0) return true; const gr=ease(cl(age/b.grow)), dry=cl((age-b.grow-b.hold)/b.dry), r=b.R*(.25+.75*gr);
  if(dry>=1&&!o.keep) return false; const A=(1-dry), s=b.s||1;
  path(x,b.x,b.y,r,b.h,age,b.sy||1);
  const gd=x.createRadialGradient(b.x,b.y,0,b.x,b.y,r*1.1); gd.addColorStop(0,`rgba(${TONE},${b.a*.35*A*s})`); gd.addColorStop(.75,`rgba(${TONE},${b.a*.6*A*s})`); gd.addColorStop(1,`rgba(${TONE},${b.a*A*s})`);
  x.fillStyle=gd; x.fill();
  if(b.rim){ const ra=b.rim*(o.keep?Math.max(A,.35)*s:A*s); x.lineWidth=b.rw||1.2; x.strokeStyle=`rgba(${TONE},${ra})`; x.stroke(); }
  if(b.sheen&&A>0){ const sg=x.createRadialGradient(b.x-r*.3,b.y-r*.35,0,b.x-r*.3,b.y-r*.35,r*.7); sg.addColorStop(0,`rgba(255,255,255,${.35*A*(1-gr*.4)})`); sg.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=sg; x.fill(); }
  return true; }
/* 종이 결(섬유) 한 장 미리 */
const FIB=(()=>{ const c=document.createElement('canvas'); c.width=PW; c.height=PH; const x=c.getContext('2d'); x.lineCap='round';
  for(let i=0;i<4200;i++){ const px=R(0,PW),py=R(0,PH),a=R(0,6.28),l=R(3,14); x.strokeStyle=`rgba(${TONE},${R(.35,.8)})`; x.lineWidth=R(.4,1); x.beginPath(); x.moveTo(px,py); x.quadraticCurveTo(px+Math.cos(a+.6)*l*.5,py+Math.sin(a+.6)*l*.5,px+Math.cos(a)*l,py+Math.sin(a)*l); x.stroke(); }
  return c; })();
/* 시안별 장면 */
const MK=[
 ()=>{ let B=[]; return (x,t)=>{ if(B.filter(b=>t-b.t0<b.grow+b.hold+b.dry).length<3&&Math.random()<.02) B.push({x:R(40,350),y:R(150,700),R:R(90,170),h:shape(),t0:t,grow:5,hold:3,dry:5,a:.07});
   B=B.filter(b=>wet(x,b,t)); }; },
 ()=>{ let B=[]; return (x,t)=>{ if(B.length<3&&Math.random()<.015) B.push({x:R(50,340),y:R(150,700),R:R(70,140),h:shape(8),t0:t,grow:4,hold:2.5,dry:4,a:.045,rim:.22,rw:1.3});
   B=B.filter(b=>wet(x,b,t)); }; },
 ()=>{ let B=[]; return (x,t)=>{ if(Math.random()<.035&&B.length<8) B.push({x:R(20,373),y:R(120,740),R:R(14,40),h:shape(5),t0:t,grow:.9,hold:1,dry:2.5,a:.08,rim:.18,rw:1,sheen:1});
   B=B.filter(b=>wet(x,b,t)); }; },
 ()=>{ let B=[], last=-9; return (x,t)=>{ if(t-last>3.2){ last=t; B.push({x:PW*FX+R(-6,6),y:PH*FY+18,R:R(70,90),h:shape(6),t0:t,grow:1.6,hold:.6,dry:2.6,a:.08,rim:.15,sheen:1}); }
   B=B.filter(b=>wet(x,b,t)); }; },
 ()=>{ let B=[]; const edge=()=>{ const s=Math.floor(R(0,4)); return s===0?[R(0,PW),70]:s===1?[R(0,PW),PH-150]:s===2?[0,R(80,700)]:[PW,R(80,700)]; };
   return (x,t)=>{ if(B.length<4&&Math.random()<.02){ const [px,py]=edge(); B.push({x:px,y:py,R:R(90,170),h:shape(),t0:t,grow:6,hold:3,dry:5,a:.08,rim:.12}); }
   B=B.filter(b=>wet(x,b,t)); }; },
 ()=>{ let S=[]; return (x,t)=>{ if(S.length<3&&Math.random()<.008) S.push({x:R(40,350),t0:t,w:R(14,26),sp:R(30,48),ph:R(0,6),pts:[]});
   S=S.filter(s=>{ const age=t-s.t0, head=60+age*s.sp; if(head<PH-150){ s.pts.push([s.x+Math.sin(head/55+s.ph)*10,head,t]); }
     const life=9; s.pts=s.pts.filter(q=>t-q[2]<life); if(s.pts.length<2) return head<PH-150;
     x.save(); x.filter='blur(2.5px)'; x.lineCap='round'; x.lineJoin='round';
     for(let k=1;k<s.pts.length;k++){ const [x0,y0,t0]=s.pts[k-1],[x1,y1]=s.pts[k], f=1-(t-t0)/life, wv=s.w*(.6+.4*Math.min(1,(t-t0)*1.5));
       x.strokeStyle=`rgba(${TONE},${.07*f})`; x.lineWidth=wv; x.beginPath(); x.moveTo(x0,y0); x.lineTo(x1,y1); x.stroke(); }
     const [hx,hy]=s.pts[s.pts.length-1]; if(head<PH-150){ x.fillStyle=`rgba(${TONE},.09)`; x.beginPath(); x.ellipse(hx,hy+s.w*.2,s.w*.62,s.w*.75,0,0,6.283); x.fill(); }
     x.restore(); return true; }); }; },
 ()=>{ let B=[]; return (x,t)=>{ if(B.length<9&&Math.random()<.012) B.push({x:R(40,350),y:R(140,700),R:R(45,110),h:shape(10),t0:t,grow:3,hold:1.5,dry:3,a:.05,rim:.2,rw:1.1,life:R(14,22)});
   B=B.filter(b=>{ const old=t-b.t0-b.grow-b.hold-b.dry; b.s=old>0?cl(1-(old-b.life+4)/4):1; if(b.s<=0) return false; wet(x,b,t,{keep:1}); return true; }); }; },
 ()=>{ const w=98,h=213, c=document.createElement('canvas'); c.width=w; c.height=h; const cx=c.getContext('2d'), im=cx.createImageData(w,h);
   return (x,t)=>{ for(let j=0;j<h;j++) for(let i=0;i<w;i++){ const u=i/w*6,v=j/h*13; let s=Math.sin(u*1.7+t*.5+Math.sin(v*.9+t*.3)*1.6)+Math.sin(v*1.3-t*.4+Math.sin(u*1.1-t*.2)*1.8); s=Math.pow(Math.max(0,1-Math.abs(s)*.9),3); const k=(j*w+i)*4; im.data[k]=255;im.data[k+1]=255;im.data[k+2]=255;im.data[k+3]=s*120; }
     cx.putImageData(im,0,0); x.globalAlpha=1; x.fillStyle=`rgba(${TONE},.035)`; x.fillRect(0,0,PW,PH); x.imageSmoothingEnabled=true; x.drawImage(c,0,0,PW,PH); }; },
 ()=>{ let B=[]; const m=document.createElement('canvas'); m.width=PW; m.height=PH; const mx=m.getContext('2d');
   return (x,t)=>{ if(B.length<3&&Math.random()<.015) B.push({x:R(50,340),y:R(150,700),R:R(80,150),h:shape(),t0:t,grow:4,hold:3,dry:4,a:.05,rim:.1});
     mx.clearRect(0,0,PW,PH); mx.globalCompositeOperation='source-over'; B=B.filter(b=>wet(mx,b,t)); x.drawImage(m,0,0);
     mx.globalCompositeOperation='source-in'; mx.globalAlpha=1; mx.drawImage(FIB,0,0); mx.drawImage(FIB,0,0); x.globalAlpha=1; x.drawImage(m,0,0); x.drawImage(m,0,0); }; },
 ()=>{ let W=[], last=-9; const cx=PW*FX, cy=PH*FY+18; return (x,t)=>{ if(t-last>1.6){ last=t; W.push(t); }
   W=W.filter(t0=>{ const a=t-t0; if(a>6) return false; const r=12+a*42, al=.2*(1-a/6); x.lineWidth=1.2; x.strokeStyle=`rgba(${TONE},${al})`; x.beginPath(); x.ellipse(cx,cy,r,r*.92,0,0,6.283); x.stroke();
     x.strokeStyle=`rgba(255,255,255,${al*1.6})`; x.beginPath(); x.ellipse(cx,cy+1.5,r,r*.92,0,0,6.283); x.stroke(); return true; }); }; },
];
const runs=[...document.querySelectorAll('.c')].map((c,i)=>({cv:c.querySelector('canvas'),f:MK[i](),c}));
function fit(){ runs.forEach(r=>{ const bb=r.cv.getBoundingClientRect(), s=Math.min(2,devicePixelRatio||1); r.cv.width=Math.max(1,Math.round(bb.width*s)); r.cv.height=Math.max(1,Math.round(bb.height*s)); }); }
addEventListener('resize',fit);
const T0=performance.now();
function frame(now){ const t=(now-T0)/1000, one=document.body.classList.contains('one');
  for(const r of runs){ if(one&&!r.c.classList.contains('on')) continue; const x=r.cv.getContext('2d'); x.setTransform(1,0,0,1,0,0); x.globalAlpha=1; x.fillStyle='#FAF8F4'; x.fillRect(0,0,r.cv.width,r.cv.height); x.setTransform(r.cv.width/PW,0,0,r.cv.height/PH,0,0); r.f(x,t); }
  requestAnimationFrame(frame); }
route(); requestAnimationFrame(frame);
/* 처음부터 몇 초 진행된 모습으로: 미리 돌려 둔다 */
</script></body></html>
