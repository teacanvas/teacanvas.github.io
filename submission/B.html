<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TEA CANVAS">
<title>TEA CANVAS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --white:#FFFFFF; /* 회색 규칙: 면(상자·입력창)=g0, 그 위 칩·누름·선=g1 */ --g1:#ECECEC; --g0:#F3F3F3; --g2:#737373; --black:#000000;
  --ink:#111111; --dark:#333333; --line:#E5E5E5;
  --tip:#F3F3F3; --r-card:14px; --r-btn:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{word-break:keep-all;overflow-wrap:anywhere;font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;background:#F2F2F0;color:var(--ink);line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow:hidden}
/* ---------- exhibition stage ---------- */
.stage{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--gap,40px);padding:24px 16px}
.ex-top{text-align:center}
.ex-top .ex-logo{font-size:var(--logo,30px);font-weight:800;letter-spacing:.06em}
.ex-top .ex-line{font-size:var(--line,17px);color:#555;margin-top:8px;letter-spacing:-.01em}
.ex-bottom{display:flex;align-items:center;gap:10px;font-size:var(--hint,15px);color:#737373}
.ex-bottom i{width:8px;height:8px;border-radius:50%;background:#111;animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.phone-wrap{position:relative;flex-shrink:0}
.phone-wrap .phone{position:absolute;left:0;top:0;transform-origin:0 0}
html{color-scheme:light only;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.view,.sheet{overscroll-behavior:contain}
input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none}
textarea{resize:none}
/* ---------- phone frame ---------- */
/* iPhone 16 · 393 × 852 */
.phone{width:393px;height:852px;background:#fff;border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column;
  box-shadow:0 0 0 9px #161616;flex-shrink:0}
.appbar{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 20px;margin-top:6px}
.logo{font-size:16px;font-weight:800;letter-spacing:.2px}
.bell{width:32px;height:32px;display:grid;place-items:center}
.view{flex:1;overflow-y:auto;position:relative;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.nav{height:60px;flex-shrink:0;border-top:1px solid var(--line);display:flex;padding-bottom:4px}
.nav button{flex:1;font-size:15px;font-weight:700;color:#A3A3A3}
.nav button.on{color:#000}
/* ---------- layout ---------- */
.scr{padding:4px 22px 28px;min-height:100%;display:flex;flex-direction:column}
.fade{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.spacer{flex:1;min-height:16px}
.center{text-align:center}
.stepbar{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:10px}
.back{width:30px;height:30px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;flex-shrink:0}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:3px;background:#DADADA;transition:width .4s,background .4s}
.dots i.done{background:#333}
.dots i.on{background:#333;width:18px}
.stepbar .mid{display:flex;align-items:center;gap:10px}
.stepbar .quit{font-size:13px;color:var(--g2);padding:6px 2px 6px 10px}.stepbar .quit:hover{color:#111}
.resume{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 22px 10px;background:var(--g0);border-radius:var(--r-card);padding:0 6px 0 16px;height:46px;font-size:13.5px}
.resume>button:first-child{flex:1;text-align:left;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;height:100%}
.resume .x{font-size:12.5px;color:var(--g2);padding:8px 10px}
h1.t{font-size:20px;font-weight:700;text-align:center;letter-spacing:-.3px}
.sub{font-size:13px;color:var(--g2);text-align:center;margin-top:6px}
h3.sec{font-size:15px;font-weight:700;margin:22px 0 10px}
.muted{color:var(--g2)}
.breath{animation:breath 4s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.035)}}
.btn{display:block;width:100%;height:52px;border-radius:var(--r-btn);background:#000;color:#fff;font-size:15.5px;font-weight:700;flex-shrink:0;transition:background .2s,transform .15s}
.btn:hover{background:#262626}
.btn:active{transform:scale(.985)}
.btn.dark{background:var(--dark)}
.btn.dark:hover{background:#444}
.btn.line{background:#fff;color:#111;border:1px solid #CFCFCF}
.btn.line:hover{background:var(--g0)}
.btn:disabled{background:#CFCFCF}
.btn + .btn{margin-top:12px}
.link{display:block;margin:14px auto 0;font-size:13.5px;color:var(--g2);padding:4px 8px}
.link.u{text-decoration:underline;text-underline-offset:3px}
.card{background:var(--g0);border-radius:var(--r-card);padding:14px 16px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;height:31px;padding:0 13px;border-radius:16px;background:var(--g1);font-size:13px;white-space:nowrap;transition:background .15s}
.chip.w{background:#fff}
.chip.sel{background:#000;color:#fff}
.tip{background:var(--tip);border-radius:var(--r-card);padding:11px 14px;font-size:12.5px;color:#666;margin-top:14px}
.tip b{color:#111;margin-right:8px}
.seg{display:flex;background:var(--g0);border-radius:20px;width:216px;margin:6px auto 16px;padding:0}
.seg button{flex:1;height:36px;border-radius:18px;font-size:13.5px;font-weight:600;color:#222}
.seg button.on{background:#000;color:#fff}
.seg.wide{width:100%}
.last{display:flex;gap:16px;align-items:center;width:100%;text-align:left;border:1px solid #000;padding:14px 16px}
.last b{font-size:13.5px;font-weight:600;display:block;margin-bottom:6px}
.last span{display:block;font-size:13px}
/* ---------- inputs ---------- */
.ask{font-size:21px;font-weight:500;line-height:1.55;margin:30px 8px 0}
.pill-in{display:block;width:100%;height:48px;border:1px solid #CFCFCF;border-radius:24px;text-align:center;font-size:15px;font-weight:600;margin-top:12px}
.pill-in::placeholder{color:#222}
.pill-in:focus{border-color:#000}
.pill-in:focus::placeholder{color:#BDBDBD}
.cam{display:block;margin:14px auto 0;padding:6px}
.hint{font-size:12px;color:#9A9A9A;text-align:center;margin-top:4px}
.field{margin-top:18px}
.cmtrow{display:flex;gap:8px;margin-top:10px}.cmtrow .box{flex:1;min-width:0;display:flex;align-items:center;background:var(--g0);border-radius:12px;padding:0 16px;height:50px}.cmtrow input{flex:1;min-width:0;font-size:15px}
.addphoto.sq{width:50px;height:50px;flex-shrink:0;padding:0;border-radius:12px}.addphoto.sq svg{width:22px;height:22px}.addphoto.sq img{width:100%;height:100%;border-radius:11px;object-fit:cover}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.field .box{display:flex;align-items:center;background:var(--g0);border-radius:12px;padding:0 16px;height:50px}
.field .box input{flex:1;min-width:0;font-size:15px}
.field .box span{color:var(--g2);font-size:14px}

.own{text-align:center;margin:6px 16px 14px}

.kept-btn{align-self:flex-end;background:none;border:0;padding:2px 0;cursor:pointer;font:inherit}.kept-btn u{text-decoration:none;color:#777;border-bottom:1px solid #C9C9C9;margin-left:4px}
.fl-edit{align-self:stretch;background:#fff;border:1px solid var(--g1);border-radius:var(--r-card);padding:12px 12px 10px;animation:fade .3s ease}
.fl-edit p{font-size:12.5px;color:var(--g2);margin-bottom:8px}.fl-edit .chip i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}

.msg-img{align-self:flex-end;max-width:62%;border-radius:16px;display:block}

.chips.end{justify-content:flex-end}
.gcard{align-self:flex-start;width:88%;background:#fff;border:1px solid var(--g1);border-radius:var(--r-card);padding:14px 16px;font-size:13px;animation:fade .3s ease}
.gcard b{font-size:14.5px}.gcard dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:10px}
.gcard dt{color:var(--g2)}.gcard dd{font-weight:600}.gcard dd small{display:block;font-weight:400;color:var(--g2);font-size:12px}
.gcard .gtip{margin-top:10px;font-size:12px;color:#666;background:var(--g0);border-radius:10px;padding:8px 10px}
.scr-chat .stepbar{position:sticky;top:0;z-index:4;background:#fff;margin-bottom:0}
.tearow.pin{position:sticky;top:44px;z-index:3;background:#fff;padding:6px 0 10px;margin:8px 0 6px;border-bottom:1px solid var(--g0)}
.tearow.pin b{max-width:230px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tearow .gsum{display:block;font-size:12px;color:var(--g2)}
.chips.more .chip.done{color:#999}
.chip.dark{background:#111;color:#fff}
.msg.sys{align-self:center;background:none;font-size:12px;color:var(--g2);padding:2px}
.chatfoot{position:sticky;bottom:0;background:#fff;padding:10px 0 4px;margin-top:auto}
.inrow{display:flex;align-items:center;background:var(--g0);border-radius:26px;padding:5px 5px 5px 18px;margin-bottom:10px}

.send{width:38px;height:38px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;flex-shrink:0}
.vstate{font-size:12.5px;color:#9A9A9A;text-align:center;margin-top:2px;min-height:18px}
.heard{font-size:14px;text-align:center;margin-top:14px;min-height:22px}
/* ---------- loaders ---------- */
.loader{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-bottom:40px}

.opt .ic{width:24px;display:grid;place-items:center;flex-shrink:0}

.opt .chev{color:#888;font-size:18px}
.cmp{display:flex;gap:12px;align-items:center;background:var(--g0);border-radius:var(--r-card);padding:14px 14px;margin-top:10px}

/* ---------- done / tag ---------- */
.wave{height:120px;position:relative;margin:4px 0 10px;overflow:hidden}

.rowlink{display:flex;align-items:center;gap:14px;width:100%;background:var(--g0);border-radius:var(--r-card);padding:16px 18px;margin-top:12px;font-size:15px;font-weight:700;text-align:left}

.tagid.ph{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:4px}.tagid.ph>div{text-align:center}.tagid.ph .nm{margin-top:0}

.cmtrow .box{position:relative}.cmtrow .box input{padding-right:46px}.cmtn{position:absolute;right:12px;bottom:6px;font-size:10.5px;color:#9A9A9A;pointer-events:none}
.btn:focus-visible,.bigbtn:focus-visible,.chip.dark:focus-visible,#sendBtn:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 5px #111}
.typelist{display:flex;flex-direction:column;gap:7px;margin-top:16px}.typelist button{display:flex;align-items:center;gap:12px;background:var(--g0);border:0;border-radius:12px;padding:10px 14px;font:inherit;color:inherit;cursor:pointer;text-align:left}
.typelist .tb{width:34px;height:34px;flex:none;display:grid;place-items:center}.typelist .tb svg{width:100%;height:100%}.typelist b{font-weight:600}.typelist .muted{margin-left:auto}.typelist .chev{color:#AAA}
.tagcard .nm{font-size:18px;font-weight:700;margin-top:4px}

.tagcard .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:16px}
.tagcard .line{font-size:13.5px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
/* ---------- canvas ---------- */
.canvas{position:relative;width:100%;aspect-ratio:1/1;background:#FCFBFA;border:1px solid #BDBDBD;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.canvas.bare{background:none;border:0}
.canvas .ax{position:absolute;background:var(--g1)}
.canvas.bare .ax{background:#555}
.canvas .ax.h{left:0;right:0;top:50%;height:1px}
.canvas .ax.v{top:0;bottom:0;left:50%;width:1px}
.drop{position:absolute;border-radius:50%;transform:translate(-50%,-50%);filter:blur(1.5px);pointer-events:none;transition:width .05s,height .05s}
.cap{font-size:13px;color:var(--g2);text-align:center;margin-top:10px}
.photo.real{display:block;height:auto;background:none;position:relative;margin:0}

.photo.real img{display:block;width:100%;height:150px;object-fit:cover;border-radius:2px}
.photo.real figcaption{font-size:10px;color:#9A9A9A;margin-top:3px;text-align:right}
.stars{display:flex;gap:6px;justify-content:center;margin:6px 0}
.stars button{color:#DADADA;line-height:0;padding:2px}.stars button .leaf{width:28px;height:28px}
.stars button.on{color:#6E7F4A}
.leaves{display:inline-flex;gap:1px;color:#6E7F4A;vertical-align:-3px}.leaves .leaf{width:14px;height:14px}
.photo{display:flex;align-items:center;justify-content:center;height:120px;border-radius:2px;font-size:12.5px;color:#6b5a3a;
  background:linear-gradient(135deg,#d9c3a1,#b98b56 40%,#e9dcc6 70%,#c7a77c);position:relative;overflow:hidden}
.photo::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#c98a3d 0 45%,#f4ead9 47% 60%,transparent 62%);left:38%;top:22%}
.photo span{position:absolute;left:10px;bottom:6px;background:rgba(255,255,255,.75);padding:1px 7px;border-radius:8px;z-index:1}
.pref{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 2px;border-bottom:1px solid var(--g0)}.pref span{display:flex;flex-direction:column}
.pref b{font-size:14.5px}.pref small{font-size:12px;color:var(--g2);margin-top:2px}.pref input[type=checkbox]{width:22px;height:22px;accent-color:#111;flex-shrink:0}
.pref.col{flex-direction:column;align-items:stretch;border:0}
.addphoto img{width:34px;height:34px;object-fit:cover;border-radius:6px}

/* ---------- archive ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px 10px;margin-top:10px}
.detail{background:var(--g0);border-radius:var(--r-card);padding:18px 18px 14px;margin-top:10px}
.dhead{display:flex;gap:18px;align-items:center;margin-bottom:16px}
.det-drop{width:300px;max-width:100%;margin:-10px auto -10px}.det-drop canvas{display:block;width:100%;aspect-ratio:1.3}
.det-en{margin:0 12px 10px}

.dhead div{font-size:13.5px;line-height:1.7}
.dcomment{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-top:12px}
.memo{background:var(--g0);border-radius:var(--r-card);padding:16px 18px;margin-top:20px;font-size:13.5px;line-height:1.75}

.memo p+p{margin-top:10px}
.memo dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin-top:10px;font-size:12.5px;color:var(--g2)}
.backtext{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:4px 0}
.fits{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.fits div{background:var(--g0);border-radius:10px;padding:11px 8px;font-size:12.5px;text-align:center;line-height:1.45}
.rec{display:flex;align-items:center;gap:14px;background:var(--g0);border-radius:var(--r-card);padding:11px 14px;margin-top:8px;width:100%;text-align:left}
.rec b{display:block;font-size:14.5px}
.rec span{font-size:12px;color:var(--g2)}
.rec .chev{margin-left:auto}
.aic{font-size:13.5px;line-height:1.8}
.profile{display:flex;align-items:center;gap:20px;margin:22px 0 6px}
.pimg{position:relative;width:64px;height:64px;min-width:64px;aspect-ratio:1;padding:0;border-radius:50%;background:#F6F4F1;display:grid;place-items:center;flex-shrink:0}.pimg>img,.pimg>canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}

.profile b{font-size:18px}
.profile p{font-size:13px;line-height:1.5}

.statrow>*{background:var(--g0);border-radius:10px;text-align:center;padding:16px 4px 12px;border:0;font:inherit;color:inherit}.statrow button{cursor:pointer}
.pname{background:none;border:0;padding:4px 0;font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center;gap:6px}.pname .chev{color:#AAA;font-size:18px}
.statrow b{display:block;font-size:24px;font-weight:500;line-height:1.2}
.statrow span{font-size:12px}
.setrow{display:block;width:100%;text-align:left;background:var(--g0);border-radius:12px;padding:9px 14px;font-size:14px;color:#444;margin-top:10px}
.noti{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.noti p{font-size:13.5px;line-height:1.55}
.noti span{font-size:11.5px;color:var(--g2)}
.state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:30px}
.state h2{font-size:19px;font-weight:700;margin-top:22px}
.state p{font-size:13.5px;color:var(--g2);margin-top:10px}
/* ---------- overlays ---------- */
.toast{position:absolute;left:50%;top:64px;bottom:auto;transform:translate(-50%,-8px);background:rgba(0,0,0,.84);color:#fff;font-size:12.5px;padding:9px 15px;border-radius:18px;
  opacity:0;transition:.25s;pointer-events:none;max-width:86%;text-align:center;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheetWrap{position:absolute;inset:0;background:rgba(0,0,0,.07);display:none;z-index:40;align-items:flex-end}
.sheetWrap.open{display:flex}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:12px 22px 24px;max-height:94%;overflow-y:auto;animation:up .3s ease}
.grab{width:52px;height:5px;border-radius:3px;background:#000;margin:0 auto 18px;position:relative;touch-action:none;cursor:grab}.grab::after{content:'';position:absolute;inset:-16px -80px}   /* 잡기 쉬운 넓은 손잡이 */
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
/* ---------- v2 components ---------- */
.opt,.rowlink,.chip,.noti,.setrow{transition:background .15s}
button.opt:hover,.rowlink:hover,.setrow:hover{background:var(--g1)}
button.chip:hover{background:#DADADA}
button.chip.sel:hover{background:#000}
canvas.wcd{display:block;flex-shrink:0}
canvas.wcd.big{margin:14px auto}
.center canvas.wcd{margin:0 auto}
.in-fwd{animation:inFwd .45s cubic-bezier(.2,.7,.3,1)}
.in-back{animation:inBack .45s cubic-bezier(.2,.7,.3,1)}

@keyframes inFwd{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}

    R.classList.toggle('kb', f&&(R._kbFocusOnly||h<full*.82)); };   // 입력 중 + 화면이 키보드만큼 줄었을 때만 숨긴다(뒤로가기로 키보드만 내려도 다시 보이게)
  addEventListener('focusin',e=>{ if(typing(e.target)){ R._kbFocusOnly=true; R.classList.add('kb'); setTimeout(()=>{ R._kbFocusOnly=false; upd(); },700); } });   // 키보드가 올라오는 동안엔 우선 숨기고, 다 올라온 뒤엔 높이로 판단
  addEventListener('focusout',()=>setTimeout(()=>{ if(!typing(document.activeElement)) R.classList.remove('kb'); },60));
  (window.visualViewport||window).addEventListener('resize',upd); })();</script>
<script>(function(){ const R=document.documentElement, f=()=>{ const coarse=matchMedia('(pointer:coarse)').matches; R.classList.toggle('mob', innerWidth<=700 || (coarse && Math.min(screen.width,screen.height)<=520)); }; f(); addEventListener('resize',f); })();</script>

/* 차 종류별로 흔한 찻물 색(색 계열, 진하기): 색 질문에서 미리 골라 둔다 */
const TC_GUESS={green:[.42,.32],white:[.33,.24],oolong:[.24,.5],black:[.06,.78],dark:[.13,.9],herb:[.3,.36]};
const tcHx=h=>{ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; };
const tcMix=(a,b,t)=>'#'+tcHx(a).map((v,i)=>Math.round(v+(tcHx(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
function tcBase(h){ const f=Math.max(0,Math.min(1,h))*(TC_FAM.length-1), i=Math.min(TC_FAM.length-2,Math.floor(f)); return tcMix(TC_FAM[i][1],TC_FAM[i+1][1],f-i); }
const tcColor=(h,d)=>{ const c=tcBase(h); return d<.5?tcMix('#FBF8EE',c,.25+d*1.5):tcMix(c,'#2A1A12',(d-.5)*.9); };
function tcName(h,d){ const f=TC_FAM[Math.round(Math.max(0,Math.min(1,h))*(TC_FAM.length-1))][0];
  if(d>=.75){ if(f==='빨강') return '적갈색'; if(f==='주황') return '갈색'; if(f==='노랑') return '호박색'; }
  if(d<.5&&f==='빨강') return d<.25?'맑은 분홍빛':'분홍빛';
  if(h>=.2&&h<.3&&d>=.38&&d<.75) return '황금빛';
  return (d<.25?'맑은 ':d<.5?'연한 ':d<.75?'':'진한 ')+f; }

const daysAgo=n=>{ const d=new Date(); d.setDate(d.getDate()-n); return d; };
const fmtDate=d=>`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}.`;

const CLEAR='#D9E0E3'; // 분석 전: 아직 색이 없는 맑은 물
function teaDrop(type){
  if(type==='clear') return {id:'clear',comps:[{key:'water',c:CLEAR,w:.6}]};
  if(!type) return {id:'empty',comps:[{key:'tea',c:'#C4C4C4',w:.85}]};
  const c=TEAS[type].color;

}
function recDrop(r){
  if(!r.flavors||!r.flavors.length) return {...teaDrop(r.type),id:'rb-'+r.id};
  return {id:r.id,comps:[{key:'tea',c:TEAS[r.type].color,w:.5},...r.flavors.map(f=>({key:f.k,c:FLAVORS[f.k].color,w:f.w}))]};
}

const DROPS={}, BMP=new Map();
function orb(src,size,cls=''){
  const drop = src && typeof src==='object' ? (src.comps?src:recDrop(src)) : teaDrop(src);

}

function dropFlav(drop){ const f=(drop.comps||[]).filter(c=>FLAVORS[c.key]); const L=f.length?f.map(c=>({k:c.key,c:FLAVORS[c.key].color,w:c.w})):[{k:'clear',c:CLEAR,w:.6}]; return L; }

function dropBitmap(drop,px,rk=.33){
  const k=drop.id+'|'+px+'|'+rk+'|'+drop.comps.map(c=>c.key+c.w.toFixed(2)).join();
  if(BMP.has(k)) return BMP.get(k);
  if(BMP.size>300) BMP.clear();
  const c=document.createElement('canvas'); c.width=c.height=px; const x=c.getContext('2d');
  drawRec1(x,dropFlav(drop),px/2,px/2,px*rk,dropSid(drop),CV_SPREAD+1.4,.95);

}

function spreadDrops(root){ if(!root) return;
  // 화면에 들어오는 순간 번지기 시작한다(스크롤해서 새로 보이는 찻방울도 그때 번짐). 같이 들어온 것끼리는 조금씩 차례로
  let batch=0, batchT=0;
  const run=cv=>{ const drop=DROPS[cv.dataset.dk]; if(!drop) return; const now=performance.now(); if(now-batchT>250){ batch=0; } batchT=now;
    const px=pxFor(+cv.dataset.sz); cv.width=cv.height=px; const x=cv.getContext('2d'), L=dropFlav(drop), sid=dropSid(drop), END=CV_SPREAD+1.4, t0=now+Math.min(batch++,8)*90;
    (function f(now){ if(!cv.isConnected) return; const lt=(now-t0)/1000*2.2; if(lt>0){ x.clearRect(0,0,px,px); drawRec1(x,L,px/2,px/2,px*.33,sid,Math.min(END,lt),.95); } if(lt<END) requestAnimationFrame(f); })(t0); };
  const cvs=[...root.querySelectorAll('canvas.wcd:not([data-done])')]; cvs.forEach(cv=>cv.dataset.done='1');
  if(!('IntersectionObserver' in window)) return cvs.forEach(run);
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); run(e.target); } }),{root:$('#view'),threshold:.35});
  cvs.forEach(cv=>io.observe(cv)); }
function paintDrops(root=document){
  root.querySelectorAll('canvas.wcd:not([data-done])').forEach(cv=>{
    const drop=DROPS[cv.dataset.dk]; if(!drop) return;
    const px=pxFor(+cv.dataset.sz); cv.width=cv.height=px;
    cv.getContext('2d').drawImage(dropBitmap(drop,px,cv.classList.contains('big')?.4:.33),0,0);   // 큰 칸(Tea Tag)은 번짐을 칸에 더 꽉 차게 cv.dataset.done='1';

}

const TAB_OF = {canvas:'canvas',detail:'canvas',my:'my',noti:''};
let NAV_DIR='fade';
function go(name,params={},opt={}){
  NAV_DIR = opt.reset ? 'fade' : 'fwd';
  if(opt.reset) S.stack=[];
  if(opt.replace) S.stack.pop();
  S.stack.push({name,params});
  if(!opt.replace&&!(opt.reset&&name==='home')) try{ history.pushState({tc:S.stack.length},''); }catch(e){}   // 홈이 아니면 뒤로가기가 앱 안에서 멈추게 한 칸 남긴다
  render();
}
function back(){
  if(history.state&&history.state.tc&&S.stack.length>1){ history.back(); return; }   // 휴대폰 뒤로가기와 같은 길로
  NAV_DIR='back';
  if(S.stack.length>1){S.stack.pop();render();}
  else go('home',{},{reset:true});
}
function goTab(tab,force){ if(!force&&recording()) return askQuit(tab); closeSheet(); go(tab,{},{reset:true}); }
function rerender(){ render(true); }
function backToChat(){ NAV_DIR='back'; const i=S.stack.map(x=>x.name).lastIndexOf('chat'); if(i<0) return back(); S.stack=S.stack.slice(0,i+1); render(); }
function render(keepScroll){
  const view=$('#view'); const top=view.scrollTop;
  const cur=S.stack[S.stack.length-1];
  const fn=SCREENS[cur.name];
  try{
    if(!fn) throw new Error('없는 화면: '+cur.name);
    view.innerHTML=`<div class="scr scr-${cur.name} ${keepScroll?'':'in-'+NAV_DIR}">${fn(cur.params||{})}</div>`;
    view.scrollTop = keepScroll ? top : 0;
    const tab = cur.name in TAB_OF ? TAB_OF[cur.name] : 'home';
    document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
    if(VOICE.on&&cur.name!=='chat'){ VOICE.on=false; VOICE.tid++; S.listening=false; try{ VOICE.rec&&VOICE.rec.abort(); }catch(e){} hush(); }
    fitIn(view);
    (AFTER[cur.name]||(()=>{}))(cur.params||{});
    fitIn(view,false);
    paintDrops(view);
  }catch(e){ console.warn('화면 오류',e); view.innerHTML=`<div class="scr scr-error in-fade">${SCREENS.error({})}</div>`; }
}

function matchFlavors(text){ const raw=String(text||''), t=raw.replace(/\s/g,''), lo=' '+raw.toLowerCase().replace(/[^a-z]+/g,' ')+' ';
  const neg=i=>{ let seg=t.slice(i,i+16); const c=seg.search(/(고(?!소)|며|지만|는데|그리고|[,.!?~])/); if(c>=0) seg=seg.slice(0,c);
    const nx=allKw().reduce((m,w)=>{ const j=seg.indexOf(w,1); return j>0&&j<m&&!/^(이?나|이?랑|와|과|하고|및|도)$/.test(seg.slice(0,j))?j:m; },seg.length); seg=seg.slice(0,nx);   // 다른 풍미 낱말이 나오면 거기까지만('A나 B는 없어요'처럼 묶인 건 함께)   // 같은 마디 안에서만 본다(‘꽃향이 나고 쓴맛은 없어요’)

  openSheet(`<div class="grab"></div><h1 class="t">마신 차 종류</h1><p class="sub">누르면 그 종류의 기록만 볼 수 있어요.</p>
    <div class="typelist">${ORDER.filter(k=>n(k)).map(k=>`<button onclick="showType('${k}')"><span class="tb">${teabag(k)}</span><b>${TEAS[k].label}</b><span class="muted">${n(k)}잔</span><span class="chev">›</span></button>`).join('')}</div>
    <div style="height:10px"></div><button class="link" onclick="closeSheet()">닫기</button>`); }
function showType(k){ closeSheet(); S.filter={q:'',type:k,date:'all',fl:[],from:'',to:''}; go('canvas',{tab:'list'},{reset:true}); }
function resetFilter(){ S.filter={q:'',date:'all',fl:[],from:'',to:''}; rerender(); }
const near=(a,b)=>{ if(Math.abs(a.length-b.length)>1) return a.includes(b.slice(0,-1))&&b.length>3; let i=0,j=0,e=0; while(i<a.length&&j<b.length){ if(a[i]===b[j]){i++;j++;continue;} if(++e>1) return false; if(a.length>b.length) i++; else if(b.length>a.length) j++; else {i++;j++;} } return e+(a.length-i)+(b.length-j)<=1; };   // 오타 한 글자
function filtered(){
  const f=S.filter, q=f.q.trim().replace(/\s/g,'').toLowerCase(), now=new Date();
  const from=f.date==='range'?(f.from?new Date(f.from+'T00:00').getTime():0):{all:0,'1m':now.getTime()-31*864e5,'3m':now.getTime()-92*864e5,'1y':new Date(now.getFullYear(),0,1).getTime()}[f.date];
  const to=f.date==='range'&&f.to?new Date(f.to+'T23:59:59').getTime():Infinity;
  return sortRecs().filter(r=>{
    if((r.ts||0)<from||(r.ts||0)>to) return false;
    if(f.type&&r.type!==f.type) return false;
    if(f.fl.length&&!f.fl.every(k=>flAll(r).includes(k))) return false;   // 고른 풍미가 모두 담긴 기록만
    if(!q) return true;
    const hay=[r.name,r.brand,r.comment,TEAS[r.type].label,...(r.exprs||[]),...(r.tags||[]),...(r.flavors||[]).flatMap(x=>[FLAVORS[x.k].label,HOME_EN[x.k]])].join(' ').replace(/\s/g,'').toLowerCase();
    return hay.includes(q)||(q.length>=3&&near(String(r.name).replace(/\s/g,'').toLowerCase(),q));
  });
}
/* 풍미 필터: 고른 풍미 중 하나라도 담긴 기록을, 그 풍미가 진한 순서로 */
const flScore=r=>(r.flavors||[]).filter(x=>S.filter.fl.includes(x.k)).reduce((s,x)=>s+x.w,0);
function toggleFl(k){ const a=S.filter.fl; if(k==='all') a.length=0; else { const i=a.indexOf(k); i<0?a.push(k):a.splice(i,1); } const fs=$('#flSheet'); if(fs) fs.innerHTML=flRow(); { const g=$('#flGo'); if(g) g.textContent=flBtn(); } rerender(); }
function typeRow(){ const t=S.filter.type; return `<div class="flchips"><button class="fchip ${t?'':'on'}" onclick="toggleType('')">전체</button>${ORDER.map(k=>`<button class="fchip ${t===k?'on':''}" onclick="toggleType('${k}')">${TEAS[k].label}</button>`).join('')}</div>`; }
function toggleType(k){ S.filter.type=S.filter.type===k?'':k; const ts=$('#tySheet'); if(ts) ts.innerHTML=typeRow(); { const g=$('#flGo'); if(g) g.textContent=flBtn(); } rerender(); }
function flRow(){ const a=S.filter.fl; return `<div class="flchips"><button class="fchip ${a.length?'':'on'}" onclick="toggleFl('all')">전체</button>${FKEYS.map(k=>`<button class="fchip flc ${a.includes(k)?'on':''}" onclick="toggleFl('${k}')"><i style="background:${FLAVORS[k].color}"></i>${HOME_EN[k]}${isEN()?'':`<small>${FLAVORS[k].label}</small>`}</button>`).join('')}</div>`; }
/* 기록 목록: 달력 · 필터 아이콘 → 시트에서 고르기. 고른 조건은 검색창 아래 칩으로 보이고 ×로 지움 */
const DATE_LB={all:'전체','1m':'1개월','3m':'3개월','1y':'올해'};
const fmtD=v=>v?v.slice(2).replace(/-/g,'.'):'';
function dateLabel(){ const f=S.filter; return f.date==='range'?(f.from===f.to?fmtD(f.from):`${fmtD(f.from)} ~ ${fmtD(f.to)}`):DATE_LB[f.date]; }
function activeChips(){ const f=S.filter, out=[];
  if(f.type&&TEAS[f.type]) out.push(`<button class="achip" onclick="S.filter.type='';rerender()">${TEAS[f.type].label} ✕</button>`);
  if(f.date!=='all') out.push(`<button class="achip" onclick="S.filter.date='all';rerender()">${dateLabel()} ✕</button>`);
  f.fl.forEach(k=>out.push(`<button class="achip" onclick="toggleFl('${k}')"><i style="background:${FLAVORS[k].color}"></i>${HOME_EN[k]} ✕</button>`));
  return out.length?`<div class="achips">${out.join('')}</div>`:''; }
/* 기간: 1개월·3개월 같은 빠른 선택 + 달력에서 하루(한 번 누르기) 또는 며칠부터 며칠까지(두 번 누르기). 기록한 날엔 점 */
const ymd=t=>{ const d=new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function openDateSheet(){ const f=S.filter, base=f.date==='range'&&f.from?new Date(f.from+'T00:00'):new Date();
  S.cal={y:base.getFullYear(),m:base.getMonth(),a:f.date==='range'?f.from:'',b:f.date==='range'?f.to:''};
  openSheet(`<div class="grab"></div><h1 class="t">기간</h1>
    <div class="dpre">${Object.entries(DATE_LB).map(([v,t])=>`<button class="fchip ${f.date===v?'on':''}" onclick="S.filter.date='${v}';closeSheet();rerender()">${t}</button>`).join('')}</div>
    <div id="calBox">${calHTML()}</div>
    <button class="btn" id="calGo" onclick="applyRange()">${calBtn()}</button>`); }
function calHTML(){ const c=S.cal, first=new Date(c.y,c.m,1), days=new Date(c.y,c.m+1,0).getDate(), lead=first.getDay(), today=ymd(Date.now());
  const has=new Set(S.records.map(r=>ymd(r.ts||0))), lo=c.a&&c.b?(c.a<c.b?c.a:c.b):c.a, hi=c.a&&c.b?(c.a<c.b?c.b:c.a):c.a;
  let cells=''; for(let i=0;i<lead;i++) cells+='<span></span>';
  for(let d=1;d<=days;d++){ const k=`${c.y}-${String(c.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`, fut=k>today;
    const cls=[k===lo||k===hi?'pick':'',lo&&hi&&k>lo&&k<hi?'mid':'',k===today?'today':'',has.has(k)?'has':''].join(' ');
    cells+=`<button class="${cls}" ${fut?'disabled':''} onclick="calTap('${k}')">${d}</button>`; }
  return `<div class="cal"><div class="cal-h"><button onclick="calMove(-1)" aria-label="이전 달">‹</button><b>${c.y}년 ${c.m+1}월</b><button onclick="calMove(1)" aria-label="다음 달">›</button></div>
    <div class="cal-w">${'일월화수목금토'.split('').map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-g">${cells}</div>
    <p class="cal-tip">${!c.a?'하루를 누르거나, 시작 날과 끝 날을 차례로 눌러주세요':!c.b?'끝 날을 누르면 기간이 돼요':'다시 누르면 새로 골라요'} · <i></i> 기록한 날</p></div>`; }
function calBtn(){ const c=S.cal; if(!c.a) return '날짜를 골라주세요'; const lo=c.b&&c.b<c.a?c.b:c.a, hi=c.b?(c.b<c.a?c.a:c.b):c.a;
  const n=S.records.filter(r=>{ const k=ymd(r.ts||0); return k>=lo&&k<=hi; }).length; return `${fmtD(lo)}${hi!==lo?' ~ '+fmtD(hi):''} 기록 ${n}개 보기`; }
function calPaint(){ $('#calBox').innerHTML=calHTML(); $('#calGo').textContent=calBtn(); }
function calTap(k){ const c=S.cal; if(!c.a||c.b){ c.a=k; c.b=''; } else c.b=k; calPaint(); }
function calMove(n){ const c=S.cal; c.m+=n; if(c.m<0){ c.m=11; c.y--; } if(c.m>11){ c.m=0; c.y++; } calPaint(); }
function applyRange(){ const c=S.cal; if(!c.a) return toast('날짜를 골라주세요'); let a=c.a, b=c.b||c.a; if(a>b) [a,b]=[b,a];
  Object.assign(S.filter,{date:'range',from:a,to:b}); closeSheet(); rerender(); }
function openFlSheet(){ openSheet(`<div class="grab"></div><h1 class="t">필터</h1><p class="sub">차 종류와 풍미로 기록을 골라봐요.</p>
    <h3 class="sec" style="margin:16px 0 8px">차 종류</h3><div id="tySheet">${typeRow()}</div>
    <h3 class="sec" style="margin:16px 0 8px">풍미 <small class="muted" style="font-weight:400">· 고른 풍미가 모두 담긴 기록</small></h3><div id="flSheet">${flRow()}</div><div style="height:18px"></div><button class="btn" id="flGo" onclick="closeSheet()">${flBtn()}</button>`); }
const flBtn=()=>S.filter.fl.length||S.filter.type?`기록 ${filtered().length}개 보기`:'보기';
const flAll=r=>[...new Set([...(r.flavors||[]).map(x=>x.k),...(r.flAll||[])])];
function gridHTML(){
  const rs=filtered();
  if(!rs.length) return `<div class="empty-q"><p>조건에 맞는 기록이 없어요.</p>${(S.filter.q||S.filter.type||S.filter.date!=='all'||S.filter.fl.length)?`<button class="btn line" style="width:auto;padding:0 22px;margin:14px auto 0" onclick="resetFilter()">조건 지우기</button>`:''}</div>`;

}

function startRecord(force){ const v=!force&&(loadLive()||loadPaused());
  if(v) return openSheet(`<div class="grab"></div><h1 class="t" style="margin-top:14px">작성 중인 기록이 있어요</h1><p class="sub">‘${esc(v.draft.name||'새 기록')}’을 이어서 할까요?<br>새로 시작하면 작성 중인 기록은 지워져요.</p><div style="height:22px"></div>

  closeSheet(); stopTimer(); S.draft=newDraft(); S.chatMode='chat'; go('chat',{}, {reset:true}); }
function openDetail(id){ closeSheet(); if(!(cur() in TAB_OF)||cur()==='my'||cur()==='noti') S.stack=[{name:'canvas',params:{tab:'list'}}]; go('detail',{id}); }

/* 기록 삭제: 확인 후 지운다 */
/* 기록 그만하기: 저장해두면 홈에서 이어서 할 수 있다 */
const PAUSE_KEY=SAMPLE?'teacanvas.v6.many.paused':'teacanvas.v6.paused';
let PAUSED_MEM;  // 브라우저 저장소를 못 쓰는 환경에서도 이 화면을 닫기 전까지는 이어할 수 있게
function loadPaused(){ let v=PAUSED_MEM; try{ const raw=localStorage.getItem(PAUSE_KEY); if(raw!==null) v=JSON.parse(raw); }catch(e){} return v&&v.draft&&Array.isArray(v.stack)&&v.stack.length?v:null; }
const LIVE_KEY=PAUSE_KEY+'.live';
function snapDraft(){ return {draft:S.draft,stack:S.stack.map(x=>({name:x.name,params:x.params||{}})).filter(x=>REC_SCREENS.includes(x.name)),chatMode:S.chatMode,timer:S.timer?{...S.timer}:null,at:Date.now()}; }
function loadLive(){ try{ const v=JSON.parse(localStorage.getItem(LIVE_KEY)||'null'); return v&&v.draft&&Array.isArray(v.stack)&&v.stack.length?v:null; }catch(e){ return null; } }
function saveLive(){ try{ if(!S.typing&&S.draft&&recording()&&S.draft.chat.some(m=>m.who==='me')) localStorage.setItem(LIVE_KEY,JSON.stringify(snapDraft())); }catch(e){} }
function clearLive(){ try{ localStorage.removeItem(LIVE_KEY); }catch(e){} }
setInterval(saveLive,3000); addEventListener('pagehide',saveLive); document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveLive(); });
function savePaused(v){ PAUSED_MEM=v||null; try{ v?localStorage.setItem(PAUSE_KEY,JSON.stringify(v)):localStorage.removeItem(PAUSE_KEY); }catch(e){} }
function askQuit(to){ const other=loadPaused();
  S.quitTo=typeof to==='string'?to:'home';
  if(!S.draft||!S.draft.chat.some(m=>m.who==='me')) return quitRecord(false,true);
  if(VOICE.on) stopVoice();   // 아직 아무것도 안 남겼으면 묻지 않고 바로 나간다
  openSheet(`<div class="grab"></div>
    <h1 class="t" style="margin-top:14px">기록을 그만할까요?</h1>
    <p class="sub">저장해두면 홈에서 이어서 기록할 수 있어요.${other&&other.draft.tid!==(S.draft&&S.draft.tid)?`<br>앞서 저장해둔 ‘${esc(other.draft.name||'새 기록')}’ 기록은 이 기록으로 바뀌어요.`:''}</p>
    <div style="height:26px"></div>
    <button class="btn" onclick="quitRecord(true)">저장하고 나가기</button>
    <button class="btn line" onclick="quitRecord(false)">저장하지 않고 나가기</button>
    <button class="link" onclick="closeSheet()">계속 기록하기</button>`);
}
function quitRecord(keep,quiet){
  if(S.typing){ closeSheet(); return setTimeout(()=>quitRecord(keep,quiet),250); }
  if(VOICE.on) stopVoice();
  if(keep&&S.draft) savePaused(snapDraft()); clearLive();
  closeSheet(); stopTimer(); S.draft=null; S.listening=false; goTab(S.quitTo||'home',true); S.quitTo=null;
  if(!quiet) toast(keep?'기록을 저장해뒀어요':'기록을 지웠어요');
}
function resumeRecord(){
  const lv=loadLive(), v=lv||loadPaused(); if(!v){ rerender(); return toast('이어할 기록을 찾지 못했어요'); } if(lv) clearLive(); else savePaused(null);
  S.ask={hd:v.draft.stage==='color'&&TC_GUESS[v.draft.type]?[...TC_GUESS[v.draft.type]]:null,sel:[]};
  if(v.timer&&v.timer.running!==false&&v.at) v.timer.left=Math.max(0,v.timer.left-Math.round((Date.now()-v.at)/1000));   // 나가 있던 동안에도 차는 계속 우러났다
  // 예전 버전에서 멈춘 기록(지금은 없는 화면)이면 채팅으로 이어간다
  const OLD=['teaInput','teaConfirm','searchError','brew','feel','depth','deepBrew','deepOrigin','deepTemp','deepMemo'];
  let stack=v.stack.filter(x=>x&&SCREENS[x.name]&&!OLD.includes(x.name)); if(!stack.length||!['chat','organizing','analyzing','compare'].includes(stack[stack.length-1].name)) stack=[{name:'chat',params:{}}];
  if(['organizing','analyzing'].includes(stack[stack.length-1].name)) stack=[{name:'chat',params:{}}];
  closeSheet(); stopTimer(); S.draft=v.draft; S.timer=v.timer&&v.timer.left>0?{...v.timer,running:v.timer.running!==false}:null; S.chatMode=v.chatMode||'chat'; S.listening=false; NAV_DIR='fade'; S.stack=stack; try{ history.pushState({tc:S.stack.length},''); }catch(e){} render(); if(S.draft.stage==='wait'||S.draft.stage==='wait2') talkNext(2500);
}

  for(let k=0;k<3;k++) c=c.replace(/(인데|는데)$/,'').trim().replace(/^(오늘은?|지금|이거|이건|저는?|나는?)\s+/,'').replace(/\s*(마시는\s*중|마시고\s*있(어요|어|음)?|마시는|마셨어요|마셔요|마실게요|샀어요|산\s*거|사\s*왔어요|받았어요|선물\s*받은\s*거)$/,'').trim();

/* AI 중간 서버 호출(공용). mode: 'question' | 'compare'. 실패·시간 초과면 null → 정해진 대답 */

  const t2=setTimeout(()=>{ if(vAlive(id)&&!got&&!VOICE.interim){ const st=$('#vState'); if(st) st.textContent=L('잘 안 들려요. 조금 더 가까이 말하거나, ■를 누르고 글로 적어도 돼요'); } },8000);
  r.onend=()=>{ clearTimeout(t1); clearTimeout(t2); res(got.trim()||null); }; try{ r.start(); }catch(e){ res(null); } }); }
/* 들은 말을 대화로 보내기 */
async function takeHeard(d,heard){ d.voice.push(heard); VOICE.interim=heard; VOICE.phase='thinking'; S.listening=false; paintVoice(); VOICE.spoken=Math.max(VOICE.spoken,d.chat.length); const n0=d.chat.length; sendMsg(heard); d.chat.slice(n0).forEach(m=>{ if(m.who==='me') m.voice=true; });
  VOICE.spoken=Math.min(VOICE.spoken,d.chat.length); await new Promise(r=>setTimeout(r,500)); }
/* 끼어들기: 봇이 말하는 동안 마이크를 함께 켜 두고, 봇이 하는 말이 아닌 소리가 들리면 봇 목소리를 멈춘다 */
function bargeListen(id,line){ const norm=t=>String(t||'').replace(/[^가-힣a-z0-9]/gi,'').toLowerCase(), said=norm(line);
  let r, cut=false, got='', mid='', ended=false, done; const p=new Promise(res=>done=res);
  try{ r=new SR(); r.lang=isEN()?'en-US':'ko-KR'; r.interimResults=true; r.continuous=false; VOICE.rec=r; }catch(e){ return null; }
  r.onresult=e=>{ let fin='', m=''; for(const x of e.results){ (x.isFinal?(fin+=x[0].transcript):(m+=x[0].transcript)); } const t=fin||m, n=norm(t);
    if(!cut&&n.length>=2&&!said.includes(n)){ cut=true; hush(); VOICE.phase='listening'; S.listening=true; }   // 봇 목소리가 다시 들린 게 아니면 끊기
    if(cut){ VOICE.interim=t; if(fin) got=fin; mid=t; paintVoice(); } };
  r.onerror=()=>{}; r.onend=()=>{ ended=true; done(cut?(got||mid).trim()||null:null); };
  try{ r.start(); }catch(e){ return null; }
  return { finish(){ if(!cut&&!ended){ try{ r.abort(); }catch(e){} } return p; } }; }
async function voiceLoop(id){
  while(vAlive(id)){
    const d=S.draft;
    if(S.typing){ await new Promise(r=>setTimeout(r,300)); continue; }
    if(VOICE.spoken<d.chat.length){ const m=d.chat[VOICE.spoken++]; if(m.who!=='bot') continue;
      VOICE.phase='speaking'; S.listening=false; VOICE.interim=''; paintVoice();   // 봇이 말하기 시작하면 이미 보낸 내 말은 지운다
      const line=speakLine(m), barge=(!VOICE.demo&&SR)?bargeListen(id,line):null;   // 말하는 동안에도 듣다가, 내가 말하면 바로 끊는다
      await speak(line); if(!vAlive(id)) break;
      const cut=barge?await barge.finish():null; if(cut){ await takeHeard(d,cut); }
      continue; }
    VOICE.phase='listening'; S.listening=true; VOICE.interim=''; paintVoice();
    const heard=await listenOnce(id); if(!vAlive(id)) break; S.listening=false;
    if(heard) await takeHeard(d,heard);
    else await new Promise(r=>setTimeout(r,VOICE.demo?1500:300));
    if(['organizing','analyzing'].includes(cur())) break;
  }
  if(VOICE.tid===id&&VOICE.on&&cur()!=='chat'){ VOICE.on=false; hush(); }
}
function paintVoice(){ const d=S.draft; if(!d) return;
  const st=$('#vState'), hd=$('#vHeard');
  if(st) st.textContent=L(VOICE.phase==='speaking'?(!VOICE.demo&&SR?'대답하는 중… 말하면 끊을 수 있어요':'대답하는 중…'):VOICE.phase==='listening'?(VOICE.demo?'시연용 목소리로 대답하는 중…':'듣고 있어요'):'생각하는 중…');
  if(hd) hd.textContent=VOICE.interim||''; }
function finishChat(force){ if(VOICE.on) stopVoice(); S.listening=false; stopTimer();
  if(!force&&S.draft&&!collectExprs(S.draft).length){ go('thin'); return; } if(S.draft){ S.draft.useDeep=true; if(S.draft.drinkAt) S.draft.endAt=Date.now(); } go('organizing'); }

function bindPick(cv,d=S.draft,drop=draftDrop(d),skip=null,drag=false){
  const others=recsAsc().filter(r=>r.id!==skip), ctx=cv.getContext('2d'), bg=document.createElement('canvas');
  const px=pxFor(cv.clientWidth); cv.width=cv.height=bg.width=bg.height=px;
  const b=bg.getContext('2d'); b.fillStyle=CANVAS_BG; b.fillRect(0,0,px,px); axes(b,px);
  others.forEach(r=>drawRec1(b,recFlav(r),r.canvas.x*px,r.canvas.y*px,R1(px),r.id,CV_SPREAD,.25));
  const L=dropFlav(drop), sid=dropSid(drop);
  let prog=1, holding=false, raf=0, t0=0, last=0;
  const frame=()=>{ ctx.drawImage(bg,0,0); if(d.canvas) drawRec1(ctx,L,d.canvas.x*px,d.canvas.y*px,R1(px),sid,prog*(CV_SPREAD+1.4),.88); };
  const loop=now=>{
    if(!cv.isConnected){ raf=0; return; }
    last=now; prog=Math.min(1,(now-t0)/1500); frame();
    if(holding||prog<1) raf=requestAnimationFrame(loop); else { raf=0; }
  };
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:clamp((e.clientX-r.left)/r.width),y:clamp((e.clientY-r.top)/r.height)}; };
  frame();
  // 톡 누르면 그 자리에 찍힌다(다시 누르면 새 자리로). 끌면 화면이 스크롤될 뿐 방울이 따라오지 않는다
  if(drag){   // 위치 옮기기: 누른 채 끌면 방울이 따라온다
    cv.onpointerdown=e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); holding=true; d.canvas={...pos(e),i:d.canvas?d.canvas.i:.6}; if(!raf) raf=requestAnimationFrame(loop); };
    cv.onpointermove=e=>{ if(holding){ Object.assign(d.canvas,pos(e)); } };
    const up=()=>{ if(!holding) return; holding=false; const c=$('#pickCap'); if(c) c.textContent=posText(d.canvas); }; cv.onpointerup=up; cv.onpointercancel=up; return; }
  let down=null; cv.onpointerdown=e=>{ down={x:e.clientX,y:e.clientY}; };
  cv.onpointerup=e=>{ if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>10){ down=null; return; } down=null;
    d.canvas={...pos(e),i:.6}; t0=last=performance.now(); prog=0; if(!raf) raf=requestAnimationFrame(loop); { const sb=$('#saveBtn'); if(sb) sb.classList.remove('off'); } const c=$('#pickCap'); if(c) c.textContent=posText(d.canvas); };
  cv.onpointercancel=()=>{ down=null; };
}

function dismissOverlay(){ const m=document.querySelector('.actmenu'); if(m){ m.remove(); return true; } if($('#sheetWrap').classList.contains('open')){ closeSheet(); return true; } return false; }
addEventListener('popstate',()=>{
  if(dismissOverlay()){ history.pushState({tc:S.stack.length},''); return; }
  if(cur()==='chat'&&recording()){ history.pushState({tc:S.stack.length},''); askQuit(); return; }
  NAV_DIR='back'; if(S.stack.length>1){ S.stack.pop(); render(); } else if(cur()!=='home') go('home',{},{reset:true}); });
go('home',{},{reset:true});
{ let re=null; try{ re=sessionStorage.getItem('tc.reopen'); sessionStorage.removeItem('tc.reopen'); }catch(e){} if(re==='app'){ goTab('my',true); openSettings('app'); } }   // 언어를 바꾼 뒤 설정 창으로 돌아오기
</script>
