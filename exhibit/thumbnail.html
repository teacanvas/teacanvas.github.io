<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>TEA CANVAS 전시 썸네일</title>
<style>
/* 전시용 썸네일: 글자 없이 그림만 (16:9). ?a = 캔버스만, ?b = 캔버스 + 폰 */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}
.bg{position:absolute;inset:0;width:1920px;height:1080px}
.phone{position:absolute;left:50%;top:50%;width:396px;height:836px;transform:translate(-50%,-50%);border-radius:56px;background:#111;padding:12px;display:none}
.phone img{display:block;width:100%;height:100%;border-radius:44px;object-fit:cover;object-position:top}
body.b .phone{display:block}
body.b .bg{opacity:.85}
</style></head><body>
<img class="bg" src="canvas-v5.png" alt="">
<div class="phone"><img src="home-v5.png" alt=""></div>
<script>if(location.search.includes('b')) document.body.classList.add('b');</script>
</body></html>
