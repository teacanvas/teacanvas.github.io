# ai-worker/ 가 바뀌어 푸시되면 Cloudflare Worker(teacanvas-ai)에 자동 배포
# 필요한 저장소 비밀값: CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers 권한), CLOUDFLARE_ACCOUNT_ID
# (선택) GEMINI_TEST_KEY: 있으면 시험용 서버(teacanvas-ai-test)도 같은 코드로 배포하고 이 키를 넣는다
name: Deploy AI worker
on:
  push:
    paths: ['ai-worker/**', '.github/workflows/deploy-ai-worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: chk
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then echo "Cloudflare 비밀값이 아직 없어 배포를 건너뜁니다"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Test worker
        if: steps.chk.outputs.ok == 'true'
        run: node tests/ai-worker.mjs
      - name: Deploy
        if: steps.chk.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ai-worker
          command: deploy
      - name: Deploy test worker (시험용 키가 있을 때만)
        if: steps.chk.outputs.ok == 'true'
        working-directory: ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEST_KEY: ${{ secrets.GEMINI_TEST_KEY }}
        run: |
          if [ -z "$TEST_KEY" ]; then echo "GEMINI_TEST_KEY가 없어 시험용 서버는 건너뜁니다"; exit 0; fi
          npx --yes wrangler@3 deploy --config wrangler.test.toml
          printf '%s' "$TEST_KEY" | npx --yes wrangler@3 secret put GEMINI_API_KEY --config wrangler.test.toml
